<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>소비기록 상세 - 모담</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen flex flex-col" style="background: #FFF7F5">

  <!-- ===== 헤더 ===== -->
  <th:block th:replace="~{layout/header :: nav}"></th:block>

  <!-- ===== 메인 콘텐츠 ===== -->
  <main class="flex-1">
    <div class="max-w-[1200px] mx-auto px-8 py-12 w-full">

      <!-- 뒤로가기 -->
      <a th:href="@{/consumption-history}" href="/consumption-history"
         class="inline-flex items-center gap-2 text-[#A89089] hover:text-[#6E5A55] transition-colors mb-8">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
        <span>목록으로 돌아가기</span>
      </a>

      <!-- 비대칭 레이아웃 -->
      <div class="grid grid-cols-10 gap-8">

        <!-- ===== 왼쪽 (6/10) ===== -->
        <div class="col-span-6 space-y-6">

          <!-- 메인 상세 카드 -->
          <div class="bg-white rounded-[24px] shadow-sm p-10" style="border: 1px solid #F5E6E0">
            <div class="flex items-start justify-between mb-8">
              <div>
                <h1 class="text-3xl text-[#6E5A55] font-semibold mb-2"
                    th:text="${consumption.title}">저녁 데이트</h1>
                <p class="text-[#A89089]" th:text="${consumption.place}">이탈리안 레스토랑</p>
              </div>

              <!-- 좋아요 버튼 -->
              <form th:action="@{/consumption-detail/{id}/like(id=${consumption.id})}" method="post" class="inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit"
                        th:class="${liked} ? 'w-12 h-12 rounded-full bg-[#FCE8E3] flex items-center justify-center transition-all' : 'w-12 h-12 rounded-full bg-[#FFF7F5] hover:bg-[#FCE8E3] flex items-center justify-center transition-all'">
                  <i data-lucide="heart"
                     th:class="${liked} ? 'w-6 h-6 text-[#D9B8AE] fill-current' : 'w-6 h-6 text-[#D9B8AE]'"></i>
                </button>
              </form>
            </div>

            <!-- 정보 그리드 -->
            <div class="grid grid-cols-3 gap-6 mb-8 pb-8 border-b border-[#F5E6E0]">
              <div>
                <div class="flex items-center gap-2 text-[#A89089] mb-2">
                  <i data-lucide="calendar" class="w-4 h-4"></i>
                  <span class="text-sm">날짜</span>
                </div>
                <p class="text-[#6E5A55] font-medium" th:text="${consumption.date}">2026.05.11</p>
                <p class="text-sm text-[#A89089]" th:text="${consumption.time}">19:30</p>
              </div>

              <div>
                <div class="flex items-center gap-2 text-[#A89089] mb-2">
                  <i data-lucide="tag" class="w-4 h-4"></i>
                  <span class="text-sm">카테고리</span>
                </div>
                <p class="text-[#6E5A55] font-medium" th:text="${consumption.category}">식비</p>
              </div>

              <div>
                <div class="text-[#A89089] mb-2 text-sm">금액</div>
                <p class="text-2xl text-[#6E5A55] font-semibold">
                  ₩<span th:text="${#numbers.formatInteger(consumption.amount, 0, 'COMMA')}">45,000</span>
                </p>
              </div>
            </div>

            <!-- 메모 -->
            <div>
              <h3 class="text-[#6E5A55] font-semibold mb-4">메모</h3>
              <p class="text-[#6E5A55] leading-relaxed whitespace-pre-line"
                 style="line-height: 1.8"
                 th:text="${consumption.memo}">메모 내용</p>
            </div>

            <!-- 하단 정보 -->
            <div class="mt-8 pt-6 border-t border-[#F5E6E0] flex items-center justify-between">
              <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-[#FCE8E3] flex items-center justify-center">
                  <i data-lucide="user" class="w-4 h-4 text-[#D9B8AE]"></i>
                </div>
                <span class="text-sm text-[#A89089]" th:text="${consumption.author}">김민수</span>
              </div>
              <div class="flex items-center gap-2 text-[#A89089]">
                <i data-lucide="heart" class="w-4 h-4"></i>
                <span class="text-sm" th:text="${consumption.likes}">3</span>
              </div>
            </div>
          </div>

          <!-- 댓글 섹션 -->
          <div class="bg-white rounded-[24px] shadow-sm p-8" style="border: 1px solid #F5E6E0">
            <div class="flex items-center gap-2 mb-6">
              <i data-lucide="message-circle" class="w-5 h-5 text-[#D9B8AE]"></i>
              <h3 class="text-lg text-[#6E5A55] font-semibold">
                댓글 <span th:text="${#lists.size(comments)}">0</span>
              </h3>
            </div>

            <!-- 댓글 목록 -->
            <div class="space-y-4 mb-6">
              <th:block th:each="comment : ${comments}">
                <div class="bg-[#FFF7F5] rounded-[16px] p-5">
                  <div class="flex items-start gap-3">
                    <div class="w-10 h-10 rounded-full bg-[#FCE8E3] flex items-center justify-center flex-shrink-0">
                      <i data-lucide="user" class="w-5 h-5 text-[#D9B8AE]"></i>
                    </div>
                    <div class="flex-1">
                      <div class="flex items-center justify-between mb-2">
                        <span class="text-sm text-[#6E5A55] font-semibold" th:text="${comment.author}">작성자</span>
                        <span class="text-xs text-[#A89089]" th:text="${comment.timestamp}">방금 전</span>
                      </div>
                      <p class="text-[#6E5A55] leading-relaxed" th:text="${comment.content}">댓글 내용</p>
                    </div>
                  </div>
                </div>
              </th:block>

              <!-- 댓글 없음 -->
              <div th:if="${#lists.isEmpty(comments)}" class="text-center py-8">
                <p class="text-[#A89089] text-sm">아직 댓글이 없습니다. 첫 댓글을 남겨보세요!</p>
              </div>
            </div>

            <!-- 댓글 입력 -->
            <form th:action="@{/consumption-detail/{id}/comment(id=${consumption.id})}" method="post"
                  class="flex gap-3">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
              <div class="w-10 h-10 rounded-full bg-[#FCE8E3] flex items-center justify-center flex-shrink-0">
                <i data-lucide="user" class="w-5 h-5 text-[#D9B8AE]"></i>
              </div>
              <div class="flex-1 flex gap-2">
                <input type="text" name="content"
                       placeholder="따뜻한 댓글을 남겨보세요..."
                       class="flex-1 px-5 py-3 bg-[#FFF7F5] border border-[#F5E6E0] rounded-[16px] focus:outline-none focus:border-[#D9B8AE] transition-colors text-[#6E5A55] placeholder-[#C4B5B0]" />
                <button type="submit"
                        class="px-5 py-3 bg-gradient-to-br from-[#D9B8AE] to-[#C4A79D] text-white rounded-[16px] hover:shadow-md transition-all">
                  <i data-lucide="send" class="w-5 h-5"></i>
                </button>
              </div>
            </form>

            <!-- JS 즉시 댓글 추가 (UX 향상용) -->
            <div id="localComments" class="space-y-4 mt-4"></div>
          </div>

        </div>

        <!-- ===== 오른쪽 (4/10) ===== -->
        <div class="col-span-4">

          <!-- 이미지 카드 -->
          <div class="bg-white rounded-[24px] shadow-sm overflow-hidden sticky top-8" style="border: 1px solid #F5E6E0">

            <!-- 이미지 있을 때 -->
            <th:block th:if="${consumption.imageUrl != null}">
              <div class="relative">
                <img th:src="${consumption.imageUrl}" alt="소비 사진"
                     class="w-full h-[600px] object-cover" />
                <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/50 to-transparent p-6">
                  <p class="text-white text-sm" th:text="${consumption.title}">제목</p>
                </div>
              </div>
            </th:block>

            <!-- 이미지 없을 때 -->
            <th:block th:unless="${consumption.imageUrl != null}">
              <a th:href="@{/consumption-upload}" href="/consumption-upload"
                 class="h-[600px] w-full flex flex-col items-center justify-center p-12 text-center hover:bg-[#FFF7F5] transition-colors cursor-pointer group block">
                <div class="w-24 h-24 bg-gradient-to-br from-[#FCE8E3] to-[#F5E6E0] rounded-full flex items-center justify-center mb-6 group-hover:scale-110 transition-transform">
                  <i data-lucide="calendar" class="w-12 h-12 text-[#D9B8AE]"></i>
                </div>
                <h3 class="text-xl text-[#6E5A55] font-semibold mb-3">소중한 순간</h3>
                <p class="text-[#A89089] leading-relaxed" th:text="${consumption.title}">제목</p>
                <p class="text-sm text-[#C4B5B0] mt-4">
                  사진을 추가하여<br />추억을 더욱 생생하게 남겨보세요
                </p>
                <div class="mt-6 px-6 py-3 bg-gradient-to-br from-[#D9B8AE] to-[#C4A79D] text-white rounded-full group-hover:shadow-lg transition-all">
                  사진 추가하기
                </div>
              </a>
            </th:block>
          </div>

          <!-- 팁 카드 -->
          <div class="mt-6 bg-gradient-to-br from-[#FCE8E3] to-[#F5E6E0] rounded-[20px] p-6 shadow-sm">
            <p class="text-sm text-[#6E5A55] leading-relaxed">
              <span class="font-semibold">💡 Tip</span><br />
              소비 기록에 사진과 감정을 담아보세요. 나중에 되돌아봤을 때 더욱 소중한 추억이 됩니다.
            </p>
          </div>

        </div>
      </div>
    </div>
  </main>

  <!-- ===== 푸터 ===== -->
  <th:block th:replace="~{layout/footer :: footer}"></th:block>

  <script th:inline="javascript">
    /* 현재 사용자 이름 (서버에서 주입) */
    const currentUser = /*[[${currentUsername}]]*/ '나';

    /* ===== 댓글 입력 엔터키 지원 ===== */
    document.querySelector('input[name="content"]').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        this.closest('form').submit();
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });
  </script>
  <th:block th:replace="~{layout/header :: scripts}"></th:block>
</body>
</html>
