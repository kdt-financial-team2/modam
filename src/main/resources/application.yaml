server:
  port: 8080

spring:
  application:
    name: modam

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: test
    password: 1234

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      "[hibernate.format_sql]": true

  h2:
    console:
      enabled: true
      path: /h2-console

  security:
    user:
      name: test
      password: 1234