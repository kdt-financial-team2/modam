server:
  port: 8080

spring:
  application:
    name: modam

  datasource:
    url: jdbc:h2:file:./data/modamdb
    driver-class-name: org.h2.Driver
    username: test
    password: 1234

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

  security:
    user:
      name: test
      password: 1234

logging:
  file:
    name: logs/modam.log
  level:
    root: INFO
    "[com.intelliJ_JO.modam]": DEBUG

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    url: /v3/api-docs