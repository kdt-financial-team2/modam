openapi: 3.0.3

info:
  title: Modam API
  version: 1.0.0
  description: Item / Inventory API Specification

servers:
  - url: http://localhost:8080
    description: Local Server

tags:
  - name: Item
    description: 아이템 관련 API
  - name: Inventory
    description: 인벤토리(보유 아이템) 관련 API

paths:

  # =========================
  # ITEM API
  # =========================

  /api/items:
    get:
      tags:
        - Item
      summary: 아이템 전체 조회
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ItemResponse"

    post:
      tags:
        - Item
      summary: 아이템 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemRequest"
      responses:
        "200":
          description: 생성 성공

  /api/items/{itemId}:
    get:
      tags:
        - Item
      summary: 아이템 단건 조회
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemResponse"

    put:
      tags:
        - Item
      summary: 아이템 수정
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemRequest"
      responses:
        "200":
          description: 수정 성공

    delete:
      tags:
        - Item
      summary: 아이템 삭제 (논리 삭제 가능)
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 삭제 성공


  # =========================
  # INVENTORY API
  # =========================

  /api/inventory:
    get:
      tags:
        - Inventory
      summary: 특정 회원 인벤토리 조회
      description: memberId 기준으로 보유 아이템 조회
      parameters:
        - name: memberId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryResponse"

    post:
      tags:
        - Inventory
      summary: 아이템 구매 (인벤토리 추가)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryRequest"
      responses:
        "200":
          description: 생성 성공

  /api/inventory/{inventoryId}:
    get:
      tags:
        - Inventory
      summary: 인벤토리 단건 조회
      parameters:
        - name: inventoryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryResponse"

    patch:
      tags:
        - Inventory
      summary: 아이템 적용 상태 변경 (착용/해제)
      description: ApplyStatus 변경 (APPLIED / NOT_APPLIED)
      parameters:
        - name: inventoryId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                applyStatus:
                  $ref: "#/components/schemas/ApplyStatus"
      responses:
        "200":
          description: 상태 변경 성공


components:

  schemas:

    # =========================
    # ITEM
    # =========================

    ItemRequest:
      type: object
      required:
        - itemName
        - itemType
        - price
      properties:
        itemName:
          type: string
          example: "Blue Theme"
        itemType:
          type: string
          example: "THEME"
        price:
          type: integer
          example: 1000
        imgUrl:
          type: string
          example: "/images/theme.png"
        isActive:
          $ref: "#/components/schemas/ItemStatus"

    ItemResponse:
      type: object
      properties:
        id:
          type: integer
        itemName:
          type: string
        itemType:
          type: string
        price:
          type: integer
        imgUrl:
          type: string
        isActive:
          $ref: "#/components/schemas/ItemStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ItemStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE


    # =========================
    # INVENTORY
    # =========================

    InventoryRequest:
      type: object
      required:
        - memberId
        - itemId
      properties:
        memberId:
          type: integer
          example: 1
        itemId:
          type: integer
          example: 10

    InventoryResponse:
      type: object
      properties:
        id:
          type: integer
        memberId:
          type: integer
        itemId:
          type: integer
        applyStatus:
          $ref: "#/components/schemas/ApplyStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ApplyStatus:
      type: string
      enum:
        - APPLIED
        - NOT_APPLIED