openapi: 3.0.3
info:
  title: Modam API
  description: 커플 공동 금융 서비스 전체 API 명세
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local Server

tags:
  - name: Member
    description: 회원 관련 API
  - name: Account
    description: 모임 통장(계좌) 관련 API
  - name: Card
    description: 카드 관련 API
  - name: Comment
    description: 소비 기록 댓글 관련 API
  - name: Couple
    description: 커플 정보 관련 API
  - name: Notification
    description: 알림 관련 API
  - name: Point
    description: 포인트 내역 관련 API
  - name: Savings
    description: 저축 목표 관련 API
  - name: SpendRecord
    description: 소비 기록 관련 API
  - name: Transaction
    description: 거래 내역 관련 API

# ─────────────────────────────────────────────────────────────
# PATHS
# ─────────────────────────────────────────────────────────────
paths:

  # ── Member ──────────────────────────────────────────────────
  /api/member:
    post:
      tags: [Member]
      summary: 회원 가입
      operationId: createMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberCreateRequest'
      responses:
        '200':
          description: 회원 생성 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GlobalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MemberCreateResponse'

    get:
      tags: [Member]
      summary: 회원 전체 조회
      operationId: getMembers
      responses:
        '200':
          description: 회원 목록 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GlobalResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/MemberResponse'

  /api/member/{memberId}:
    get:
      tags: [Member]
      summary: 회원 단건 조회
      operationId: getMember
      parameters:
        - $ref: '#/components/parameters/memberIdPath'
      responses:
        '200':
          description: 회원 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GlobalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MemberResponse'

    patch:
      tags: [Member]
      summary: 회원 정보 수정
      operationId: updateMember
      parameters:
        - $ref: '#/components/parameters/memberIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberUpdateRequest'
      responses:
        '200':
          description: 회원 수정 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GlobalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MemberUpdateResponse'

    delete:
      tags: [Member]
      summary: 회원 삭제 (soft delete – active=false)
      operationId: deleteMember
      parameters:
        - $ref: '#/components/parameters/memberIdPath'
      responses:
        '200':
          description: 회원 삭제 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GlobalResponse'
                  - type: object
                    properties:
                      data:
                        type: string
                        example: "회원 삭제 완료"

  # ── Account ─────────────────────────────────────────────────
  /api/accounts:
    post:
      tags: [Account]
      summary: 계좌 개설 (개인/모임 통장)
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreateRequest'
      responses:
        '200':
          description: 계좌 생성 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GlobalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AccountResponse'

  /api/accounts/{accountId}:
    get:
      tags: [Account]
      summary: 계좌 단건 조회
      operationId: getAccount
      parameters:
        - $ref: '#/components/parameters/accountIdPath'
      responses:
        '200':
          description: 계좌 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GlobalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AccountResponse'

    patch:
      tags: [Account]
      summary: 계좌 정보 수정
      operationId: updateAccount
      parameters:
        - $ref: '#/components/parameters/accountIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdateRequest'
      responses:
        '200':
          description: 계좌 수정 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GlobalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AccountResponse'

    delete:
      tags: [Account]
      summary: 계좌 해지 (status → CLOSED)
      operationId: closeAccount
      parameters:
        - $ref: '#/components/parameters/accountIdPath'
      responses:
        '200':
          description: 계좌 해지 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GlobalResponse'
                  - type: object
                    properties:
                      data:
                        type: string
                        example: "계좌가 해지되었습니다."

  /api/accounts/{accountId}/members:
    get:
      tags: [Account]
      summary: 모임 통장 참여 회원 목록 조회
      operationId: getAccountMembers
      parameters:
        - $ref: '#/components/parameters/accountIdPath'
      responses:
        '200':
          description: 참여 회원 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GlobalResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AccountMemberResponse'

    post:
      tags: [Account]
      summary: 모임 통장 파트너 초대 (최대 2명)
      operationId: inviteMember
      parameters:
        - $ref: '#/components/parameters/accountIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountMemberAddRequest'
      responses:
        '200':
          description: 초대 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GlobalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AccountMemberResponse'

  /api/accounts/{accountId}/members/{accountMemberId}/accept:
    patch:
      tags: [Account]
      summary: 모임 통장 초대 수락
      operationId: acceptInvite
      parameters:
        - $ref: '#/components/parameters/accountIdPath'
        - name: accountMemberId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 초대 수락 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GlobalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AccountMemberResponse'

  # ── Card ────────────────────────────────────────────────────
  /api/cards:
    post:
      tags: [Card]
      summary: 카드 발급
      operationId: issueCard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardCreateRequest'
      responses:
        '200':
          description: 카드 발급 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GlobalResponse'
                  - type: object
                    properties:
                      data:
                        nullable: true

  /api/cards/account/{accountId}:
    get:
      tags: [Card]
      summary: 모임 통장에 연결된 카드 목록 조회
      operationId: getCardsByAccount
      parameters:
        - $ref: '#/components/parameters/accountIdPath'
      responses:
        '200':
          description: 카드 목록 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GlobalResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CardResponse'

  # ── Comment ─────────────────────────────────────────────────
  /api/comments:
    post:
      tags: [Comment]
      summary: 댓글 작성
      operationId: createComment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCreateRequest'
      responses:
        '200':
          description: 댓글 작성 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GlobalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CommentResponse'

  /api/comments/spend-record/{spendRecordId}:
    get:
      tags: [Comment]
      summary: 소비 기록의 댓글 목록 조회
      operationId: getCommentsBySpendRecord
      parameters:
        - name: spendRecordId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 댓글 목록 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GlobalResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CommentResponse'

  /api/comments/{commentId}:
    patch:
      tags: [Comment]
      summary: 댓글 수정
      operationId: updateComment
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentUpdateRequest'
      responses:
        '200':
          description: 댓글 수정 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GlobalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CommentResponse'

    delete:
      tags: [Comment]
      summary: 댓글 삭제
      operationId: deleteComment
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 댓글 삭제 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GlobalResponse'
                  - type: object
                    properties:
                      data:
                        type: string
                        example: "댓글이 삭제되었습니다."

  # ── Couple ──────────────────────────────────────────────────
  /api/couples:
    post:
      tags: [Couple]
      summary: 커플 정보 생성
      operationId: createCouple
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoupleCreateRequest'
      responses:
        '200':
          description: 커플 생성 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GlobalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CoupleResponse'

  /api/couples/account/{accountId}:
    get:
      tags: [Couple]
      summary: 모임 통장의 커플 정보 조회
      operationId: getCoupleByAccount
      parameters:
        - $ref: '#/components/parameters/accountIdPath'
      responses:
        '200':
          description: 커플 정보 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GlobalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CoupleResponse'

  /api/couples/{coupleId}:
    patch:
      tags: [Couple]
      summary: 커플 정보 수정 (애칭, 기념일)
      operationId: updateCouple
      parameters:
        - name: coupleId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoupleUpdateRequest'
      responses:
        '200':
          description: 커플 수정 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GlobalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CoupleResponse'

    delete:
      tags: [Couple]
      summary: 커플 정보 삭제
      operationId: deleteCouple
      parameters:
        - name: coupleId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 커플 삭제 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GlobalResponse'
                  - type: object
                    properties:
                      data:
                        type: string
                        example: "커플 정보가 삭제되었습니다."

  # ── Notification ────────────────────────────────────────────
  /api/notifications/member/{memberId}:
    get:
      tags: [Notification]
      summary: 회원의 알림 목록 조회 (최신순)
      operationId: getNotifications
      parameters:
        - $ref: '#/components/parameters/memberIdPath'
      responses:
        '200':
          description: 알림 목록 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GlobalResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/NotificationResponse'

  /api/notifications/{notificationId}/read:
    patch:
      tags: [Notification]
      summary: 알림 읽음 처리
      operationId: markNotificationAsRead
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 알림 읽음 처리 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GlobalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/NotificationResponse'

  /api/notifications/{notificationId}:
    delete:
      tags: [Notification]
      summary: 알림 삭제
      operationId: deleteNotification
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 알림 삭제 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GlobalResponse'
                  - type: object
                    properties:
                      data:
                        type: string
                        example: "알림이 삭제되었습니다."

  # ── Point ───────────────────────────────────────────────────
  /api/points:
    post:
      tags: [Point]
      summary: 포인트 적립/사용 내역 생성
      operationId: createPointHistory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PointHistoryCreateRequest'
      responses:
        '200':
          description: 포인트 내역 생성 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GlobalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PointHistoryResponse'

  /api/points/member/{memberId}:
    get:
      tags: [Point]
      summary: 회원의 포인트 내역 전체 조회 (최신순)
      operationId: getPointHistories
      parameters:
        - $ref: '#/components/parameters/memberIdPath'
      responses:
        '200':
          description: 포인트 내역 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GlobalResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PointHistoryResponse'

  # ── Savings ─────────────────────────────────────────────────
  /api/savings:
    post:
      tags: [Savings]
      summary: 저축 목표 생성
      operationId: createSavings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavingsCreateRequest'
      responses:
        '200':
          description: 저축 목표 생성 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GlobalResponse'
                  - type: object
                    properties:
                      data:
                        nullable: true

  /api/savings/account/{accountId}:
    get:
      tags: [Savings]
      summary: 모임 통장의 저축 목표 목록 조회
      operationId: getSavingsByAccount
      parameters:
        - $ref: '#/components/parameters/accountIdPath'
      responses:
        '200':
          description: 저축 목표 목록 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GlobalResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SavingsResponse'

  # ── SpendRecord ─────────────────────────────────────────────
  /api/spend-records:
    post:
      tags: [SpendRecord]
      summary: 소비 기록 생성
      operationId: createSpendRecord
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpendRecordCreateRequest'
      responses:
        '200':
          description: 소비 기록 생성 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GlobalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SpendRecordResponse'

  /api/spend-records/transaction/{transactionId}:
    get:
      tags: [SpendRecord]
      summary: 거래 내역의 소비 기록 조회
      operationId: getSpendRecordByTransaction
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 소비 기록 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GlobalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SpendRecordResponse'

  /api/spend-records/{recordId}:
    patch:
      tags: [SpendRecord]
      summary: 소비 기록 수정 (이미지, 메모, 이모티콘)
      operationId: updateSpendRecord
      parameters:
        - name: recordId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpendRecordUpdateRequest'
      responses:
        '200':
          description: 소비 기록 수정 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GlobalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SpendRecordResponse'

    delete:
      tags: [SpendRecord]
      summary: 소비 기록 삭제
      operationId: deleteSpendRecord
      parameters:
        - name: recordId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 소비 기록 삭제 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GlobalResponse'
                  - type: object
                    properties:
                      data:
                        type: string
                        example: "소비 기록이 삭제되었습니다."

  # ── Transaction ─────────────────────────────────────────────
  /api/transactions:
    post:
      tags: [Transaction]
      summary: 거래 내역 생성 (입금/출금/결제)
      description: |
        JWT 인증 필요. 인증 토큰에서 회원 정보를 추출하므로 요청 본문에 memberId 불필요.
        - PAYMENT 타입인 경우 cardId 필수
        - 출금/결제 시 잔액 부족이면 400 반환
      operationId: createTransaction
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionCreateRequest'
      responses:
        '200':
          description: 거래 처리 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GlobalResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TransactionResponse'
        '400':
          description: 잘못된 요청 (잔액 부족, PAYMENT인데 cardId 없음, 카드 소유권 불일치 등)
        '401':
          description: 인증 토큰 없음 또는 만료
        '403':
          description: 해당 계좌에 대한 접근 권한 없음

  /api/transactions/{accountId}:
    get:
      tags: [Transaction]
      summary: 거래 내역 조회 (무한 스크롤 – No-offset)
      description: ID 내림차순으로 정렬. lastTransactionId를 커서로 사용하는 커서 기반 페이지네이션.
      operationId: getTransactions
      parameters:
        - $ref: '#/components/parameters/accountIdPath'
        - name: lastTransactionId
          in: query
          required: false
          description: 마지막으로 본 거래 ID (첫 요청 시 생략)
          schema:
            type: integer
            format: int64
        - name: size
          in: query
          required: false
          description: 한 번에 가져올 건수 (기본 10)
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: 거래 내역 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GlobalResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TransactionResponse'
        '400':
          description: 존재하지 않는 계좌 ID

# ─────────────────────────────────────────────────────────────
# COMPONENTS
# ─────────────────────────────────────────────────────────────
components:

  securitySchemes:
    SessionAuth:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: "세션 기반 인증 (Spring Security formLogin, JSESSIONID 쿠키)"

  parameters:
    memberIdPath:
      name: memberId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    accountIdPath:
      name: accountId
      in: path
      required: true
      schema:
        type: integer
        format: int64

  schemas:

    # ── 공통 응답 ──────────────────────────────────────────────
    GlobalResponse:
      type: object
      description: 모든 API 공통 응답 래퍼
      properties:
        success:
          type: boolean
          example: true
        code:
          type: string
          nullable: true
          example: "200"
        message:
          type: string
          example: "success"
        data:
          nullable: true
      required:
        - success
        - message

    # ── Member ─────────────────────────────────────────────────
    MemberCreateRequest:
      type: object
      properties:
        name:
          type: string
          example: "홍길동"
        userId:
          type: string
          example: "hong123"
        pw:
          type: string
          example: "password123!"
        email:
          type: string
          example: "hong@test.com"
        agree:
          type: boolean
          example: true
        notif:
          type: boolean
          example: true
        enFirst:
          type: string
          example: "GilDong"
        enLast:
          type: string
          example: "Hong"
        bankName:
          type: string
          example: "국민은행"
        persAcctNo:
          type: string
          example: "1234567890"
        address:
          type: string
          example: "서울시 강남구"
        phoneNo:
          type: string
          example: "01012345678"
        profileImg:
          type: string
          nullable: true
        rrn:
          type: string
          example: "900101-1234567"
      required:
        - name
        - userId
        - pw
        - email
        - agree
        - notif
        - enFirst
        - enLast
        - bankName
        - persAcctNo
        - address
        - phoneNo
        - rrn

    MemberCreateResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        userId:
          type: string
          example: "hong123"

    MemberResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "홍길동"
        userId:
          type: string
          example: "hong123"
        email:
          type: string
          example: "hong@test.com"

    MemberUpdateRequest:
      type: object
      properties:
        name:
          type: string
        password:
          type: string
        email:
          type: string
        agree:
          type: boolean
        notif:
          type: boolean
        enFirst:
          type: string
        enLast:
          type: string
        bankName:
          type: string
        persAcctNo:
          type: string
        address:
          type: string
        phoneNo:
          type: string
        profileImg:
          type: string
          nullable: true
        rrn:
          type: string

    MemberUpdateResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "홍길동"

    # ── Account ────────────────────────────────────────────────
    AccountCreateRequest:
      type: object
      properties:
        memberId:
          type: integer
          format: int64
          example: 1
          description: 계좌 개설 회원 ID
        accountType:
          type: string
          example: "GROUP"
          enum: [PERSONAL, GROUP]
          description: "계좌 유형 (PERSONAL: 개인 계좌, GROUP: 모임 통장)"
        password:
          type: string
          nullable: true
          description: 계좌 비밀번호 (없으면 null)
        deliveryAddress:
          type: string
          nullable: true
          example: "서울시 강남구"
        jobInfo:
          type: string
          nullable: true
          example: "회사원"
        tradePurpose:
          type: string
          nullable: true
          example: "생활비"
        fundSource:
          type: string
          nullable: true
          example: "급여"
      required:
        - memberId
        - accountType

    AccountMemberAddRequest:
      type: object
      properties:
        memberId:
          type: integer
          format: int64
          example: 2
          description: 초대할 회원 ID
      required:
        - memberId

    AccountUpdateRequest:
      type: object
      properties:
        deliveryAddress:
          type: string
          nullable: true
        jobInfo:
          type: string
          nullable: true
        tradePurpose:
          type: string
          nullable: true
        fundSource:
          type: string
          nullable: true
        spendLimitAmount:
          type: integer
          format: int64
          nullable: true
          example: 500000

    AccountResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        accountNumber:
          type: string
          example: "A1B2C3D4E5F6G7H8"
        accountType:
          type: string
          example: "GROUP"
          enum: [PERSONAL, GROUP]
        status:
          type: string
          example: "ACTIVE"
          enum: [ACTIVE, FREEZE, CLOSED]
        balance:
          type: integer
          format: int64
          example: 150000
        availableBalance:
          type: integer
          format: int64
          example: 150000
        spendLimitAmount:
          type: integer
          format: int64
          nullable: true
          example: 500000
        createdAt:
          type: string
          format: date-time

    AccountMemberResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        memberId:
          type: integer
          format: int64
          example: 2
        memberName:
          type: string
          example: "홍길동"
        inviteStatus:
          type: string
          example: "ACCEPT"
          enum: [WAIT, ACCEPT, REJECT]
        totalDeposit:
          type: integer
          format: int64
          example: 100000

    # ── Card ───────────────────────────────────────────────────
    CardCreateRequest:
      type: object
      properties:
        accountId:
          type: integer
          format: int64
          example: 1
        memberId:
          type: integer
          format: int64
          example: 2
        cardNumber:
          type: string
          example: "1234-5678-9012-3456"
        expiryDate:
          type: string
          example: "12/27"
          pattern: "^(0[1-9]|1[0-2])/([0-9]{2})$"
      required:
        - accountId
        - memberId
        - cardNumber
        - expiryDate

    CardResponse:
      type: object
      properties:
        cardId:
          type: integer
          format: int64
          example: 1
        cardNumber:
          type: string
          example: "1234-5678-9012-3456"
        expiryDate:
          type: string
          example: "12/27"
        status:
          type: string
          example: "ACTIVE"
          enum: [ACTIVE, LOST, STOPPED]
        createdAt:
          type: string
          format: date-time

    # ── Comment ────────────────────────────────────────────────
    CommentCreateRequest:
      type: object
      properties:
        spendRecordId:
          type: integer
          format: int64
          example: 1
        memberId:
          type: integer
          format: int64
          example: 2
        content:
          type: string
          example: "오늘 밥값 너무 비쌌다 😅"
        emoticon:
          type: string
          nullable: true
          example: "😅"
      required:
        - spendRecordId
        - memberId
        - content

    CommentUpdateRequest:
      type: object
      properties:
        content:
          type: string
          example: "수정된 댓글 내용"
        emoticon:
          type: string
          nullable: true
      required:
        - content

    CommentResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        spendRecordId:
          type: integer
          format: int64
          example: 1
        memberId:
          type: integer
          format: int64
          example: 2
        memberName:
          type: string
          example: "홍길동"
        content:
          type: string
          example: "오늘 밥값 너무 비쌌다"
        emoticon:
          type: string
          nullable: true
          example: "😅"
        createdAt:
          type: string
          format: date-time

    # ── Couple ─────────────────────────────────────────────────
    CoupleCreateRequest:
      type: object
      properties:
        accountId:
          type: integer
          format: int64
          example: 1
        dDay:
          type: string
          format: date
          nullable: true
          example: "2023-05-01"
        accountAlias:
          type: string
          nullable: true
          example: "우리의 여행 자금"
        coupleImg:
          type: string
          nullable: true
          example: "https://example.com/couple.jpg"
        invitedEmail:
          type: string
          nullable: true
          example: "partner@test.com"
      required:
        - accountId

    CoupleUpdateRequest:
      type: object
      properties:
        accountAlias:
          type: string
          nullable: true
          example: "제주도 여행 자금"
        dDay:
          type: string
          format: date
          nullable: true
          example: "2024-01-01"

    CoupleResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        accountId:
          type: integer
          format: int64
          example: 1
        inviteCode:
          type: string
          example: "AB12CD34"
        dDay:
          type: string
          format: date
          nullable: true
          example: "2023-05-01"
        accountAlias:
          type: string
          nullable: true
          example: "우리의 여행 자금"
        coupleImg:
          type: string
          nullable: true
        invitedEmail:
          type: string
          nullable: true
          example: "partner@test.com"
        createdAt:
          type: string
          format: date-time

    # ── Notification ───────────────────────────────────────────
    NotificationResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        notiType:
          type: string
          example: "DEPOSIT"
          enum: [DEPOSIT, LIMIT, INVITE, SAVINGS]
        message:
          type: string
          example: "10,000원이 입금되었습니다."
        targetUrl:
          type: string
          nullable: true
          example: "/transactions/1"
        isRead:
          type: string
          example: "N"
          enum: ["Y", "N"]
        createdAt:
          type: string
          format: date-time

    # ── PointHistory ───────────────────────────────────────────
    PointHistoryCreateRequest:
      type: object
      properties:
        memberId:
          type: integer
          format: int64
          example: 1
        type:
          type: string
          example: "EARN"
          enum: [EARN, USE]
        amount:
          type: integer
          format: int64
          example: 100
        afterBalance:
          type: integer
          format: int64
          example: 1100
        description:
          type: string
          example: "출석 체크 보상"
      required:
        - memberId
        - type
        - amount
        - afterBalance
        - description

    PointHistoryResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        type:
          type: string
          example: "EARN"
          enum: [EARN, USE]
        amount:
          type: integer
          format: int64
          example: 100
        afterBalance:
          type: integer
          format: int64
          example: 1100
        description:
          type: string
          example: "출석 체크 보상"
        createdAt:
          type: string
          format: date-time

    # ── Savings ────────────────────────────────────────────────
    SavingsCreateRequest:
      type: object
      properties:
        accountId:
          type: integer
          format: int64
          example: 1
        saveType:
          type: string
          example: "여행"
        targetAmount:
          type: integer
          format: int64
          example: 1000000
          minimum: 1000
        targetDate:
          type: string
          format: date
          nullable: true
          example: "2025-12-31"
        isAuto:
          type: string
          nullable: true
          example: "N"
          enum: ["Y", "N"]
        autoAmount:
          type: integer
          format: int64
          nullable: true
          example: 50000
        autoCycle:
          type: string
          nullable: true
          example: "매월"
          enum: [매일, 매주, 매월]
      required:
        - accountId
        - saveType
        - targetAmount

    SavingsResponse:
      type: object
      properties:
        savingsId:
          type: integer
          format: int64
          example: 1
        saveType:
          type: string
          example: "여행"
        targetAmount:
          type: integer
          format: int64
          example: 1000000
        currentAmount:
          type: integer
          format: int64
          example: 250000
        targetDate:
          type: string
          format: date
          nullable: true
          example: "2025-12-31"
        isAuto:
          type: string
          example: "N"
        createdAt:
          type: string
          format: date-time

    # ── SpendRecord ────────────────────────────────────────────
    SpendRecordCreateRequest:
      type: object
      properties:
        transactionId:
          type: integer
          format: int64
          example: 10
        imageUrl:
          type: string
          nullable: true
          example: "https://example.com/receipt.jpg"
        memo:
          type: string
          nullable: true
          example: "치킨 시켜먹음"
        emoticon:
          type: string
          nullable: true
          example: "🍗"
      required:
        - transactionId

    SpendRecordUpdateRequest:
      type: object
      properties:
        imageUrl:
          type: string
          nullable: true
        memo:
          type: string
          nullable: true
        emoticon:
          type: string
          nullable: true

    SpendRecordResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        transactionId:
          type: integer
          format: int64
          example: 10
        imageUrl:
          type: string
          nullable: true
        memo:
          type: string
          nullable: true
          example: "치킨 시켜먹음"
        emoticon:
          type: string
          nullable: true
          example: "🍗"
        createdAt:
          type: string
          format: date-time

    # ── Transaction ────────────────────────────────────────────
    TransactionCreateRequest:
      type: object
      properties:
        accountId:
          type: integer
          format: int64
          example: 1
        memberId:
          type: integer
          format: int64
          example: 2
        cardId:
          type: integer
          format: int64
          nullable: true
          description: "카드 결제 시에만 포함 (txType=PAYMENT 이면 필수)"
        txType:
          type: string
          example: "DEPOSIT"
          enum: [DEPOSIT, WITHDRAW, PAYMENT]
        amount:
          type: integer
          format: int64
          example: 30000
          minimum: 1
          description: 거래 금액 (0보다 커야 함)
        merchantName:
          type: string
          nullable: true
          example: "BBQ 강남점"
        category:
          type: string
          nullable: true
          example: "식비"
      required:
        - accountId
        - memberId
        - txType
        - amount

    TransactionResponse:
      type: object
      properties:
        transactionId:
          type: integer
          format: int64
          example: 1
        txType:
          type: string
          example: "PAYMENT"
          enum: [DEPOSIT, WITHDRAW, PAYMENT]
        amount:
          type: integer
          format: int64
          example: 30000
        afterBalance:
          type: integer
          format: int64
          example: 120000
        merchantName:
          type: string
          nullable: true
          example: "BBQ 강남점"
        category:
          type: string
          nullable: true
          example: "식비"
        createdAt:
          type: string
          format: date-time
