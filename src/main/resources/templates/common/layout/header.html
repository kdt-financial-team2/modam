<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head></head>
<body>

<!--
  표준 앱 헤더 fragment
  사용법: <th:block th:replace="~{layout/header :: nav}"></th:block>
  스크립트: <th:block th:replace="~{layout/header :: scripts}"></th:block>
-->

<th:block th:fragment="nav">

  <!-- ===== 상단 네비게이션 헤더 ===== -->
  <nav class="sticky top-0 z-30 bg-white border-b border-gray-100">
    <div class="w-full max-w-[1440px] mx-auto px-8 h-24 flex items-center justify-between">

      <!-- 로고 -->
      <a th:href="@{/dashboard}" href="/dashboard" class="flex-shrink-0 hover:opacity-80 transition-opacity">
        <div class="flex items-center gap-2">
          <div class="w-10 h-10 bg-gradient-to-br from-[#F5A5A5] to-[#F28B8B] rounded-2xl flex items-center justify-center shadow-md">
            <i data-lucide="heart" class="w-6 h-6 text-white"></i>
          </div>
          <span class="text-2xl font-bold text-gray-900">모담</span>
        </div>
      </a>

      <!-- 오른쪽 메뉴 -->
      <div class="flex items-center gap-10">

        <!-- 소비기록 -->
        <a th:href="@{/consumption-history}" href="/consumption-history"
           class="text-[15px] text-gray-600 hover:text-[#F5A5A5] transition-colors py-2">소비기록</a>

        <!-- 목표저축 -->
        <a th:href="@{/savings}" href="/savings"
           class="text-[15px] text-gray-600 hover:text-[#F5A5A5] transition-colors py-2">목표저축</a>

        <!-- 포인트 -->
        <a th:href="@{/point-shop}" href="/point-shop"
           class="text-[15px] text-gray-600 hover:text-[#F5A5A5] transition-colors py-2 flex items-center gap-2">
          <span>포인트</span>
          <span class="text-[#F5A5A5] font-semibold text-sm" th:text="${userPoints + 'P'}">12,450P</span>
        </a>

        <!-- 알림 버튼 -->
        <div class="relative ml-2">
          <button onclick="toggleNotifications()"
                  class="w-11 h-11 rounded-full bg-[#FCE8E3] flex items-center justify-center hover:bg-[#FBD5CE] transition-colors relative">
            <i data-lucide="bell" class="w-5 h-5 text-gray-700"></i>
            <div th:if="${unreadCount > 0}"
                 class="absolute -top-1 -right-1 w-5 h-5 bg-[#F5A5A5] rounded-full flex items-center justify-center">
              <span class="text-white text-xs font-bold" th:text="${unreadCount}">2</span>
            </div>
          </button>
        </div>

        <!-- 프로필 버튼 -->
        <div class="relative">
          <button onclick="toggleProfile()"
                  class="w-11 h-11 rounded-full bg-[#FCE8E3] flex items-center justify-center hover:bg-[#FBD5CE] transition-colors">
            <i data-lucide="user" class="w-5 h-5 text-gray-700"></i>
          </button>

          <!-- 프로필 드롭다운 -->
          <div id="profileDropdown"
               class="hidden absolute right-0 mt-3 w-56 bg-white rounded-xl shadow-xl border border-gray-100 py-2 z-50">
            <a th:href="@{/mypage}" href="/mypage"
               class="flex items-center gap-3 px-5 py-3 text-gray-800 hover:bg-[#FFF7F5] transition-colors">
              <i data-lucide="user" class="w-5 h-5"></i>
              <span>마이페이지</span>
            </a>
            <button onclick="showLogoutModal()"
                    class="w-full flex items-center gap-3 px-5 py-3 text-red-500 hover:bg-[#FFF7F5] transition-colors">
              <i data-lucide="log-out" class="w-5 h-5"></i>
              <span>로그아웃</span>
            </button>
          </div>
        </div>

      </div>
    </div>
  </nav>

  <!-- ===== 로그아웃 확인 모달 ===== -->
  <div id="logoutOverlay" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-40"
       onclick="hideLogoutModal()"></div>
  <div id="logoutModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-[440px] p-8">
      <div class="text-center mb-8">
        <div class="w-16 h-16 bg-[#FCE8E3] rounded-2xl flex items-center justify-center mx-auto mb-4">
          <i data-lucide="log-out" class="w-8 h-8 text-[#F5A5A5]"></i>
        </div>
        <h2 class="text-2xl font-bold text-gray-900 mb-2">로그아웃 하시겠습니까?</h2>
        <p class="text-gray-600">다시 로그인하면 언제든지 사용하실 수 있습니다</p>
      </div>
      <div class="flex gap-3">
        <button onclick="hideLogoutModal()"
                class="flex-1 py-4 bg-gray-100 text-gray-700 rounded-xl hover:bg-gray-200 transition-colors font-medium">
          취소
        </button>
        <form th:action="@{/logout}" method="post" class="flex-1">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit"
                  class="w-full py-4 bg-[#FCE8E3] text-gray-900 rounded-xl hover:bg-[#FBD5CE] transition-colors font-medium">
            로그아웃
          </button>
        </form>
      </div>
    </div>
  </div>

</th:block>


<th:block th:fragment="scripts">
  <script>
    function toggleProfile() {
      const dropdown = document.getElementById('profileDropdown');
      if (!dropdown) return;
      const panel = document.getElementById('notificationPanel');
      if (panel) panel.classList.add('hidden');
      dropdown.classList.toggle('hidden');
    }
    function toggleNotifications() {}
    function showLogoutModal() {
      const dropdown = document.getElementById('profileDropdown');
      if (dropdown) dropdown.classList.add('hidden');
      const overlay = document.getElementById('logoutOverlay');
      const modal = document.getElementById('logoutModal');
      if (overlay) overlay.classList.remove('hidden');
      if (modal) modal.classList.remove('hidden');
    }
    function hideLogoutModal() {
      const overlay = document.getElementById('logoutOverlay');
      const modal = document.getElementById('logoutModal');
      if (overlay) overlay.classList.add('hidden');
      if (modal) modal.classList.add('hidden');
    }
    document.addEventListener('click', function(e) {
      const dropdown = document.getElementById('profileDropdown');
      if (dropdown && !e.target.closest('#profileDropdown') && !e.target.closest('button[onclick="toggleProfile()"]')) {
        dropdown.classList.add('hidden');
      }
    });
  </script>
</th:block>

</body>
</html>
