<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>소비기록 - 모담</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-[#FAFAFA] flex flex-col">

  <!-- ===== 헤더 ===== -->
  <th:block th:replace="~{common/layout/header-dashboard :: nav}"></th:block>

  <!-- ===== 메인 콘텐츠 ===== -->
  <main class="flex-1">
    <div class="max-w-[1440px] mx-auto px-8 py-12">

      <!-- 페이지 헤더 -->
      <div class="mb-8">
        <h1 class="text-4xl font-bold text-gray-900 mb-2">소비기록</h1>
        <p class="text-lg text-gray-600">우리의 소비 순간을 기록하고 추억해보세요</p>
      </div>

      <!-- 필터 영역 -->
      <div class="flex items-center justify-between mb-8 flex-wrap gap-4">
        <div class="flex items-center gap-4 flex-wrap">

          <!-- 검색 -->
          <div class="relative">
            <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"></i>
            <input type="text" id="searchInput" oninput="applyFilters()"
                   placeholder="장소 또는 메모 검색"
                   th:value="${searchQuery}"
                   class="w-[300px] pl-12 pr-4 py-3 border-2 border-gray-200 rounded-2xl focus:border-[#F5A5A5] focus:outline-none transition-colors" />
          </div>

          <!-- 날짜 선택 -->
          <div class="relative">
            <input type="date" id="dateInput" onchange="applyFilters()"
                   th:value="${selectedDate}"
                   class="bg-white border-2 border-gray-200 rounded-2xl px-6 py-3 pr-12 text-gray-900 font-medium cursor-pointer hover:border-[#F5A5A5] transition-colors" />
            <i data-lucide="calendar" class="absolute right-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400 pointer-events-none"></i>
          </div>
        </div>

        <!-- 소비 기록하기 버튼 -->
        <a th:href="@{/consumption-select}" href="/consumption-select"
           class="flex items-center gap-2 px-6 py-4 bg-[#F5A5A5] text-white rounded-2xl hover:bg-[#F28B8B] transition-colors shadow-md font-medium">
          <i data-lucide="plus" class="w-5 h-5"></i>
          <span>소비 기록하기</span>
        </a>
      </div>

      <!-- 요약 카드 -->
      <div class="grid grid-cols-3 gap-6 mb-8">
        <div class="bg-white rounded-3xl border border-gray-100 p-6 shadow-sm">
          <p class="text-sm text-gray-600 mb-2 font-medium">이번 달 기록한 소비</p>
          <p id="totalAmountDisplay" class="text-3xl font-bold text-gray-900">
            ₩<span th:text="${#numbers.formatInteger(totalAmount, 0, 'COMMA')}">0</span>
          </p>
        </div>
        <div class="bg-white rounded-3xl border border-gray-100 p-6 shadow-sm">
          <p class="text-sm text-gray-600 mb-2 font-medium">작성한 기록</p>
          <p id="writtenCountDisplay" class="text-3xl font-bold text-[#F5A5A5]">
            <span th:text="${writtenCount}">0</span>개
          </p>
        </div>
        <div class="bg-white rounded-3xl border border-gray-100 p-6 shadow-sm">
          <p class="text-sm text-gray-600 mb-2 font-medium">전체 소비 기록</p>
          <p id="totalCountDisplay" class="text-3xl font-bold text-gray-900">
            <span th:text="${totalCount}">0</span>개
          </p>
        </div>
      </div>

      <!-- 카테고리 필터 칩 -->
      <div class="flex items-center gap-3 mb-8 overflow-x-auto pb-2" id="categoryChips">
        <button onclick="setCategory('전체')"
                class="category-chip px-6 py-3 rounded-2xl transition-all flex items-center gap-2 whitespace-nowrap font-medium bg-[#F5A5A5] text-white shadow-md"
                data-category="전체">전체</button>
        <button onclick="setCategory('식비')"
                class="category-chip px-6 py-3 rounded-2xl transition-all flex items-center gap-2 whitespace-nowrap font-medium bg-white text-gray-700 hover:bg-[#FCE8E3] border border-gray-200"
                data-category="식비">
          <i data-lucide="utensils" class="w-4 h-4"></i>식비
        </button>
        <button onclick="setCategory('카페')"
                class="category-chip px-6 py-3 rounded-2xl transition-all flex items-center gap-2 whitespace-nowrap font-medium bg-white text-gray-700 hover:bg-[#FCE8E3] border border-gray-200"
                data-category="카페">
          <i data-lucide="coffee" class="w-4 h-4"></i>카페
        </button>
        <button onclick="setCategory('데이트')"
                class="category-chip px-6 py-3 rounded-2xl transition-all flex items-center gap-2 whitespace-nowrap font-medium bg-white text-gray-700 hover:bg-[#FCE8E3] border border-gray-200"
                data-category="데이트">
          <i data-lucide="heart" class="w-4 h-4"></i>데이트
        </button>
        <button onclick="setCategory('생활')"
                class="category-chip px-6 py-3 rounded-2xl transition-all flex items-center gap-2 whitespace-nowrap font-medium bg-white text-gray-700 hover:bg-[#FCE8E3] border border-gray-200"
                data-category="생활">
          <i data-lucide="shopping-bag" class="w-4 h-4"></i>생활
        </button>
        <button onclick="setCategory('교통')"
                class="category-chip px-6 py-3 rounded-2xl transition-all flex items-center gap-2 whitespace-nowrap font-medium bg-white text-gray-700 hover:bg-[#FCE8E3] border border-gray-200"
                data-category="교통">
          <i data-lucide="car" class="w-4 h-4"></i>교통
        </button>
        <button onclick="setCategory('쇼핑')"
                class="category-chip px-6 py-3 rounded-2xl transition-all flex items-center gap-2 whitespace-nowrap font-medium bg-white text-gray-700 hover:bg-[#FCE8E3] border border-gray-200"
                data-category="쇼핑">
          <i data-lucide="shopping-bag" class="w-4 h-4"></i>쇼핑
        </button>
      </div>

      <!-- 소비 기록 목록 (서버사이드 렌더링) -->
      <div id="serverRecordList" class="flex flex-col gap-4">
        <th:block th:each="record : ${records}">
          <div class="bg-white rounded-[24px] px-6 py-5 shadow-sm hover:shadow-lg hover:-translate-y-1 transition-all duration-300 border border-transparent hover:border-[#F5D5CD] group"
               th:attr="data-category=${record.category},data-date=${record.date},data-place=${record.place},data-memo=${record.memo}"
               th:classappend="${record.hasRecord} ? 'cursor-pointer' : ''"
               th:onclick="${record.hasRecord} ? |location.href='@{/consumption-detail/{id}(id=${record.id})}'| : null">
            <div class="flex items-center justify-between">
              <!-- 왼쪽 -->
              <div class="flex items-center gap-5">
                <!-- 아이콘 -->
                <div class="w-16 h-16 rounded-full bg-[#FFF1ED] flex items-center justify-center flex-shrink-0">
                  <i th:attr="data-lucide=${record.iconName}" class="w-8 h-8 text-[#D9B8AE]"></i>
                </div>

                <!-- 정보 -->
                <div>
                  <div class="flex items-center gap-3 mb-2">
                    <span class="text-xl" th:text="${record.emoticon}"></span>
                    <h3 class="text-xl text-[#6E5A55] font-semibold" th:text="${record.place}">스타벅스 역삼점</h3>
                    <span class="text-xs bg-[#FFF1ED] text-[#D09B8D] px-3 py-1 rounded-full" th:text="${record.category}">카페</span>
                  </div>

                  <p class="text-[#A89089] mb-2">
                    <span th:text="${record.date}">2026.05.14</span> ·
                    <span th:text="${record.time}">09:20</span>
                    <span th:if="${record.updated}" class="text-xs text-[#D09B8D] ml-2">(수정됨)</span>
                  </p>

                  <p class="text-sm text-[#B7A4A0] mb-1" th:text="${record.memo}">메모 내용</p>

                  <p th:if="${record.hasImage}" class="text-xs text-[#C9B5AF] italic" th:text="${record.imageDesc}">[사진]</p>

                  <!-- 기록 상태 -->
                  <div class="mt-3">
                    <th:block th:if="${record.hasRecord}">
                      <div class="flex items-center gap-2">
                        <span class="text-xs bg-[#FCE8E3] text-[#C98F81] px-3 py-1 rounded-full">📸 기록 완료</span>
                        <span class="text-xs text-[#B7A4A0]" th:text="'댓글 ' + ${record.commentCount} + '개'">댓글 3개</span>
                      </div>
                    </th:block>
                    <th:block th:unless="${record.hasRecord}">
                      <a th:href="@{/consumption-upload(txId=${record.transactionId})}"
                         onclick="event.stopPropagation()"
                         class="inline-block text-sm bg-[#FFF7F5] hover:bg-[#FCE8E3] text-[#D09B8D] px-4 py-2 rounded-full transition-colors">
                        + 추억 기록하기
                      </a>
                    </th:block>
                  </div>
                </div>
              </div>

              <!-- 오른쪽 -->
              <div class="text-right">
                <p class="text-3xl text-[#6E5A55] font-bold mb-3">
                  -₩<span th:text="${#numbers.formatInteger(record.amount, 0, 'COMMA')}">0</span>
                </p>
                <div>
                  <p class="text-xs text-[#B7A4A0] mb-1">MODAM 체크카드</p>
                  <p class="text-xs text-[#D0B4AB]">•••• 1024</p>
                </div>
              </div>
            </div>
          </div>
        </th:block>

        <!-- 빈 목록 -->
        <div th:if="${#lists.isEmpty(records)}" class="py-20 text-center">
          <div class="w-16 h-16 bg-[#FCE8E3] rounded-full flex items-center justify-center mx-auto mb-4">
            <i data-lucide="search-x" class="w-8 h-8 text-[#D9B8AE]"></i>
          </div>
          <p class="text-gray-500 text-lg">기록된 소비가 없습니다</p>
          <p class="text-gray-400 text-sm mt-2">첫 번째 소비를 기록해보세요</p>
        </div>
      </div>

      <!-- 클라이언트 폴백 목록 -->
      <div id="jsRecordList" class="hidden flex flex-col gap-4"></div>

      <!-- 페이지네이션 -->
      <div id="pagination" class="flex justify-center items-center gap-2 mt-8"></div>

    </div>
  </main>

  <!-- ===== 푸터 ===== -->
  <th:block th:replace="~{common/layout/footer :: footer}"></th:block>

  <script th:inline="javascript">
    /* ===== 서버 데이터 주입 ===== */
    const serverRecords = /*[[${records}]]*/ null;

    const allRecords = serverRecords && serverRecords.length > 0 ? serverRecords : null;
    const ITEMS_PER_PAGE = 9;
    let currentPage = 1;
    let activeCategory = '전체';
    let filteredData = allRecords ? [...allRecords] : [];

    /* ===== 카테고리 선택 ===== */
    function setCategory(cat) {
      activeCategory = cat;
      document.querySelectorAll('.category-chip').forEach(btn => {
        const isActive = btn.dataset.category === cat;
        btn.className = isActive
          ? 'category-chip px-6 py-3 rounded-2xl transition-all flex items-center gap-2 whitespace-nowrap font-medium bg-[#F5A5A5] text-white shadow-md'
          : 'category-chip px-6 py-3 rounded-2xl transition-all flex items-center gap-2 whitespace-nowrap font-medium bg-white text-gray-700 hover:bg-[#FCE8E3] border border-gray-200';
      });
      currentPage = 1;
      if (allRecords) applyFilters();
    }

    /* ===== 필터 적용 ===== */
    function applyFilters() {
      if (!allRecords) return;
      const query   = document.getElementById('searchInput').value.trim().toLowerCase();
      const dateVal = document.getElementById('dateInput').value;

      filteredData = allRecords.filter(r => {
        const matchCat    = activeCategory === '전체' || r.category === activeCategory;
        const matchSearch = !query   || r.place.toLowerCase().includes(query) || (r.memo || '').toLowerCase().includes(query);
        const recordDate  = r.date.replace(/\./g, '-');
        const matchDate   = !dateVal || recordDate === dateVal;
        return matchCat && matchSearch && matchDate;
      });

      currentPage = 1;
      renderList();
    }

    /* ===== 렌더링 ===== */
    function renderList() {
      document.getElementById('serverRecordList').classList.add('hidden');
      const container = document.getElementById('jsRecordList');
      container.classList.remove('hidden');

      const totalPages = Math.max(1, Math.ceil(filteredData.length / ITEMS_PER_PAGE));
      const start = (currentPage - 1) * ITEMS_PER_PAGE;
      const paged = filteredData.slice(start, start + ITEMS_PER_PAGE);

      /* 요약 카드 갱신 */
      const totalAmt = filteredData.reduce((s, r) => s + r.amount, 0);
      const written  = filteredData.filter(r => r.hasRecord).length;
      document.getElementById('totalAmountDisplay').innerHTML = '₩' + totalAmt.toLocaleString();
      document.getElementById('writtenCountDisplay').innerHTML = written + '개';
      document.getElementById('totalCountDisplay').innerHTML  = filteredData.length + '개';

      if (paged.length === 0) {
        container.innerHTML = `
          <div class="py-20 text-center">
            <div class="w-16 h-16 bg-[#FCE8E3] rounded-full flex items-center justify-center mx-auto mb-4">
              <i data-lucide="search-x" class="w-8 h-8 text-[#D9B8AE]"></i>
            </div>
            <p class="text-gray-500 text-lg">검색 결과가 없습니다</p>
            <p class="text-gray-400 text-sm mt-2">다른 조건으로 검색해보세요</p>
          </div>`;
        lucide.createIcons();
        renderPagination(totalPages);
        return;
      }

      container.innerHTML = paged.map(r => `
        <div class="bg-white rounded-[24px] px-6 py-5 shadow-sm hover:shadow-lg hover:-translate-y-1 transition-all duration-300 border border-transparent hover:border-[#F5D5CD] group ${r.hasRecord ? 'cursor-pointer' : ''}"
             ${r.hasRecord ? `onclick="location.href='/consumption-detail/${r.id}'"` : ''}>
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-5">
              <div class="w-16 h-16 rounded-full bg-[#FFF1ED] flex items-center justify-center flex-shrink-0">
                <i data-lucide="${r.iconName}" class="w-8 h-8 text-[#D9B8AE]"></i>
              </div>
              <div>
                <div class="flex items-center gap-3 mb-2">
                  <span class="text-xl">${r.emoticon || ''}</span>
                  <h3 class="text-xl text-[#6E5A55] font-semibold">${r.place}</h3>
                  <span class="text-xs bg-[#FFF1ED] text-[#D09B8D] px-3 py-1 rounded-full">${r.category}</span>
                </div>
                <p class="text-[#A89089] mb-2">
                  ${r.date} · ${r.time}
                  ${r.isUpdated ? '<span class="text-xs text-[#D09B8D] ml-2">(수정됨)</span>' : ''}
                </p>
                <p class="text-sm text-[#B7A4A0] mb-1">${r.memo || ''}</p>
                ${r.hasImage ? `<p class="text-xs text-[#C9B5AF] italic">${r.imageDesc}</p>` : ''}
                <div class="mt-3">
                  ${r.hasRecord
                    ? `<div class="flex items-center gap-2">
                        <span class="text-xs bg-[#FCE8E3] text-[#C98F81] px-3 py-1 rounded-full">📸 기록 완료</span>
                        <span class="text-xs text-[#B7A4A0]">댓글 ${r.commentCount}개</span>
                       </div>`
                    : `<a href="/consumption-upload?txId=${r.transactionId}" onclick="event.stopPropagation()"
                          class="inline-block text-sm bg-[#FFF7F5] hover:bg-[#FCE8E3] text-[#D09B8D] px-4 py-2 rounded-full transition-colors">
                          + 추억 기록하기
                       </a>`
                  }
                </div>
              </div>
            </div>
            <div class="text-right">
              <p class="text-3xl text-[#6E5A55] font-bold mb-3">-₩${r.amount.toLocaleString()}</p>
              <div>
                <p class="text-xs text-[#B7A4A0] mb-1">MODAM 체크카드</p>
                <p class="text-xs text-[#D0B4AB]">•••• 1024</p>
              </div>
            </div>
          </div>
        </div>
      `).join('');

      lucide.createIcons();
      renderPagination(totalPages);
    }

    /* ===== 페이지네이션 ===== */
    function renderPagination(totalPages) {
      const pag = document.getElementById('pagination');
      if (totalPages <= 1) { pag.innerHTML = ''; return; }

      let html = '';
      html += `<button onclick="goPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}
               class="w-10 h-10 rounded-xl border border-gray-200 flex items-center justify-center hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed transition-colors">
               <i data-lucide="chevron-left" class="w-4 h-4 text-gray-600"></i></button>`;

      pageRange(currentPage, totalPages).forEach(p => {
        if (p === '...') {
          html += `<span class="w-10 h-10 flex items-center justify-center text-gray-400">…</span>`;
        } else {
          html += `<button onclick="goPage(${p})"
                   class="w-10 h-10 rounded-xl border transition-colors ${p === currentPage ? 'bg-[#F5A5A5] text-white border-[#F5A5A5] font-bold' : 'border-gray-200 text-gray-700 hover:bg-gray-50'}">
                   ${p}</button>`;
        }
      });

      html += `<button onclick="goPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}
               class="w-10 h-10 rounded-xl border border-gray-200 flex items-center justify-center hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed transition-colors">
               <i data-lucide="chevron-right" class="w-4 h-4 text-gray-600"></i></button>`;

      pag.innerHTML = html;
      lucide.createIcons();
    }

    function goPage(p) {
      const totalPages = Math.max(1, Math.ceil(filteredData.length / ITEMS_PER_PAGE));
      if (p < 1 || p > totalPages) return;
      currentPage = p;
      renderList();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function pageRange(cur, total) {
      if (total <= 7) return Array.from({ length: total }, (_, i) => i + 1);
      if (cur <= 4)  return [1, 2, 3, 4, 5, '...', total];
      if (cur >= total - 3) return [1, '...', total-4, total-3, total-2, total-1, total];
      return [1, '...', cur-1, cur, cur+1, '...', total];
    }

    /* ===== 초기 렌더 ===== */
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });
  </script>
  <th:block th:replace="~{common/layout/header-dashboard :: scripts}"></th:block>
</body>
</html>
