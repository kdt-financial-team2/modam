<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>소비 스토리 - 모담</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- CSRF 토큰 (AJAX POST 요청에 사용) -->
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body class="h-screen overflow-hidden bg-[#FAFAFA] flex flex-col">

  <!-- ===== 헤더 ===== -->
  <th:block th:replace="~{common/layout/header-dashboard :: nav}"></th:block>

  <!-- ===== 메인 콘텐츠: 상단 고정 + 하단 스크롤 ===== -->
  <main class="flex-1 overflow-hidden flex flex-col">

    <!-- ===== 고정 상단: 커플 프로필 + 탭 바 ===== -->
    <div class="flex-shrink-0">

    <!-- ===== 커플 프로필 헤더 ===== -->
    <div class="bg-white border-b border-gray-100 shadow-sm">
      <div class="max-w-3xl mx-auto px-8 py-4">

        <!-- 프로필 행 -->
        <div class="flex items-center justify-between mb-3">

          <!-- 내 프로필 -->
          <div class="flex flex-col items-center gap-2">
            <div class="w-16 h-16 rounded-full ring-4 ring-[#F5A5A5] ring-offset-2 overflow-hidden bg-[#FFF1ED] flex items-center justify-center shadow-md">
              <img th:if="${myProfileImg != null}" th:src="${myProfileImg}" alt="내 프로필" class="w-full h-full object-cover" />
              <i th:unless="${myProfileImg != null}" data-lucide="user" class="w-8 h-8 text-[#D9B8AE]"></i>
            </div>
            <p class="text-sm font-semibold text-gray-700" th:text="${myName}">나</p>
          </div>

          <!-- 중앙 정보 -->
          <div class="text-center flex-1 mx-4">
            <!-- 커플 별명 -->
            <h1 class="text-lg font-bold text-gray-900 mb-0.5"
                th:text="${coupleAcctAlias != null && coupleAcctAlias != '' ? coupleAcctAlias : '우리의 소비 스토리'}">
              우리의 소비 스토리
            </h1>
            <!-- 감정 문구 (고정) -->
            <p class="text-xs text-[#D9B8AE] mb-1">함께한 모든 순간이 우리의 이야기가 돼요 🌸</p>

            <!-- 스토리 통계 -->
            <div class="mt-2 pt-2 border-t border-gray-100 flex justify-center gap-6">
              <div>
                <p class="text-lg font-bold text-gray-900" id="statStory" th:text="${writtenCount}">0</p>
                <p class="text-xs text-gray-500">함께 쓴 스토리</p>
              </div>
              <div class="w-px bg-gray-100"></div>
              <div>
                <p class="text-lg font-bold text-[#F5A5A5]" th:text="${favoriteCount}">0</p>
                <p class="text-xs text-gray-500">마음에 담은 순간</p>
              </div>
            </div>
          </div>

          <!-- 파트너 프로필 -->
          <div class="flex flex-col items-center gap-2">
            <div class="w-16 h-16 rounded-full ring-4 ring-[#F5A5A5] ring-offset-2 overflow-hidden bg-[#FFF1ED] flex items-center justify-center shadow-md">
              <img th:if="${partnerProfileImg != null}" th:src="${partnerProfileImg}" alt="파트너 프로필" class="w-full h-full object-cover" />
              <th:block th:unless="${partnerProfileImg != null}">
                <i th:if="${partnerName == null || partnerName == ''}" data-lucide="user" class="w-8 h-8 text-[#D9B8AE]"></i>
                <span th:unless="${partnerName == null || partnerName == ''}"
                      class="text-2xl font-bold text-[#D9B8AE]"
                      th:text="${#strings.substring(partnerName, 0, 1)}"></span>
              </th:block>
            </div>
            <p class="text-sm font-semibold text-gray-700"
               th:text="${partnerName != null && partnerName != '' ? partnerName : '파트너'}">파트너</p>
          </div>
        </div>
      </div>
    </div>

    <!-- 탭 + 소비 기록하기 버튼 (파트너 연결 시에만 표시) -->
    <div th:if="${partnerConnected}" class="max-w-3xl mx-auto px-8 bg-[#FAFAFA]">
      <div class="flex items-stretch border-t border-gray-200">
        <button id="tab-all" onclick="setTab('all')"
                class="story-tab flex-1 flex flex-col items-center gap-1.5 py-3 text-xs font-semibold text-gray-900 border-t-2 border-gray-900 transition-all">
          <i data-lucide="grid-3x3" class="w-5 h-5"></i>
          <span>전체 스토리</span>
        </button>
        <button id="tab-fav" onclick="setTab('fav')"
                class="story-tab flex-1 flex flex-col items-center gap-1.5 py-3 text-xs font-semibold text-gray-400 border-t-2 border-transparent hover:text-gray-600 transition-all">
          <i data-lucide="bookmark" class="w-5 h-5"></i>
          <span>즐겨찾기</span>
        </button>
        <a th:href="@{/consumption-select}" href="/consumption-select"
           class="flex flex-col items-center gap-1.5 py-3 px-5 text-xs font-semibold text-[#F5A5A5] border-t-2 border-transparent hover:border-[#F5A5A5] hover:bg-[#FFF7F5] transition-all whitespace-nowrap">
          <i data-lucide="plus-circle" class="w-5 h-5"></i>
          <span>기록하기</span>
        </a>
      </div>
    </div>

    </div><!-- /고정 상단 -->

    <!-- ===== 파트너 미연결 안내 화면 ===== -->
    <div th:unless="${partnerConnected}" class="flex-1 flex flex-col items-center justify-center py-24 text-center px-8">
      <div class="w-24 h-24 bg-[#FCE8E3] rounded-full flex items-center justify-center mx-auto mb-6">
        <i data-lucide="lock" class="w-12 h-12 text-[#D9B8AE]"></i>
      </div>
      <h3 class="text-xl font-semibold text-gray-700 mb-3">파트너 연결이 필요해요</h3>
      <p class="text-sm text-gray-400 mb-8 leading-relaxed">
        소비 스토리는 파트너와 함께 쓰는 기능이에요.<br>
        먼저 파트너를 연결하고 우리만의 이야기를 시작해 보세요 🌸
      </p>
      <a href="/invite"
         class="inline-flex items-center gap-2 px-8 py-3.5 bg-[#F5A5A5] text-white rounded-full hover:bg-[#F28B8B] transition-colors font-medium shadow-md">
        <i data-lucide="link" class="w-5 h-5"></i>
        파트너 연결하러 가기
      </a>
    </div>

    <!-- ===== 스크롤 영역: 스토리 그리드 (파트너 연결 시에만) ===== -->
    <div th:if="${partnerConnected}" class="flex-1 overflow-y-auto">
    <div class="max-w-3xl mx-auto px-8 py-4">

      <!-- ===== 서버사이드 그리드 (초기 렌더) ===== -->
      <div id="serverGrid">

        <!-- 스토리가 없는 경우 (빈 상태) -->
        <div th:if="${#lists.isEmpty(storyRecords)}" class="py-24 text-center">
          <div class="w-24 h-24 bg-[#FCE8E3] rounded-full flex items-center justify-center mx-auto mb-6">
            <i data-lucide="camera" class="w-12 h-12 text-[#D9B8AE]"></i>
          </div>
          <h3 class="text-xl font-semibold text-gray-600 mb-3">아직 소비 스토리가 없어요</h3>
          <p class="text-gray-400 text-sm mb-8">소비의 순간을 사진과 함께 기록해보세요</p>
          <a th:href="@{/consumption-select}" href="/consumption-select"
             class="inline-flex items-center gap-2 px-8 py-3.5 bg-[#F5A5A5] text-white rounded-full hover:bg-[#F28B8B] transition-colors font-medium shadow-md">
            <i data-lucide="plus" class="w-5 h-5"></i>
            소비 기록하기
          </a>
        </div>

        <!-- 스토리 그리드 (3열) -->
        <div th:unless="${#lists.isEmpty(storyRecords)}" class="grid grid-cols-3 gap-3">
          <div th:each="record : ${storyRecords}"
               th:attr="data-category=${record.category}"
               class="group cursor-pointer bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-md hover:-translate-y-0.5 transition-all duration-200 border border-gray-100"
               th:onclick="|location.href='@{/consumption-detail/{id}(id=${record.id})}'|">

            <!-- 사진 영역 (정사각형 고정) -->
            <div class="aspect-square relative overflow-hidden bg-[#FFF1ED]">
              <!-- 이미지가 있으면 이미지 표시 -->
              <img th:if="${record.hasImage}" th:src="${record.imageUrl}" alt="소비 스토리"
                   class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />

              <!-- 이미지 없으면 이모지 표시 -->
              <div th:unless="${record.hasImage}"
                   class="w-full h-full flex flex-col items-center justify-center p-4 bg-gradient-to-br from-[#FFF1ED] to-[#FCE8E3]">
                <span class="text-5xl" th:text="${record.emoticon != null ? record.emoticon : '📸'}">📸</span>
              </div>

              <!-- 이미지가 있을 때 이모티콘 오버레이 -->
              <div th:if="${record.hasImage and record.emoticon != null}"
                   class="absolute bottom-2 left-2 text-2xl leading-none drop-shadow-md pointer-events-none"
                   th:text="${record.emoticon}"></div>

              <!-- 즐겨찾기 배지 -->
              <div th:if="${record.favorited}"
                   class="absolute top-2 right-2 text-yellow-400 drop-shadow pointer-events-none">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
                </svg>
              </div>
            </div>

            <!-- 정보 영역 -->
            <div class="px-3 py-2.5">
              <!-- 제목 + 카테고리 태그 -->
              <div class="flex items-center justify-between gap-1 mb-1">
                <p class="text-sm font-semibold text-[#6E5A55] truncate"
                   th:text="${record.title != null and record.title != '' ? record.title : record.place}">제목</p>
                <span class="text-xs bg-[#FFF1ED] text-[#D09B8D] px-2 py-0.5 rounded-full whitespace-nowrap flex-shrink-0"
                      th:text="${record.category}">카테고리</span>
              </div>
              <!-- 날짜 -->
              <p class="text-xs text-gray-400" th:text="${record.date}">날짜</p>
            </div>
          </div>
        </div>

      </div>

      <!-- ===== JS 필터 그리드 (탭/즐겨찾기 선택 시 교체) ===== -->
      <div id="jsGrid" class="hidden"></div>

    </div>
    </div><!-- /스크롤 영역 -->

  </main>

  <!-- ===== 푸터 ===== -->
  <th:block th:replace="~{common/layout/footer :: footer}"></th:block>

  <script th:inline="javascript">
    /* ===== 서버 데이터 주입 ===== */
    const serverRecords = /*[[${records}]]*/ null;
    // 스토리가 있는 항목만 필터링 후 작성일 내림차순 정렬
    const storyItems = serverRecords
      ? serverRecords
          .filter(r => r.hasRecord)
          .sort((a, b) => {
            if (!a.createdAt && !b.createdAt) return 0;
            if (!a.createdAt) return 1;
            if (!b.createdAt) return -1;
            return new Date(b.createdAt) - new Date(a.createdAt);
          })
      : [];

    // CSRF 토큰 (즐겨찾기 POST 요청에 사용)
    const csrfToken  = document.querySelector('meta[name="_csrf"]').content;
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

    let activeTab = 'all'; // 'all' | 'fav'

    /* ===== 탭 전환 ===== */
    function setTab(tab) {
      activeTab = tab;
      const activeClass = 'story-tab flex-1 flex flex-col items-center gap-1.5 py-3 text-xs font-semibold text-gray-900 border-t-2 border-gray-900 transition-all';
      const inactiveClass = 'story-tab flex-1 flex flex-col items-center gap-1.5 py-3 text-xs font-semibold text-gray-400 border-t-2 border-transparent hover:text-gray-600 transition-all';
      document.getElementById('tab-all').className = tab === 'all' ? activeClass : inactiveClass;
      document.getElementById('tab-fav').className = tab === 'fav' ? activeClass : inactiveClass;
      renderGrid();
    }

    /* ===== 즐겨찾기 토글 (더블클릭) — API 호출 후 로컬 데이터 갱신 ===== */
    async function toggleFav(id) {
      try {
        const res = await fetch(`/api/favorites/${id}`, {
          method: 'POST',
          headers: { [csrfHeader]: csrfToken }
        });
        const body = await res.json();
        if (body.success) {
          // 로컬 storyItems의 favorited 값 갱신
          const item = storyItems.find(r => r.id === id);
          if (item) item.favorited = body.data.favorited;
          renderGrid();
        }
      } catch (e) {
        console.error('즐겨찾기 오류:', e);
      }
    }

    /* ===== 그리드 렌더링 ===== */
    function renderGrid() {
      document.getElementById('serverGrid').classList.add('hidden');
      const container = document.getElementById('jsGrid');
      container.classList.remove('hidden');

      const filtered = activeTab === 'fav'
        ? storyItems.filter(r => r.favorited)
        : storyItems;

      // 빈 상태
      if (filtered.length === 0) {
        const msg = activeTab === 'fav'
          ? '즐겨찾기한 스토리가 없어요<br><span style="font-size:12px;color:#9ca3af">스토리를 더블클릭해서 즐겨찾기에 추가하세요</span>'
          : '아직 소비 스토리가 없어요';
        container.innerHTML = `
          <div class="py-24 text-center">
            <div class="w-24 h-24 bg-[#FCE8E3] rounded-full flex items-center justify-center mx-auto mb-6">
              <i data-lucide="${activeTab === 'fav' ? 'bookmark' : 'camera'}" class="w-12 h-12 text-[#D9B8AE]"></i>
            </div>
            <h3 class="text-xl font-semibold text-gray-600 mb-3">${msg}</h3>
            ${activeTab === 'all' ? `
            <p class="text-gray-400 text-sm mb-8">소비의 순간을 사진과 함께 기록해보세요</p>
            <a href="/consumption-select"
               class="inline-flex items-center gap-2 px-8 py-3.5 bg-[#F5A5A5] text-white rounded-full hover:bg-[#F28B8B] transition-colors font-medium shadow-md">
              + 소비 기록하기
            </a>` : ''}
          </div>`;
        lucide.createIcons();
        return;
      }

      // 그리드 렌더링
      container.innerHTML = `
        <div class="grid grid-cols-3 gap-3">
          ${filtered.map(r => `
            <div class="group cursor-pointer bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-md hover:-translate-y-0.5 transition-all duration-200 border border-gray-100"
                 onclick="location.href='/consumption-detail/${r.id}'"
                 ondblclick="event.preventDefault(); event.stopPropagation(); toggleFav(${r.id})">
              <!-- 사진 영역 -->
              <div class="aspect-square relative overflow-hidden bg-[#FFF1ED]">
                ${r.hasImage
                  ? `<img src="${escapeHtml(r.imageUrl)}" alt="소비 스토리" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />`
                  : `<div class="w-full h-full flex flex-col items-center justify-center p-4 bg-gradient-to-br from-[#FFF1ED] to-[#FCE8E3]">
                       <span class="text-5xl">${r.emoticon || '📸'}</span>
                     </div>`
                }
                ${r.hasImage && r.emoticon ? `<div class="absolute bottom-2 left-2 text-2xl leading-none drop-shadow-md pointer-events-none">${r.emoticon}</div>` : ''}
                ${r.favorited ? `<div class="absolute top-2 right-2 text-yellow-400 drop-shadow pointer-events-none">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
                </div>` : ''}
              </div>
              <!-- 정보 영역 -->
              <div style="padding:10px 12px 10px">
                <div style="display:flex;align-items:center;justify-content:space-between;gap:4px;margin-bottom:4px">
                  <p style="font-size:13px;font-weight:600;color:#6E5A55;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(r.title || r.place)}</p>
                  <span style="font-size:11px;background:#FFF1ED;color:#D09B8D;padding:2px 8px;border-radius:999px;white-space:nowrap;flex-shrink:0">${escapeHtml(r.category)}</span>
                </div>
                <p style="font-size:11px;color:#9ca3af">${r.date || ''}</p>
              </div>
            </div>`).join('')}
        </div>`;
    }

    /* XSS 방지용 이스케이프 */
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    /* ===== 초기화 ===== */
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      // 페이지 첫 진입 시 스토리가 있으면 JS 그리드로 전환
      if (storyItems.length > 0) renderGrid();
    });
  </script>

  <th:block th:replace="~{common/layout/header-dashboard :: scripts}"></th:block>
</body>
</html>
