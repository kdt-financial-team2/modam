<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>소비 스토리 - 모담</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-[#FAFAFA] flex flex-col">

  <!-- ===== 헤더 ===== -->
  <th:block th:replace="~{common/layout/header-dashboard :: nav}"></th:block>

  <!-- ===== 메인 콘텐츠 ===== -->
  <main class="flex-1">

    <!-- ===== 커플 프로필 헤더 ===== -->
    <div class="bg-white border-b border-gray-100 shadow-sm">
      <div class="max-w-3xl mx-auto px-8 py-10">

        <!-- 프로필 행 -->
        <div class="flex items-center justify-between mb-8">

          <!-- 내 프로필 -->
          <div class="flex flex-col items-center gap-3">
            <div class="w-24 h-24 rounded-full ring-4 ring-[#F5A5A5] ring-offset-2 overflow-hidden bg-[#FFF1ED] flex items-center justify-center shadow-md">
              <img th:if="${myProfileImg != null}" th:src="${myProfileImg}" alt="내 프로필" class="w-full h-full object-cover" />
              <span th:unless="${myProfileImg != null}"
                    class="text-3xl font-bold text-[#D9B8AE]"
                    th:text="${#strings.substring(myName, 0, 1)}">나</span>
            </div>
            <p class="text-sm font-semibold text-gray-700" th:text="${myName}">나</p>
          </div>

          <!-- 중앙 정보 -->
          <div class="text-center flex-1 mx-8">
            <!-- 커플 별명 or 기본 타이틀 -->
            <h1 class="text-2xl font-bold text-gray-900 mb-1"
                th:text="${coupleAcctAlias != null && coupleAcctAlias != '' ? coupleAcctAlias : '우리의 소비 스토리'}">
              우리의 소비 스토리
            </h1>
            <!-- D+N일 -->
            <p th:if="${daysTogether > 0}" class="text-[#F5A5A5] font-bold text-xl mb-1"
               th:text="'D+' + ${daysTogether} + '일'">D+0일</p>
            <p th:if="${coupleStartDate != null && coupleStartDate != ''}"
               class="text-gray-400 text-sm"
               th:text="${coupleStartDate} + '부터'"></p>

            <!-- 통계 -->
            <div class="flex justify-center gap-10 mt-6 pt-5 border-t border-gray-100">
              <div class="text-center">
                <p class="text-2xl font-bold text-gray-900" id="statStory" th:text="${writtenCount}">0</p>
                <p class="text-xs text-gray-500 mt-0.5">스토리</p>
              </div>
              <div class="w-px bg-gray-200"></div>
              <div class="text-center">
                <p class="text-2xl font-bold text-[#F5A5A5]">
                  ₩<span id="statAmount" th:text="${#numbers.formatInteger(totalAmount, 0, 'COMMA')}">0</span>
                </p>
                <p class="text-xs text-gray-500 mt-0.5">이번 달 소비</p>
              </div>
              <div class="w-px bg-gray-200"></div>
              <div class="text-center">
                <p class="text-2xl font-bold text-gray-900" id="statTotal" th:text="${totalCount}">0</p>
                <p class="text-xs text-gray-500 mt-0.5">소비 내역</p>
              </div>
            </div>
          </div>

          <!-- 파트너 프로필 -->
          <div class="flex flex-col items-center gap-3">
            <div class="w-24 h-24 rounded-full ring-4 ring-[#F5A5A5] ring-offset-2 overflow-hidden bg-[#FFF1ED] flex items-center justify-center shadow-md">
              <img th:if="${partnerProfileImg != null}" th:src="${partnerProfileImg}" alt="파트너 프로필" class="w-full h-full object-cover" />
              <th:block th:unless="${partnerProfileImg != null}">
                <i th:if="${partnerName == null || partnerName == ''}" data-lucide="user" class="w-10 h-10 text-[#D9B8AE]"></i>
                <span th:unless="${partnerName == null || partnerName == ''}"
                      class="text-3xl font-bold text-[#D9B8AE]"
                      th:text="${#strings.substring(partnerName, 0, 1)}"></span>
              </th:block>
            </div>
            <p class="text-sm font-semibold text-gray-700"
               th:text="${partnerName != null && partnerName != '' ? partnerName : '파트너'}">파트너</p>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== 그리드 콘텐츠 ===== -->
    <div class="max-w-3xl mx-auto px-8 py-6">

      <!-- 필터 + 소비 기록하기 버튼 행 -->
      <div class="flex items-center justify-between mb-6 flex-wrap gap-4">

        <!-- 카테고리 칩 -->
        <div class="flex items-center gap-2 overflow-x-auto pb-1 flex-1" id="categoryChips">
          <button onclick="setCategory('전체')" data-category="전체"
                  class="category-chip px-4 py-2 rounded-full text-sm font-medium bg-[#F5A5A5] text-white transition-all whitespace-nowrap shadow-sm">
            전체
          </button>
          <button onclick="setCategory('식비')" data-category="식비"
                  class="category-chip px-4 py-2 rounded-full text-sm font-medium bg-white text-gray-600 border border-gray-200 hover:bg-[#FCE8E3] transition-all whitespace-nowrap">
            🍽 식비
          </button>
          <button onclick="setCategory('카페')" data-category="카페"
                  class="category-chip px-4 py-2 rounded-full text-sm font-medium bg-white text-gray-600 border border-gray-200 hover:bg-[#FCE8E3] transition-all whitespace-nowrap">
            ☕ 카페
          </button>
          <button onclick="setCategory('데이트')" data-category="데이트"
                  class="category-chip px-4 py-2 rounded-full text-sm font-medium bg-white text-gray-600 border border-gray-200 hover:bg-[#FCE8E3] transition-all whitespace-nowrap">
            💕 데이트
          </button>
          <button onclick="setCategory('생활')" data-category="생활"
                  class="category-chip px-4 py-2 rounded-full text-sm font-medium bg-white text-gray-600 border border-gray-200 hover:bg-[#FCE8E3] transition-all whitespace-nowrap">
            🛍 생활
          </button>
          <button onclick="setCategory('교통')" data-category="교통"
                  class="category-chip px-4 py-2 rounded-full text-sm font-medium bg-white text-gray-600 border border-gray-200 hover:bg-[#FCE8E3] transition-all whitespace-nowrap">
            🚗 교통
          </button>
          <button onclick="setCategory('쇼핑')" data-category="쇼핑"
                  class="category-chip px-4 py-2 rounded-full text-sm font-medium bg-white text-gray-600 border border-gray-200 hover:bg-[#FCE8E3] transition-all whitespace-nowrap">
            🛒 쇼핑
          </button>
        </div>

        <!-- 소비 기록하기 버튼 (항상 표시) -->
        <a th:href="@{/consumption-select}" href="/consumption-select"
           class="flex items-center gap-2 px-5 py-2.5 bg-[#F5A5A5] text-white rounded-full hover:bg-[#F28B8B] transition-colors shadow-sm font-medium text-sm whitespace-nowrap flex-shrink-0">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span>소비 기록하기</span>
        </a>
      </div>

      <!-- ===== 서버사이드 그리드 (초기 렌더) ===== -->
      <div id="serverGrid">

        <!-- 스토리가 없는 경우 (빈 상태) -->
        <div th:if="${#lists.isEmpty(storyRecords)}" class="py-24 text-center">
          <div class="w-24 h-24 bg-[#FCE8E3] rounded-full flex items-center justify-center mx-auto mb-6">
            <i data-lucide="camera" class="w-12 h-12 text-[#D9B8AE]"></i>
          </div>
          <h3 class="text-xl font-semibold text-gray-600 mb-3">아직 소비 스토리가 없어요</h3>
          <p class="text-gray-400 text-sm mb-8">소비의 순간을 사진과 함께 기록해보세요</p>
          <a th:href="@{/consumption-select}" href="/consumption-select"
             class="inline-flex items-center gap-2 px-8 py-3.5 bg-[#F5A5A5] text-white rounded-full hover:bg-[#F28B8B] transition-colors font-medium shadow-md">
            <i data-lucide="plus" class="w-5 h-5"></i>
            소비 기록하기
          </a>
        </div>

        <!-- 스토리 그리드 (3열) -->
        <div th:unless="${#lists.isEmpty(storyRecords)}" class="grid grid-cols-3 gap-1">
          <div th:each="record : ${storyRecords}"
               th:attr="data-category=${record.category}"
               class="aspect-square relative group cursor-pointer overflow-hidden bg-[#FFF1ED]"
               th:onclick="|location.href='@{/consumption-detail/{id}(id=${record.id})}'|">

            <!-- 이미지가 있으면 이미지 표시 -->
            <img th:if="${record.hasImage}" th:src="${record.imageUrl}" alt="소비 스토리"
                 class="w-full h-full object-cover" />

            <!-- 이미지 없으면 이모지 + 장소명 표시 -->
            <div th:unless="${record.hasImage}"
                 class="w-full h-full flex flex-col items-center justify-center p-4 bg-gradient-to-br from-[#FFF1ED] to-[#FCE8E3]">
              <span class="text-5xl mb-2" th:text="${record.emoticon != null ? record.emoticon : '📸'}">📸</span>
              <p class="text-xs font-semibold text-[#6E5A55] text-center line-clamp-2 px-2"
                 th:text="${record.place}">장소</p>
            </div>

            <!-- 호버 오버레이 -->
            <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity duration-200 flex flex-col items-center justify-center text-white p-3 gap-1">
              <p class="font-bold text-lg leading-tight">
                -₩<span th:text="${#numbers.formatInteger(record.amount, 0, 'COMMA')}">0</span>
              </p>
              <p class="text-sm opacity-90" th:text="${record.place}">장소</p>
              <p class="text-xs opacity-60" th:text="${record.date}">날짜</p>
              <span class="mt-1 text-xs bg-white/20 px-2.5 py-0.5 rounded-full"
                    th:text="${record.category}">카테고리</span>
            </div>
          </div>
        </div>

      </div>

      <!-- ===== JS 필터 그리드 (카테고리 선택 시 교체) ===== -->
      <div id="jsGrid" class="hidden"></div>

    </div>
  </main>

  <!-- ===== 푸터 ===== -->
  <th:block th:replace="~{common/layout/footer :: footer}"></th:block>

  <script th:inline="javascript">
    /* ===== 서버 데이터 주입 ===== */
    const serverRecords = /*[[${records}]]*/ null;

    // 스토리가 있는 기록만 필터링 (그리드용)
    const storyItems = serverRecords ? serverRecords.filter(r => r.hasRecord) : [];

    let activeCategory = '전체';

    /* ===== 카테고리 선택 ===== */
    function setCategory(cat) {
      activeCategory = cat;
      // 칩 스타일 갱신
      document.querySelectorAll('.category-chip').forEach(btn => {
        const isActive = btn.dataset.category === cat;
        btn.className = isActive
          ? 'category-chip px-4 py-2 rounded-full text-sm font-medium bg-[#F5A5A5] text-white transition-all whitespace-nowrap shadow-sm'
          : 'category-chip px-4 py-2 rounded-full text-sm font-medium bg-white text-gray-600 border border-gray-200 hover:bg-[#FCE8E3] transition-all whitespace-nowrap';
      });
      renderGrid();
    }

    /* ===== 그리드 렌더링 ===== */
    function renderGrid() {
      // 서버 렌더링 그리드 숨기기
      document.getElementById('serverGrid').classList.add('hidden');
      const container = document.getElementById('jsGrid');
      container.classList.remove('hidden');

      // 카테고리 필터 적용
      const filtered = storyItems.filter(r =>
        activeCategory === '전체' || r.category === activeCategory
      );

      // 빈 상태
      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="py-24 text-center">
            <div class="w-24 h-24 bg-[#FCE8E3] rounded-full flex items-center justify-center mx-auto mb-6">
              <i data-lucide="camera" class="w-12 h-12 text-[#D9B8AE]"></i>
            </div>
            <h3 class="text-xl font-semibold text-gray-600 mb-3">
              ${activeCategory === '전체' ? '아직 소비 스토리가 없어요' : activeCategory + ' 카테고리 스토리가 없어요'}
            </h3>
            <p class="text-gray-400 text-sm mb-8">소비의 순간을 사진과 함께 기록해보세요</p>
            <a href="/consumption-select"
               class="inline-flex items-center gap-2 px-8 py-3.5 bg-[#F5A5A5] text-white rounded-full hover:bg-[#F28B8B] transition-colors font-medium shadow-md">
              + 소비 기록하기
            </a>
          </div>`;
        lucide.createIcons();
        return;
      }

      // 그리드 렌더링
      container.innerHTML = `
        <div class="grid grid-cols-3 gap-1">
          ${filtered.map(r => `
            <div class="aspect-square relative group cursor-pointer overflow-hidden bg-[#FFF1ED]"
                 onclick="location.href='/consumption-detail/${r.id}'">
              ${r.hasImage
                ? `<img src="${escapeHtml(r.imageUrl)}" alt="소비 스토리" class="w-full h-full object-cover" />`
                : `<div class="w-full h-full flex flex-col items-center justify-center p-4 bg-gradient-to-br from-[#FFF1ED] to-[#FCE8E3]">
                     <span class="text-5xl mb-2">${r.emoticon || '📸'}</span>
                     <p class="text-xs font-semibold text-center px-2" style="color:#6E5A55">${escapeHtml(r.place)}</p>
                   </div>`
              }
              <div class="absolute inset-0 opacity-0 group-hover:opacity-100 transition-opacity duration-200 flex flex-col items-center justify-center text-white p-3 gap-1"
                   style="background:rgba(0,0,0,0.6)">
                <p class="font-bold text-lg leading-tight">-₩${Number(r.amount).toLocaleString()}</p>
                <p class="text-sm" style="opacity:0.9">${escapeHtml(r.place)}</p>
                <p class="text-xs" style="opacity:0.6">${r.date}</p>
                <span class="text-xs px-2.5 py-0.5 rounded-full mt-1" style="background:rgba(255,255,255,0.2)">${escapeHtml(r.category)}</span>
              </div>
            </div>
          `).join('')}
        </div>`;
    }

    /* XSS 방지용 이스케이프 */
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    /* ===== 초기화 ===== */
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });
  </script>

  <th:block th:replace="~{common/layout/header-dashboard :: scripts}"></th:block>
</body>
</html>
