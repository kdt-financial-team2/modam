<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>커플 정보 수정 | 모담</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen flex flex-col bg-gray-50">

  <!-- ===== 상단 네비게이션 헤더 ===== -->
  <th:block th:replace="~{common/layout/header-dashboard :: nav}"></th:block>

  <!-- ===== 메인 콘텐츠 ===== -->
  <main class="flex-1 flex items-center justify-center py-12 px-4">
    <div class="w-full max-w-md">

      <!-- 뒤로 가기 -->
      <a th:href="@{/dashboard}"
         class="inline-flex items-center gap-2 text-gray-500 hover:text-gray-700 mb-6 text-sm font-medium transition-colors">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        대시보드로 돌아가기
      </a>

      <!-- ===== 수정 카드 ===== -->
      <div class="bg-gradient-to-br from-[#FCE8E3] to-[#FFE4E8] rounded-3xl shadow-sm border border-gray-100 p-6">

        <!-- 카드 헤더 -->
        <div class="flex items-center justify-between mb-6">
          <h3 class="text-lg font-bold text-gray-900">커플 정보</h3>
          <i data-lucide="edit" class="w-5 h-5 text-gray-700"></i>
        </div>

        <form th:action="@{/couple-info/edit}" method="post" class="space-y-4">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

          <!-- 시작일 -->
          <div class="bg-white/70 backdrop-blur rounded-2xl p-5">
            <label class="flex items-center gap-2 text-sm font-medium text-gray-700 mb-3">
              <i data-lucide="calendar" class="w-4 h-4 text-[#F5A5A5]"></i>
              시작일
            </label>
            <input type="date" name="dDay"
                   th:value="${dDay}"
                   class="w-full px-4 py-3 bg-white border-2 border-gray-200 rounded-xl
                          focus:border-[#F5A5A5] focus:outline-none transition-colors text-gray-800"/>
          </div>

          <!-- 계좌 애칭 -->
          <div class="bg-white/70 backdrop-blur rounded-2xl p-5">
            <label class="flex items-center gap-2 text-sm font-medium text-gray-700 mb-3">
              <i data-lucide="sparkles" class="w-4 h-4 text-[#F5A5A5]"></i>
              계좌 애칭
            </label>
            <input type="text" name="acctAlias"
                   th:value="${acctAlias}"
                   placeholder="예: 우리의 여행통장"
                   class="w-full px-4 py-3 bg-white border-2 border-gray-200 rounded-xl
                          focus:border-[#F5A5A5] focus:outline-none transition-colors placeholder:text-gray-400 text-gray-800"/>
            <!-- 추천 애칭 -->
            <div class="mt-3">
              <p class="text-xs text-gray-500 mb-2">💡 추천 애칭:</p>
              <div class="flex flex-wrap gap-2">
                <button type="button" onclick="setAlias('우리의 여행통장')"
                        class="text-xs px-3 py-1.5 bg-white/80 text-gray-700 rounded-full
                               hover:bg-[#F5A5A5] hover:text-white transition-colors">
                  우리의 여행통장
                </button>
                <button type="button" onclick="setAlias('데이트 통장')"
                        class="text-xs px-3 py-1.5 bg-white/80 text-gray-700 rounded-full
                               hover:bg-[#F5A5A5] hover:text-white transition-colors">
                  데이트 통장
                </button>
                <button type="button" onclick="setAlias('모담 커플통장')"
                        class="text-xs px-3 py-1.5 bg-white/80 text-gray-700 rounded-full
                               hover:bg-[#F5A5A5] hover:text-white transition-colors">
                  모담 커플통장
                </button>
              </div>
            </div>
          </div>

          <!-- 버튼 영역 -->
          <div class="flex gap-3 pt-1">
            <a th:href="@{/dashboard}"
               class="flex-1 py-4 bg-white/70 text-gray-700 rounded-xl hover:bg-white
                      transition-colors font-medium text-center">
              취소
            </a>
            <button type="submit"
                    class="flex-1 py-4 bg-[#F5A5A5] text-white rounded-xl hover:bg-[#F28B8B]
                           transition-colors font-semibold shadow-md">
              저장하기
            </button>
          </div>
        </form>

      </div>
    </div>
  </main>

  <script>
    lucide.createIcons();

    /* ---- 추천 애칭 선택 ---- */
    function setAlias(value) {
      document.querySelector('input[name="acctAlias"]').value = value;
    }
  </script>
  <th:block th:replace="~{common/layout/header-dashboard :: scripts}"></th:block>
</body>
</html>
