<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>소비 분석 - 모담</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
</head>
<body class="min-h-screen flex flex-col bg-white">
  <div th:replace="~{fragments/header :: nav}"></div>

  <main class="flex-1 w-full max-w-[1440px] mx-auto bg-gray-50">
    <div class="px-8 py-12">
      <h1 class="text-4xl font-bold text-gray-900 mb-3">소비 분석</h1>
      <p class="text-gray-600 text-lg mb-10">지출 패턴을 분석하고 현명하게 관리하세요</p>

      <!-- 월 선택 -->
      <div class="flex gap-3 mb-8">
        <form th:action="@{/spending-analysis}" method="get">
          <input type="month" name="month" th:value="${selectedMonth}"
                 class="px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-[#F5A5A5] focus:outline-none transition-colors"/>
          <button type="submit" class="ml-2 px-5 py-3 bg-[#F5A5A5] text-white rounded-xl hover:bg-[#F28B8B] transition-colors">조회</button>
        </form>
      </div>

      <div class="grid grid-cols-2 gap-8">
        <!-- 도넛 차트 -->
        <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-8">
          <h2 class="text-2xl font-bold text-gray-900 mb-6">카테고리별 지출</h2>
          <div class="flex items-center gap-8">
            <div class="w-64 h-64">
              <canvas id="categoryChart"></canvas>
            </div>
            <div class="space-y-3 flex-1">
              <div th:each="item : ${expenseByCategory}" class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                  <div class="w-4 h-4 rounded-full" th:style="'background-color: ' + ${item.color}"></div>
                  <span class="text-gray-700" th:text="${item.name}">카테고리</span>
                </div>
                <div class="text-right">
                  <div class="font-medium text-gray-900">₩<span th:text="${#numbers.formatInteger(item.amount, 0, 'COMMA')}">0</span></div>
                  <div class="text-sm text-gray-500"><span th:text="${item.percentage}">0</span>%</div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- 월별 지출 막대 차트 -->
        <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-8">
          <h2 class="text-2xl font-bold text-gray-900 mb-6">월별 지출 추이</h2>
          <canvas id="monthlyChart" height="200"></canvas>
        </div>

        <!-- 카테고리별 막대 진행 -->
        <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-8 col-span-2">
          <h2 class="text-2xl font-bold text-gray-900 mb-6">카테고리별 예산 대비</h2>
          <div class="space-y-5">
            <div th:each="item : ${expenseVsBudget}">
              <div class="flex justify-between mb-2">
                <span class="text-gray-700" th:text="${item.category}">카테고리</span>
                <span class="text-gray-900">₩<span th:text="${#numbers.formatInteger(item.spent, 0, 'COMMA')}">0</span> / ₩<span th:text="${#numbers.formatInteger(item.budget, 0, 'COMMA')}">0</span></span>
              </div>
              <div class="w-full bg-gray-200 rounded-full h-3">
                <div class="h-3 rounded-full transition-all"
                     th:classappend="${item.percentage > 100} ? 'bg-red-400' : 'bg-[#F5A5A5]'"
                     th:style="'width: ' + ${item.percentage > 100 ? 100 : item.percentage} + '%'"></div>
              </div>
              <div class="flex justify-between mt-1">
                <span class="text-xs text-gray-500"><span th:text="${item.percentage}">0</span>% 사용</span>
                <span th:if="${item.percentage > 100}" class="text-xs text-red-500">⚠ 예산 초과</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div th:replace="~{fragments/footer :: footer}"></div>

  <script>
    lucide.createIcons();

    const categoryData = /*[[${categoryChartJson}]]*/ {labels:[], data:[], colors:[]};
    new Chart(document.getElementById('categoryChart').getContext('2d'), {
      type: 'doughnut',
      data: {
        labels: categoryData.labels,
        datasets: [{ data: categoryData.data, backgroundColor: categoryData.colors, borderWidth: 2, borderColor: '#fff' }]
      },
      options: { responsive: true, cutout: '60%', plugins: { legend: { display: false } } }
    });

    const monthlyData = /*[[${monthlyChartJson}]]*/ {labels:[], data:[]};
    new Chart(document.getElementById('monthlyChart').getContext('2d'), {
      type: 'bar',
      data: {
        labels: monthlyData.labels,
        datasets: [{ label: '지출', data: monthlyData.data, backgroundColor: '#F5A5A5', borderRadius: 8 }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: { y: { ticks: { callback: v => '₩' + v.toLocaleString() } } }
      }
    });
  </script>
</body>
</html>
