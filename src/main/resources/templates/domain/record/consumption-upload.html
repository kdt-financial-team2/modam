<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>소비 기록 추가 - 모담</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen flex flex-col bg-white">
  <div th:replace="~{fragments/header :: nav}"></div>

  <main class="flex-1 w-full max-w-[1440px] mx-auto bg-[#FAFAFA]">
    <div class="max-w-[700px] mx-auto px-8 py-12">
      <div class="mb-8">
        <h1 class="text-3xl text-gray-800">소비 기록 추가</h1>
        <p class="text-gray-600 mt-2">소비 내역과 감정을 함께 기록해보세요</p>
      </div>

      <form th:action="@{/consumption-upload}" method="post" enctype="multipart/form-data" class="bg-white rounded-3xl shadow-sm p-10">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="space-y-6">
          <!-- 상호명 -->
          <div>
            <label class="block text-gray-800 mb-2 text-lg">상호명</label>
            <input type="text" name="name" class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:border-[#F5A5A5] focus:outline-none transition-colors" placeholder="예: 스타벅스 강남점"/>
          </div>

          <!-- 금액 -->
          <div>
            <label class="block text-gray-800 mb-2 text-lg">금액</label>
            <div class="relative">
              <input type="text" name="amount" id="amount" oninput="formatAmount(this)"
                     class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:border-[#F5A5A5] focus:outline-none transition-colors"
                     placeholder="금액 입력"/>
              <span class="absolute right-5 top-1/2 -translate-y-1/2 text-gray-600">원</span>
            </div>
          </div>

          <!-- 날짜 -->
          <div>
            <label class="block text-gray-800 mb-2 text-lg">날짜</label>
            <input type="date" name="date" th:value="${today}"
                   class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:border-[#F5A5A5] focus:outline-none transition-colors"/>
          </div>

          <!-- 카테고리 -->
          <div>
            <label class="block text-gray-800 mb-2 text-lg">카테고리</label>
            <select name="category" class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:border-[#F5A5A5] focus:outline-none transition-colors">
              <option value="">카테고리 선택</option>
              <option value="식비">🍽 식비</option>
              <option value="생활비">🏠 생활비</option>
              <option value="데이트">💕 데이트</option>
              <option value="교통비">🚗 교통비</option>
              <option value="쇼핑">🛍 쇼핑</option>
              <option value="기타">📦 기타</option>
            </select>
          </div>

          <!-- 감정 선택 -->
          <div>
            <label class="block text-gray-800 mb-2 text-lg">감정</label>
            <div class="flex gap-3 flex-wrap">
              <label th:each="emotion : ${emotions}" class="cursor-pointer">
                <input type="radio" name="emotion" th:value="${emotion.emoji}" class="hidden emotion-radio"/>
                <span th:text="${emotion.emoji}" class="text-4xl emotion-btn block p-2 rounded-xl border-2 border-gray-100 hover:border-[#F5A5A5] transition-colors">😊</span>
              </label>
            </div>
          </div>

          <!-- 메모 -->
          <div>
            <label class="block text-gray-800 mb-2 text-lg">메모 (선택)</label>
            <textarea name="memo" rows="3"
                      class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:border-[#F5A5A5] focus:outline-none transition-colors resize-none"
                      placeholder="이 소비에 대한 생각을 자유롭게 적어보세요"></textarea>
          </div>

          <!-- 영수증 이미지 -->
          <div>
            <label class="block text-gray-800 mb-2 text-lg">영수증 사진 (선택)</label>
            <div class="border-2 border-dashed border-gray-200 rounded-2xl p-8 text-center hover:border-[#F5A5A5] transition-colors cursor-pointer"
                 onclick="document.getElementById('receipt').click()">
              <i data-lucide="upload" class="w-10 h-10 text-gray-400 mx-auto mb-2"></i>
              <p class="text-gray-500">클릭하여 사진 업로드</p>
              <p class="text-xs text-gray-400 mt-1">JPG, PNG 형식 지원</p>
            </div>
            <input type="file" id="receipt" name="receipt" accept="image/*" class="hidden" onchange="previewImage(this)"/>
            <img id="receiptPreview" class="hidden mt-4 rounded-xl max-h-48 object-contain" alt="영수증 미리보기"/>
          </div>
        </div>

        <button type="submit" class="w-full mt-8 py-4 bg-[#F5A5A5] text-white rounded-2xl hover:bg-[#F28B8B] transition-colors shadow-md font-medium text-lg">기록 저장하기</button>
      </form>
    </div>
  </main>

  <div th:replace="~{fragments/footer :: footer}"></div>

  <script>
    lucide.createIcons();

    function formatAmount(input) {
      input.value = input.value.replace(/[^0-9]/g, '');
    }

    function previewImage(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = e => {
          const preview = document.getElementById('receiptPreview');
          preview.src = e.target.result;
          preview.classList.remove('hidden');
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    // 감정 선택 토글
    document.querySelectorAll('.emotion-radio').forEach(radio => {
      radio.addEventListener('change', function() {
        document.querySelectorAll('.emotion-btn').forEach(btn => {
          btn.classList.remove('border-[#F5A5A5]', 'bg-[#FCE8E3]');
          btn.classList.add('border-gray-100');
        });
        const btn = this.nextElementSibling;
        btn.classList.add('border-[#F5A5A5]', 'bg-[#FCE8E3]');
        btn.classList.remove('border-gray-100');
      });
    });
  </script>
</body>
</html>
