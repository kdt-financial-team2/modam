<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>소비 상세 - 모담</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen flex flex-col bg-white">
  <div th:replace="~{fragments/header :: nav}"></div>

  <main class="flex-1 w-full max-w-[1440px] mx-auto bg-[#FAFAFA]">
    <div class="max-w-[600px] mx-auto px-8 py-12">
      <a th:href="@{/consumption-history}" class="flex items-center gap-2 text-gray-500 hover:text-gray-700 mb-8 transition-colors">
        <i data-lucide="arrow-left" class="w-5 h-5"></i> 소비기록으로 돌아가기
      </a>

      <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-8">
        <!-- 헤더 -->
        <div class="flex items-start gap-4 mb-8">
          <div class="w-16 h-16 bg-[#FCE8E3] rounded-2xl flex items-center justify-center flex-shrink-0">
            <i th:attr="data-lucide=${record.iconName}" class="w-8 h-8 text-[#F5A5A5]"></i>
          </div>
          <div class="flex-1">
            <h1 class="text-3xl font-bold text-gray-900" th:text="${record.name}">상호명</h1>
            <p class="text-gray-500 mt-1" th:text="${record.date + ' · ' + record.category}">날짜</p>
          </div>
          <div class="text-2xl font-bold text-gray-900">₩<span th:text="${#numbers.formatInteger(record.amount, 0, 'COMMA')}">0</span></div>
        </div>

        <!-- 감정 -->
        <div th:if="${record.emotion}" class="text-center py-6 bg-[#FFF7F5] rounded-2xl mb-6">
          <span class="text-6xl" th:text="${record.emotion}">😊</span>
          <p class="text-gray-600 mt-2">이 소비의 감정</p>
        </div>

        <!-- 메모 -->
        <div th:if="${record.memo}" class="bg-gray-50 rounded-2xl p-6 mb-6">
          <h3 class="text-sm font-medium text-gray-500 mb-2">메모</h3>
          <p class="text-gray-800" th:text="${record.memo}">메모 내용</p>
        </div>

        <!-- 영수증 이미지 -->
        <div th:if="${record.receiptImageUrl}" class="mb-6">
          <h3 class="text-sm font-medium text-gray-500 mb-2">영수증</h3>
          <img th:src="${record.receiptImageUrl}" alt="영수증" class="rounded-xl max-w-full"/>
        </div>

        <!-- 포인트 적립 -->
        <div th:if="${record.pointsEarned > 0}" class="bg-gradient-to-r from-[#FCE8E3] to-[#FFE4E8] rounded-2xl p-5 mb-6">
          <div class="flex items-center gap-3">
            <i data-lucide="gift" class="w-6 h-6 text-[#F5A5A5]"></i>
            <div>
              <p class="font-semibold text-gray-800">포인트 적립</p>
              <p class="text-sm text-gray-600">+<span th:text="${record.pointsEarned}">0</span>P 적립</p>
            </div>
          </div>
        </div>

        <!-- 버튼 -->
        <div class="flex gap-4">
          <form th:action="@{/consumption-detail/{id}/delete(id=${record.id})}" method="post" class="flex-1">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" onclick="return confirm('정말 삭제하시겠습니까?')"
                    class="w-full py-4 bg-red-50 text-red-500 rounded-2xl hover:bg-red-100 transition-colors font-medium">삭제</button>
          </form>
          <a th:href="@{/consumption-history}" class="flex-1 py-4 bg-[#FCE8E3] text-gray-800 rounded-2xl hover:bg-[#FBD5CE] transition-colors font-medium text-center">목록으로</a>
        </div>
      </div>
    </div>
  </main>

  <div th:replace="~{fragments/footer :: footer}"></div>
  <script>lucide.createIcons();</script>
</body>
</html>
