<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>소비기록 - 모담</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen flex flex-col bg-white">
  <div th:replace="~{common/layout/header :: nav}"></div>

  <main class="flex-1 w-full max-w-[1440px] mx-auto bg-gray-50">
    <div class="px-8 py-12">
      <div class="flex items-center justify-between mb-10">
        <div>
          <h1 class="text-4xl font-bold text-gray-900 mb-3">소비기록</h1>
          <p class="text-gray-600 text-lg">감정과 함께 소비를 기록해보세요</p>
        </div>
        <a th:href="@{/consumption-upload}" class="flex items-center gap-2 px-6 py-4 bg-[#F5A5A5] text-white rounded-xl hover:bg-[#F28B8B] transition-colors shadow-sm font-medium">
          <i data-lucide="plus" class="w-5 h-5"></i> 새 소비 기록
        </a>
      </div>

      <!-- 소비 기록 목록 -->
      <div class="grid grid-cols-2 gap-6">
        <div th:each="record : ${consumptionRecords}"
             th:onclick="'window.location.href=\'' + @{/consumption-detail/{id}(id=${record.id})} + '\''"
             class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 cursor-pointer hover:shadow-md hover:border-[#FCE8E3] transition-all">
          <div class="flex items-start gap-4">
            <div class="w-14 h-14 bg-[#FCE8E3] rounded-2xl flex items-center justify-center flex-shrink-0">
              <i th:attr="data-lucide=${record.iconName}" class="w-7 h-7 text-[#F5A5A5]"></i>
            </div>
            <div class="flex-1">
              <div class="flex items-start justify-between mb-2">
                <h3 class="text-lg font-semibold text-gray-900" th:text="${record.name}">상호명</h3>
                <span class="text-lg font-bold text-gray-900">₩<span th:text="${#numbers.formatInteger(record.amount, 0, 'COMMA')}">0</span></span>
              </div>
              <p class="text-sm text-gray-500 mb-3" th:text="${record.date + ' · ' + record.category}">날짜</p>
              <div th:if="${record.memo}" class="bg-[#FFF7F5] rounded-xl p-3">
                <p class="text-sm text-gray-700" th:text="${record.memo}">메모</p>
              </div>
              <div th:if="${record.emotion}" class="mt-2">
                <span class="text-2xl" th:text="${record.emotion}">😊</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div th:if="${#lists.isEmpty(consumptionRecords)}" class="text-center py-20">
        <div class="w-20 h-20 bg-[#FCE8E3] rounded-full flex items-center justify-center mx-auto mb-4">
          <i data-lucide="book-open" class="w-10 h-10 text-[#F5A5A5]"></i>
        </div>
        <p class="text-xl text-gray-600 mb-4">아직 소비 기록이 없습니다</p>
        <a th:href="@{/consumption-upload}" class="inline-flex items-center gap-2 px-6 py-3 bg-[#F5A5A5] text-white rounded-xl hover:bg-[#F28B8B] transition-colors">
          첫 번째 소비 기록하기
        </a>
      </div>
    </div>
  </main>

  <div th:replace="~{common/layout/footer :: footer}"></div>
  <script>lucide.createIcons();</script>
</body>
</html>
