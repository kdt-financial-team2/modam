<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>카드 신청 - 카드 선택 - 모담</title>
  <script src="https://cdn.tailwindcss.com"><\/script>
  <script src="https://unpkg.com/lucide@latest"><\/script>
</head>
<body class="min-h-screen flex flex-col bg-white">
  <div th:replace="~{fragments/header :: nav}"></div>

  <main class="flex-1 w-full max-w-[1440px] mx-auto bg-[#FAFAFA]">
    <div class="max-w-[700px] mx-auto px-8 py-12">

      <!-- 스텝 인디케이터 -->
      <div class="flex items-center justify-center gap-2 mb-10">
        <div th:each="step,stat : ${#numbers.sequence(1,8)}" class="flex items-center">
          <div th:classappend="${step < 3} ? 'bg-[#F5A5A5] text-white' : (${step == 3} ? 'bg-[#FCE8E3] text-gray-800 ring-4 ring-[#FCE8E3]/30' : 'bg-gray-200 text-gray-400')"
               class="w-8 h-8 rounded-full flex items-center justify-center text-sm font-medium transition-all">
            <i th:if="${step < 3}" data-lucide="check" class="w-4 h-4"></i>
            <span th:unless="${step < 3}" th:text="${step}">1</span>
          </div>
          <div th:unless="${stat.last}"
               th:classappend="${step < 3} ? 'bg-[#F5A5A5]' : 'bg-gray-200'"
               class="h-0.5 w-8 transition-all"></div>
        </div>
      </div>

      <div class="bg-white rounded-3xl shadow-sm p-10">
        <h1 class="text-3xl text-gray-800 mb-3">카드 신청 - 카드 선택</h1>
        <p class="text-gray-600 mb-8">단계 3 / 8</p>

        <form th:action="@{/card-step3}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

          <!-- TODO: 실제 step 3 에 맞는 폼 필드를 여기에 추가하세요 -->
          <!-- 각 컨트롤러에서 model에 필요한 데이터를 담아 넘겨주세요 -->

          <div class="bg-[#FCE8E3] rounded-2xl p-6 mb-8">
            <p class="text-gray-700 text-center">Step 3 콘텐츠를 여기에 구현하세요</p>
          </div>

          <div class="flex gap-4">
            <a th:href="@{/card-step2}" class="flex-1 py-4 bg-gray-100 text-gray-700 rounded-2xl hover:bg-gray-200 transition-colors flex items-center justify-center gap-2 font-medium">
              <i data-lucide="chevron-left" class="w-5 h-5"></i> 이전</a>
            <button type="submit" class="flex-1 py-4 bg-[#F5A5A5] text-white rounded-2xl hover:bg-[#F28B8B] transition-colors flex items-center justify-center gap-2 font-medium">
              다음 <i data-lucide="chevron-right" class="w-5 h-5"></i></button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <div th:replace="~{fragments/footer :: footer}"></div>
  <script>lucide.createIcons();<\/script>
</body>
</html>
