<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>송금 실패 - 모담</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-[#FAFAFA] flex flex-col">

<th:block th:replace="~{common/layout/header :: nav}"></th:block>

<main class="flex-1">
  <div class="max-w-[800px] mx-auto px-8 py-12">

    <div class="text-center mb-12">
      <div class="w-24 h-24 bg-gradient-to-br from-red-400 to-red-500 rounded-full flex items-center justify-center mx-auto mb-6 shadow-lg">
        <i data-lucide="x-circle" class="w-14 h-14 text-white"></i>
      </div>
      <h1 class="text-4xl text-gray-800 mb-3">송금 실패</h1>
      <p class="text-gray-600 text-lg">송금 처리 중 문제가 발생했습니다</p>
    </div>

    <div class="bg-red-50 border-2 border-red-200 rounded-3xl p-8 mb-6">
      <div class="flex items-start gap-4">
        <div class="w-12 h-12 bg-red-500 rounded-full flex items-center justify-center flex-shrink-0">
          <span class="text-white text-2xl font-bold">!</span>
        </div>
        <div>
          <h2 class="text-xl text-gray-800 mb-2">실패 사유</h2>
          <p class="text-gray-700 text-lg" th:text="${failedTransfer.reason}">잔액이 부족합니다</p>
        </div>
      </div>
    </div>

    <div class="bg-white rounded-3xl shadow-sm p-10 mb-6">
      <h2 class="text-2xl text-gray-800 mb-6">송금 시도 내역</h2>

      <div class="space-y-5">
        <div class="bg-gray-100 rounded-2xl p-6 text-center border-2 border-gray-300">
          <p class="text-sm text-gray-600 mb-2">송금 시도 금액</p>
          <p class="text-4xl text-gray-800">
            ₩<span th:text="${#numbers.formatInteger(transfer.amount, 0, 'COMMA')}">2,000,000</span>
          </p>
        </div>

        <!-- 목표 저축 입금 -->
        <div th:if="${transfer.transferType == 'savings'}"
             class="flex items-center justify-between p-5 bg-[#FAFAFA] rounded-2xl">
          <span class="text-gray-600">저축 목표</span>
          <span class="text-gray-800 text-lg" th:text="${transfer.goalName}">목표명</span>
        </div>

        <!-- 외부 계좌 이체 -->
        <th:block th:unless="${transfer.transferType == 'savings'}">
          <div class="flex items-center justify-between p-5 bg-[#FAFAFA] rounded-2xl">
            <span class="text-gray-600">은행</span>
            <span class="text-gray-800 text-lg" th:text="${transfer.bankName}">국민은행</span>
          </div>
          <div class="flex items-center justify-between p-5 bg-[#FAFAFA] rounded-2xl">
            <span class="text-gray-600">계좌번호</span>
            <span class="text-gray-800 text-lg" th:text="${transfer.accountNumber}">110-1234-5678</span>
          </div>
        </th:block>

        <div class="flex items-center justify-between p-5 bg-[#FAFAFA] rounded-2xl">
          <span class="text-gray-600">시도 일시</span>
          <span class="text-gray-800 text-lg"
                th:text="${#temporals.format(transfer.transferredAt, 'yyyy.MM.dd HH:mm')}">2026.05.22 14:30</span>
        </div>

        <div class="border-t border-gray-200 my-6"></div>

        <div class="flex items-center justify-between p-5 bg-[#F0F9FF] border border-[#BAE6FD] rounded-2xl">
          <span class="text-gray-700">내 잔액</span>
          <span class="text-gray-800 text-2xl">
              ₩<span th:text="${#numbers.formatInteger(failedTransfer.currentBalance, 0, 'COMMA')}">1,245,000</span>
            </span>
        </div>
      </div>
    </div>

    <div class="flex gap-4">
      <a th:href="@{/dashboard}" href="/dashboard"
         class="flex-1 py-4 bg-white border-2 border-gray-300 text-gray-700 rounded-2xl hover:bg-gray-50 transition-colors flex items-center justify-center gap-2">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
        <span>홈으로</span>
      </a>
      <a th:href="@{/transfer}" href="/transfer"
         class="flex-1 py-4 bg-[#F5A5A5] text-white rounded-2xl hover:bg-[#F28B8B] transition-colors shadow-md flex items-center justify-center">
        다시 시도하기
      </a>
    </div>

  </div>
</main>

<th:block th:replace="~{common/layout/footer :: footer}"></th:block>

<script>
  lucide.createIcons();
</script>
<th:block th:replace="~{common/layout/header :: scripts}"></th:block>
</body>
</html>
