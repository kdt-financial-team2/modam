<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>구매 확인 - 모담</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen flex flex-col bg-white">
  <div th:replace="~{common/layout/header :: nav}"></div>

  <main class="flex-1 w-full max-w-[1440px] mx-auto bg-[#FAFAFA]">
    <div class="max-w-[600px] mx-auto px-8 py-12">
      <h1 class="text-3xl font-bold text-gray-900 mb-8">구매 확인</h1>

      <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-8 mb-6">
        <div class="flex items-center gap-4 mb-6 pb-6 border-b border-gray-100">
          <div class="w-16 h-16 bg-[#FCE8E3] rounded-2xl flex items-center justify-center">
            <i data-lucide="gift" class="w-8 h-8 text-[#F5A5A5]"></i>
          </div>
          <div>
            <h2 class="text-xl font-bold text-gray-900" th:text="${product.name}">상품명</h2>
            <p class="text-gray-500" th:text="${product.category}">카테고리</p>
          </div>
        </div>

        <div class="space-y-3 mb-6">
          <div class="flex justify-between">
            <span class="text-gray-500">상품 금액</span>
            <span class="font-medium text-gray-900"><span th:text="${#numbers.formatInteger(product.pointCost, 0, 'COMMA')}">0</span>P</span>
          </div>
          <div class="flex justify-between">
            <span class="text-gray-500">보유 포인트</span>
            <span class="font-medium text-gray-900"><span th:text="${#numbers.formatInteger(couplePoints, 0, 'COMMA')}">0</span>P</span>
          </div>
          <div class="flex justify-between border-t pt-3">
            <span class="text-gray-900 font-medium">구매 후 잔액</span>
            <span class="text-lg font-bold text-[#F5A5A5]"><span th:text="${#numbers.formatInteger(couplePoints - product.pointCost, 0, 'COMMA')}">0</span>P</span>
          </div>
        </div>

        <form th:action="@{/point-shop/purchase/{id}(id=${product.id})}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit" class="w-full py-4 bg-[#F5A5A5] text-white rounded-2xl hover:bg-[#F28B8B] transition-colors font-medium text-lg">구매 완료</button>
        </form>
      </div>

      <a th:href="@{/point-shop/product/{id}(id=${product.id})}" class="block w-full py-4 bg-gray-100 text-gray-700 rounded-2xl hover:bg-gray-200 transition-colors font-medium text-center">취소</a>
    </div>
  </main>

  <div th:replace="~{common/layout/footer :: footer}"></div>
  <script>lucide.createIcons();</script>
</body>
</html>
