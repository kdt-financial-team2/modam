<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${product.name + ' - 모담'}">상품 상세 - 모담</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen flex flex-col bg-white">
  <div th:replace="~{fragments/header :: nav}"></div>

  <main class="flex-1 w-full max-w-[1440px] mx-auto bg-[#FAFAFA]">
    <div class="max-w-[700px] mx-auto px-8 py-12">
      <a th:href="@{/point-shop}" class="flex items-center gap-2 text-gray-500 hover:text-gray-700 mb-8 transition-colors">
        <i data-lucide="arrow-left" class="w-5 h-5"></i> 포인트샵으로 돌아가기
      </a>

      <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden">
        <!-- 상품 이미지 -->
        <div class="aspect-video bg-gray-50 flex items-center justify-center">
          <img th:if="${product.imageUrl}" th:src="${product.imageUrl}" th:alt="${product.name}" class="w-full h-full object-cover"/>
          <i th:unless="${product.imageUrl}" data-lucide="gift" class="w-24 h-24 text-gray-300"></i>
        </div>

        <div class="p-8">
          <span class="text-sm text-[#F5A5A5] font-medium bg-[#FCE8E3] px-3 py-1 rounded-full" th:text="${product.category}">카테고리</span>
          <h1 class="text-3xl font-bold text-gray-900 mt-4 mb-2" th:text="${product.name}">상품명</h1>
          <p class="text-gray-600 mb-6" th:text="${product.description}">상품 설명</p>

          <div class="bg-[#FCE8E3] rounded-2xl p-6 mb-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-sm text-gray-600">필요 포인트</p>
                <p class="text-4xl font-bold text-[#F5A5A5]"><span th:text="${#numbers.formatInteger(product.pointCost, 0, 'COMMA')}">0</span>P</p>
              </div>
              <div class="text-right">
                <p class="text-sm text-gray-600">보유 포인트</p>
                <p class="text-2xl font-bold text-gray-900"><span th:text="${#numbers.formatInteger(couplePoints, 0, 'COMMA')}">0</span>P</p>
              </div>
            </div>
          </div>

          <div th:if="${couplePoints >= product.pointCost}">
            <a th:href="@{/point-shop/purchase/{id}(id=${product.id})}"
               class="block w-full py-4 bg-[#F5A5A5] text-white rounded-2xl hover:bg-[#F28B8B] transition-colors font-medium text-center text-lg">
              구매하기
            </a>
          </div>
          <div th:unless="${couplePoints >= product.pointCost}">
            <button disabled class="w-full py-4 bg-gray-200 text-gray-400 rounded-2xl cursor-not-allowed font-medium text-lg">
              포인트 부족 (
              <span th:text="${#numbers.formatInteger(product.pointCost - couplePoints, 0, 'COMMA')}">0</span>P 필요)
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div th:replace="~{fragments/footer :: footer}"></div>
  <script>lucide.createIcons();</script>
</body>
</html>
