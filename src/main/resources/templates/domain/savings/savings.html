<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>저축 목표 - 모담</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen flex flex-col bg-white">
  <div th:replace="~{common/layout/header :: nav}"></div>

  <main class="flex-1 w-full max-w-[1440px] mx-auto bg-gray-50">
    <div class="px-8 py-12">

      <!-- 헤더 -->
      <div class="flex items-center justify-between mb-12">
        <div>
          <h1 class="text-4xl font-bold text-gray-900 mb-3">💕 저축 목표</h1>
          <p class="text-gray-600 text-lg"><span th:text="${userName}">사용자</span>님의 저축 목표를 관리하세요</p>
        </div>
        <a th:href="@{/savings-goal-setup}" class="flex items-center gap-2 px-6 py-4 bg-[#F5A5A5] text-white rounded-xl hover:bg-[#F28B8B] transition-colors shadow-sm font-medium">
          <i data-lucide="plus" class="w-5 h-5"></i>
          <span>새 저축 목표</span>
        </a>
      </div>

      <!-- 연결 계좌 정보 -->
      <div class="bg-gradient-to-r from-[#FCE8E3] to-[#FFE4E8] rounded-3xl border border-gray-100 shadow-sm p-8 mb-8">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-4">
            <div class="w-16 h-16 bg-white rounded-2xl flex items-center justify-center shadow-sm">
              <i data-lucide="credit-card" class="w-8 h-8 text-[#F5A5A5]"></i>
            </div>
            <div>
              <p class="text-sm text-gray-600 mb-1 font-medium">연결된 계좌</p>
              <p class="text-xl font-semibold text-gray-900" th:text="${linkedBank + ' ' + linkedAccount}">국민은행 계좌번호</p>
            </div>
          </div>
          <div class="text-right">
            <p class="text-sm text-gray-600 mb-1 font-medium">계좌 잔액</p>
            <p class="text-2xl font-bold text-gray-900">₩<span th:text="${#numbers.formatInteger(accountBalance, 0, 'COMMA')}">0</span></p>
          </div>
        </div>
        <div class="mt-4 bg-white/60 backdrop-blur rounded-xl p-4">
          <p class="text-sm text-gray-700">💡 이 계좌에서 설정한 주기에 따라 자동으로 저축 목표로 이체됩니다</p>
        </div>
      </div>

      <!-- 저축 목표 그리드 -->
      <div class="grid grid-cols-3 gap-6">
        <div th:each="goal : ${savingsGoals}" class="bg-white rounded-3xl shadow-sm p-6 relative overflow-hidden">

          <!-- 완료 배지 -->
          <div th:if="${goal.progress >= 100}" class="absolute top-4 right-4 bg-gradient-to-r from-yellow-400 to-orange-400 text-white px-4 py-2 rounded-full flex items-center gap-2 shadow-lg">
            <i data-lucide="trophy" class="w-4 h-4"></i>
            <span class="text-sm">완료!</span>
          </div>

          <!-- 목표 헤더 -->
          <div class="flex items-start gap-3 mb-4">
            <div class="w-12 h-12 bg-[#FCE8E3] rounded-2xl flex items-center justify-center flex-shrink-0">
              <i th:attr="data-lucide=${goal.iconName}" class="w-6 h-6 text-[#F5A5A5]"></i>
            </div>
            <div class="flex-1">
              <h3 class="text-lg text-gray-800 mb-1" th:text="${goal.name}">목표 이름</h3>
              <span class="text-sm text-gray-500 bg-gray-100 px-3 py-1 rounded-full" th:text="${goal.typeLabel}">유형</span>
            </div>
          </div>

          <!-- 진행 현황 -->
          <div class="mb-6">
            <div class="flex items-center justify-between mb-2">
              <span class="text-2xl text-[#F5A5A5]">₩<span th:text="${#numbers.formatInteger(goal.current, 0, 'COMMA')}">0</span></span>
              <span class="text-lg text-gray-600"><span th:text="${goal.progress}">0</span>%</span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-3 mb-2">
              <div class="bg-gradient-to-r from-[#F5A5A5] to-[#FCE8E3] h-3 rounded-full transition-all duration-500"
                   th:style="'width: ' + ${goal.progress > 100 ? 100 : goal.progress} + '%'"></div>
            </div>
            <div class="flex items-center justify-between text-sm text-gray-600">
              <span>목표: ₩<span th:text="${#numbers.formatInteger(goal.target, 0, 'COMMA')}">0</span></span>
              <span th:unless="${goal.progress >= 100}">₩<span th:text="${#numbers.formatInteger(goal.remaining, 0, 'COMMA')}">0</span> 남음</span>
            </div>
          </div>

          <!-- 자동 이체 -->
          <div class="border-t border-gray-200 pt-4">
            <div class="flex items-center justify-between mb-3">
              <span class="text-sm text-gray-700">자동 이체</span>
              <form th:action="@{/savings/toggle-auto-transfer}" method="post" class="inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="goalId" th:value="${goal.id}"/>
                <button type="submit"
                        th:classappend="${goal.autoTransferEnabled} ? 'bg-[#F5A5A5]' : 'bg-gray-300'"
                        class="relative w-12 h-6 rounded-full transition-colors">
                  <div th:classappend="${goal.autoTransferEnabled} ? 'translate-x-6' : 'translate-x-0'"
                       class="absolute top-1 left-1 w-4 h-4 bg-white rounded-full transition-transform"></div>
                </button>
              </form>
            </div>

            <div th:if="${goal.autoTransferEnabled}" class="bg-[#F0F9FF] rounded-xl p-3 space-y-2 text-sm">
              <div class="flex items-center justify-between">
                <span class="text-gray-600">이체 금액</span>
                <span class="text-gray-800">₩<span th:text="${#numbers.formatInteger(goal.autoTransferAmount, 0, 'COMMA')}">0</span></span>
              </div>
              <div class="flex items-center justify-between">
                <span class="text-gray-600">주기</span>
                <span class="text-gray-800" th:text="${goal.autoTransferFrequencyLabel}">매월</span>
              </div>
              <div class="flex items-center justify-between">
                <span class="text-gray-600">다음 이체</span>
                <span class="text-gray-800" th:text="${goal.autoTransferNextDate}">날짜</span>
              </div>
            </div>

            <div th:unless="${goal.autoTransferEnabled}">
              <a th:href="@{/savings/auto-transfer/{id}(id=${goal.id})}" class="block w-full mt-2 py-2 bg-[#FCE8E3] text-gray-700 rounded-lg hover:bg-[#FBD5CE] transition-colors text-sm text-center">자동 이체 설정하기</a>
            </div>
          </div>

          <!-- 날짜 정보 -->
          <div class="flex items-center gap-2 text-xs text-gray-500 mt-4">
            <i data-lucide="calendar" class="w-4 h-4"></i>
            <span th:text="${goal.startDate + ' ~ ' + goal.targetDate}">기간</span>
          </div>
        </div>
      </div>

      <!-- 목표가 없을 때 -->
      <div th:if="${#lists.isEmpty(savingsGoals)}" class="text-center py-20">
        <div class="w-20 h-20 bg-[#FCE8E3] rounded-full flex items-center justify-center mx-auto mb-4">
          <i data-lucide="piggy-bank" class="w-10 h-10 text-[#F5A5A5]"></i>
        </div>
        <p class="text-xl text-gray-600 mb-4">아직 저축 목표가 없습니다</p>
        <a th:href="@{/savings-goal-setup}" class="inline-flex items-center gap-2 px-6 py-3 bg-[#F5A5A5] text-white rounded-xl hover:bg-[#F28B8B] transition-colors">
          <i data-lucide="plus" class="w-5 h-5"></i> 첫 번째 저축 목표 만들기
        </a>
      </div>

    </div>
  </main>

  <div th:replace="~{common/layout/footer :: footer}"></div>
  <script>lucide.createIcons();</script>
</body>
</html>
