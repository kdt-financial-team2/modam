<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>저축 목표 설정 - 모담</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen flex flex-col bg-white">
  <div th:replace="~{fragments/header :: nav}"></div>

  <main class="flex-1 w-full max-w-[1440px] mx-auto bg-[#FAFAFA]">
    <div class="max-w-[700px] mx-auto px-8 py-12">
      <div class="mb-8">
        <h1 class="text-3xl text-gray-800">💕 새 저축 목표 만들기</h1>
        <p class="text-gray-600 mt-2">함께 이루고 싶은 목표를 설정해보세요</p>
      </div>

      <form th:action="@{/savings-goal-setup}" method="post" class="bg-white rounded-3xl shadow-sm p-10">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <!-- 연결 계좌 정보 -->
        <div class="bg-gradient-to-r from-[#FCE8E3] to-[#FFE4E8] rounded-xl p-5 mb-6">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
              <i data-lucide="credit-card" class="w-6 h-6 text-[#F5A5A5]"></i>
              <div>
                <p class="text-sm text-gray-600">연결된 계좌</p>
                <p class="text-lg text-gray-800" th:text="${linkedBank + ' ' + linkedAccount}">계좌 정보</p>
              </div>
            </div>
            <div class="text-right">
              <p class="text-sm text-gray-600">잔액</p>
              <p class="text-xl text-gray-800">₩<span th:text="${#numbers.formatInteger(accountBalance, 0, 'COMMA')}">0</span></p>
            </div>
          </div>
        </div>

        <div class="space-y-6">
          <!-- 목표 이름 -->
          <div>
            <label class="block text-gray-700 mb-2">목표 이름</label>
            <input type="text" name="goalName" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-[#FCE8E3] focus:outline-none transition-colors" placeholder="예: 제주도 여행, 결혼 자금"/>
          </div>

          <!-- 저축 유형 -->
          <div>
            <label class="block text-gray-700 mb-2">저축 유형</label>
            <div class="grid grid-cols-5 gap-2" id="goalTypeGroup">
              <button type="button" data-value="free" onclick="selectGoalType(this)"
                      class="goal-type-btn flex flex-col items-center gap-2 p-3 rounded-xl border-2 border-gray-200 transition-colors hover:border-gray-300">
                <i data-lucide="sparkles" class="w-5 h-5 text-gray-700"></i>
                <span class="text-xs text-gray-700">자유</span>
              </button>
              <button type="button" data-value="goal" onclick="selectGoalType(this)"
                      class="goal-type-btn flex flex-col items-center gap-2 p-3 rounded-xl border-2 border-[#F5A5A5] bg-[#FCE8E3] transition-colors">
                <i data-lucide="piggy-bank" class="w-5 h-5 text-gray-700"></i>
                <span class="text-xs text-gray-700">목표</span>
              </button>
              <button type="button" data-value="travel" onclick="selectGoalType(this)"
                      class="goal-type-btn flex flex-col items-center gap-2 p-3 rounded-xl border-2 border-gray-200 transition-colors hover:border-gray-300">
                <i data-lucide="plane" class="w-5 h-5 text-gray-700"></i>
                <span class="text-xs text-gray-700">여행</span>
              </button>
              <button type="button" data-value="gift" onclick="selectGoalType(this)"
                      class="goal-type-btn flex flex-col items-center gap-2 p-3 rounded-xl border-2 border-gray-200 transition-colors hover:border-gray-300">
                <i data-lucide="gift" class="w-5 h-5 text-gray-700"></i>
                <span class="text-xs text-gray-700">선물</span>
              </button>
              <button type="button" data-value="automatic" onclick="selectGoalType(this)"
                      class="goal-type-btn flex flex-col items-center gap-2 p-3 rounded-xl border-2 border-gray-200 transition-colors hover:border-gray-300">
                <i data-lucide="zap" class="w-5 h-5 text-gray-700"></i>
                <span class="text-xs text-gray-700">자동</span>
              </button>
            </div>
            <input type="hidden" name="goalType" id="goalTypeInput" value="goal"/>
          </div>

          <!-- 목표 금액 & 날짜 -->
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-gray-700 mb-2">목표 금액</label>
              <div class="relative">
                <input type="text" name="targetAmount" oninput="formatNumber(this)"
                       class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-[#FCE8E3] focus:outline-none transition-colors pr-10"
                       placeholder="10,000,000"/>
                <span class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500">원</span>
              </div>
            </div>
            <div>
              <label class="block text-gray-700 mb-2">목표 날짜</label>
              <input type="date" name="targetDate" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-[#FCE8E3] focus:outline-none transition-colors"/>
            </div>
          </div>

          <!-- 자동 이체 설정 -->
          <div class="border-t border-gray-200 pt-5">
            <div class="flex items-center justify-between mb-4">
              <label class="text-gray-700">⚡ 자동 이체 설정</label>
              <button type="button" onclick="toggleAutoTransfer()" id="autoTransferToggle"
                      class="relative w-14 h-7 rounded-full bg-[#F5A5A5] transition-colors">
                <div id="autoTransferDot" class="absolute top-1 left-1 w-5 h-5 bg-white rounded-full transition-transform translate-x-7"></div>
              </button>
            </div>
            <input type="hidden" name="autoTransferEnabled" id="autoTransferEnabled" value="true"/>

            <div id="autoTransferSection" class="space-y-4">
              <div>
                <label class="block text-sm text-gray-600 mb-2">이체 금액</label>
                <div class="relative">
                  <input type="text" name="autoAmount" oninput="formatNumber(this)"
                         class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-[#FCE8E3] focus:outline-none transition-colors pr-10"
                         placeholder="최소 1,000원"/>
                  <span class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500">원</span>
                </div>
              </div>

              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label class="block text-sm text-gray-600 mb-2">이체 주기</label>
                  <div class="grid grid-cols-3 gap-2">
                    <button type="button" data-value="daily" onclick="selectFrequency(this)"
                            class="freq-btn py-2.5 rounded-xl border-2 border-gray-200 text-gray-600 text-sm hover:border-gray-300 transition-colors">매일</button>
                    <button type="button" data-value="weekly" onclick="selectFrequency(this)"
                            class="freq-btn py-2.5 rounded-xl border-2 border-gray-200 text-gray-600 text-sm hover:border-gray-300 transition-colors">매주</button>
                    <button type="button" data-value="monthly" onclick="selectFrequency(this)"
                            class="freq-btn py-2.5 rounded-xl border-2 border-[#F5A5A5] bg-[#FCE8E3] text-gray-800 text-sm transition-colors">매월</button>
                  </div>
                  <input type="hidden" name="autoFrequency" id="autoFrequencyInput" value="monthly"/>
                </div>

                <div>
                  <label class="block text-sm text-gray-600 mb-2">시작 날짜</label>
                  <input type="date" name="autoStartDate" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-[#FCE8E3] focus:outline-none transition-colors"/>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="flex gap-4 mt-8">
          <a th:href="@{/savings}" class="flex-1 py-3.5 bg-gray-100 text-gray-700 rounded-xl hover:bg-gray-200 transition-colors text-center font-medium">취소</a>
          <button type="submit" class="flex-1 py-3.5 bg-[#F5A5A5] text-white rounded-xl hover:bg-[#F28B8B] transition-colors font-medium">목표 만들기</button>
        </div>
      </form>
    </div>
  </main>

  <div th:replace="~{fragments/footer :: footer}"></div>

  <script>
    lucide.createIcons();

    function selectGoalType(btn) {
      document.querySelectorAll('.goal-type-btn').forEach(b => {
        b.classList.remove('border-[#F5A5A5]', 'bg-[#FCE8E3]');
        b.classList.add('border-gray-200');
      });
      btn.classList.add('border-[#F5A5A5]', 'bg-[#FCE8E3]');
      btn.classList.remove('border-gray-200');
      document.getElementById('goalTypeInput').value = btn.dataset.value;
    }

    function selectFrequency(btn) {
      document.querySelectorAll('.freq-btn').forEach(b => {
        b.classList.remove('border-[#F5A5A5]', 'bg-[#FCE8E3]');
        b.classList.add('border-gray-200', 'text-gray-600');
      });
      btn.classList.add('border-[#F5A5A5]', 'bg-[#FCE8E3]', 'text-gray-800');
      btn.classList.remove('border-gray-200', 'text-gray-600');
      document.getElementById('autoFrequencyInput').value = btn.dataset.value;
    }

    let autoEnabled = true;
    function toggleAutoTransfer() {
      autoEnabled = !autoEnabled;
      const toggle = document.getElementById('autoTransferToggle');
      const dot = document.getElementById('autoTransferDot');
      const section = document.getElementById('autoTransferSection');
      const input = document.getElementById('autoTransferEnabled');
      toggle.className = 'relative w-14 h-7 rounded-full transition-colors ' + (autoEnabled ? 'bg-[#F5A5A5]' : 'bg-gray-300');
      dot.style.transform = autoEnabled ? 'translateX(1.75rem)' : 'translateX(0)';
      section.classList.toggle('hidden', !autoEnabled);
      input.value = autoEnabled;
    }

    function formatNumber(input) {
      const raw = input.value.replace(/[^0-9]/g, '');
      if (raw) input.value = parseInt(raw).toLocaleString();
      else input.value = '';
    }
  </script>
</body>
</html>
