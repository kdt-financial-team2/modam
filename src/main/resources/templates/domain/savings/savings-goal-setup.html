<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>저축 목표 설정 - 모담</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-[#FAFAFA] flex flex-col">

<th:block th:replace="~{common/layout/header :: nav}"></th:block>

<div class="px-8 py-6 border-b border-gray-200 bg-white">
  <div class="w-full max-w-[1440px] mx-auto">
    <h1 class="text-2xl text-gray-800">💕 우리 둘만의 저축 목표</h1>
    <p class="text-gray-600 mt-2">함께 꿈꾸는 미래를 위해 차곡차곡 모아봐요</p>
  </div>
</div>

<main class="flex-1">
  <form th:action="@{/savings-goal-setup}" action="/savings-goal-setup" method="post"
        id="setupForm" onsubmit="return handleSubmit(event)">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <input type="hidden" name="accountId" th:value="${accountId}"/>
    <input type="hidden" name="isAuto" value="Y"/>
    <input type="hidden" name="autoCycle" value="MONTHLY"/>
    <input type="hidden" name="autoAmount" id="hiddenAutoAmount" value="0"/>
    <input type="hidden" name="partnerContribution" value="0"/>

    <div class="w-full max-w-[1440px] mx-auto px-8 py-8">
      <div class="grid grid-cols-10 gap-6">

        <div class="col-span-7 space-y-6">

          <div class="bg-white rounded-3xl shadow-sm p-8">
            <h2 class="text-xl text-gray-800 mb-6">목표 저축 설정 내용</h2>

            <div class="space-y-6">

              <div>
                <label class="block text-gray-700 mb-2">저축 유형</label>
                <div class="relative">
                  <select name="saveType" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-[#FCE8E3] focus:outline-none transition-colors appearance-none bg-white">
                    <option value="travel">✈️ 여행</option>
                    <option value="gift">🎁 선물</option>
                    <option value="free">✨ 자유</option>
                    <option value="automatic">⚡ 자동저축</option>
                  </select>
                  <i data-lucide="chevron-down" class="absolute right-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400 pointer-events-none"></i>
                </div>
              </div>

              <div>
                <label class="block text-gray-700 mb-2">목표 이름</label>
                <input type="text" id="goalName" name="goalName"
                       oninput="updateSummary()"
                       placeholder="예: 제주도 여행, 결혼 자금"
                       class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-[#FCE8E3] focus:outline-none transition-colors">
              </div>

              <div>
                <label class="block text-gray-700 mb-2">목표 금액</label>
                <div class="relative">
                  <input type="text" id="targetAmountDisplay"
                         oninput="handleTargetAmount(this)"
                         placeholder="10,000,000"
                         class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-[#FCE8E3] focus:outline-none transition-colors pr-12 text-gray-800 font-semibold">
                  <input type="hidden" id="targetAmount" name="targetAmount">
                  <span class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500">원</span>
                </div>
              </div>

              <div>
                <label class="block text-gray-700 mb-2">목표 날짜</label>
                <div class="relative">
                  <input type="date" id="targetDate" name="targetDate"
                         oninput="updateSummary()"
                         class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-[#FCE8E3] focus:outline-none transition-colors">
                  <i data-lucide="calendar" class="absolute right-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400 pointer-events-none"></i>
                </div>
              </div>
            </div>
          </div>

          <div class="bg-white rounded-3xl shadow-sm p-8">
            <div class="flex items-center justify-between mb-6">
              <h2 class="text-xl text-gray-800">개인 저축 금액 설정</h2>
              <span class="text-xs font-medium bg-gray-100 text-gray-500 px-3 py-1 rounded-full">모임 통장으로 입금할 금액</span>
            </div>

            <div class="space-y-8"> <div>
              <div class="flex items-center gap-4">
                <div class="w-32">
                  <label class="block text-sm text-gray-600 mb-2">참여자</label>
                  <div class="px-4 py-3 bg-[#F0F9FF] border border-[#BAE6FD] rounded-xl text-gray-800 font-medium text-center"
                       th:text="${userName}">김민수</div>
                </div>
                <div class="flex-1">
                  <label class="block text-sm text-gray-600 mb-2">월 저축 기여 금액</label>
                  <div class="relative">
                    <input type="text" id="contrib0Display"
                           oninput="handleContrib(0, this)"
                           placeholder="500,000"
                           class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-[#FCE8E3] focus:outline-none transition-colors pr-16 font-semibold text-gray-800">
                    <input type="hidden" id="contrib0" name="myContribution">
                    <span class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500">원/월</span>
                  </div>
                </div>
              </div>
              <div class="flex items-center gap-3 pl-[140px] mt-3">
                <div class="flex items-center gap-1.5 px-3 py-1.5 bg-gray-50 rounded-lg text-xs text-gray-500 border border-gray-200">
                  <i data-lucide="wallet" class="w-3.5 h-3.5"></i>
                  <span>내 개인계좌</span>
                </div>
                <i data-lucide="arrow-right" class="w-4 h-4 text-[#F5A5A5] animate-pulse"></i>
                <div class="flex items-center gap-1.5 px-3 py-1.5 bg-[#FCE8E3]/30 rounded-lg text-xs text-[#F5A5A5] border border-[#FCE8E3]">
                  <i data-lucide="users" class="w-3.5 h-3.5"></i>
                  <span>모임 통장</span>
                </div>
              </div>
            </div>

            </div>

            <div class="mt-8 pt-6 border-t border-gray-200">
              <div class="flex justify-between items-center">
                <span class="text-gray-700">모임 통장으로 모일 월 총액</span>
                <span id="totalContribDisplay" class="text-2xl font-bold text-[#F5A5A5]">₩0</span>
              </div>
            </div>
          </div>
        </div>

        <div class="col-span-3 space-y-6">

          <div class="bg-white rounded-3xl shadow-sm p-6">
            <h3 class="text-lg font-bold text-gray-800 mb-4">목표 요약</h3>
            <div class="space-y-3">
              <div class="flex justify-between">
                <span class="text-gray-600">목표 이름</span>
                <span id="summaryName" class="font-bold text-gray-800">-</span>
              </div>
              <div class="flex justify-between">
                <span class="text-gray-600">목표 금액</span>
                <span id="summaryTarget" class="font-bold text-gray-800">-</span>
              </div>
              <div class="flex justify-between">
                <span class="text-gray-600">목표 날짜</span>
                <span id="summaryDate" class="font-bold text-gray-800">-</span>
              </div>
              <div class="flex justify-between">
                <span class="text-gray-600">참여 인원</span>
                <span class="font-bold text-gray-800">2명</span>
              </div>
            </div>
          </div>

        </div>
      </div>

      <div class="mt-6 flex justify-end">
        <button type="submit"
                class="px-10 py-4 bg-[#FCE8E3] text-gray-800 rounded-xl hover:bg-[#FBD5CE] transition-colors shadow-lg text-lg font-bold">
          저축 시작하기
        </button>
      </div>

    </div>
  </form>
</main>

<th:block th:replace="~{common/layout/footer :: footer}"></th:block>

<script>
  const contribs = [0, 0];

  function formatNum(value) {
    const raw = value.replace(/[^0-9]/g, '');
    if (raw === '') return '';
    return parseInt(raw).toLocaleString('ko-KR');
  }

  function parseNum(str) {
    return parseInt(str.replace(/[^0-9]/g, '')) || 0;
  }

  function handleTargetAmount(input) {
    const raw = input.value.replace(/[^0-9]/g, '');
    if (raw === '') {
      input.value = '';
      document.getElementById('targetAmount').value = '';
    } else {
      input.value = parseInt(raw).toLocaleString('ko-KR');
      document.getElementById('targetAmount').value = raw;
    }
    updateSummary();
  }

  function handleContrib(idx, input) {
    const raw = input.value.replace(/[^0-9]/g, '');
    if (raw === '') {
      input.value = '';
      contribs[idx] = 0;
    } else {
      input.value = parseInt(raw).toLocaleString('ko-KR');
      contribs[idx] = parseInt(raw);
    }
    document.getElementById('contrib' + idx).value = contribs[idx];
    updateContribDisplay();
  }

  function updateContribDisplay() {
    const total = contribs[0];
    document.getElementById('totalContribDisplay').textContent = '₩' + total.toLocaleString('ko-KR');
  }

  function updateSummary() {
    const name = document.getElementById('goalName').value || '-';
    const targetRaw = document.getElementById('targetAmount').value;
    const date = document.getElementById('targetDate').value;

    document.getElementById('summaryName').textContent = name;
    document.getElementById('summaryTarget').textContent =
      targetRaw ? '₩' + parseInt(targetRaw).toLocaleString('ko-KR') : '-';
    document.getElementById('summaryDate').textContent = date || '-';
  }

  function handleSubmit(e) {
    const goalName = document.getElementById('goalName').value.trim();
    const targetAmount = document.getElementById('targetAmount').value;
    const targetDate = document.getElementById('targetDate').value;
    const totalContrib = contribs[0];

    if (!goalName || !targetAmount || !targetDate) {
      alert('모든 필수 항목을 입력해주세요.');
      e.preventDefault();
      return false;
    }
    if (totalContrib === 0) {
      alert('기여 금액을 입력해주세요.');
      e.preventDefault();
      return false;
    }

    document.getElementById('contrib0').value = contribs[0];
    document.getElementById('hiddenAutoAmount').value = totalContrib;
    return true;
  }

  window.addEventListener('DOMContentLoaded', function() {
    lucide.createIcons();
  });
</script>
<th:block th:replace="~{common/layout/header :: scripts}"></th:block>
</body>
</html>
