<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>구매 완료 - 모담</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <style>
    @keyframes zoomIn {
      from { opacity: 0; transform: scale(0.8); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .anim-zoom  { animation: zoomIn  0.5s ease both; }
    .anim-slide { animation: slideUp 0.7s ease both; }
    .delay-100  { animation-delay: 0.1s; }
    .delay-200  { animation-delay: 0.2s; }
    .delay-300  { animation-delay: 0.3s; }
    .delay-400  { animation-delay: 0.4s; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-[#FCE8E3] to-[#FFE4E8] flex flex-col">

  <!-- ===== 헤더 ===== -->
  <th:block th:replace="~{common/layout/header :: nav}"></th:block>

  <!-- ===== 메인 콘텐츠 ===== -->
  <main class="flex-1 flex flex-col items-center justify-center px-8 py-12">
    <div class="w-full max-w-2xl text-center">

      <!-- 성공 아이콘 -->
      <div class="mb-8 anim-zoom">
        <div class="w-32 h-32 bg-gradient-to-br from-[#F5A5A5] to-[#FFB8B8] rounded-full flex items-center justify-center mx-auto mb-6 shadow-2xl">
          <i data-lucide="gift" class="w-16 h-16 text-white"></i>
        </div>
      </div>

      <!-- 타이틀 -->
      <h1 class="text-5xl text-gray-800 mb-4 anim-slide">구매 완료!</h1>
      <p class="text-xl text-gray-600 mb-12 anim-slide delay-100">
        축하합니다! 상품 구매가 성공적으로 완료되었습니다
      </p>

      <!-- 상품 카드 -->
      <div class="bg-white/90 backdrop-blur rounded-3xl shadow-lg p-10 mb-8 anim-zoom delay-200">
        <div class="flex items-center gap-8">
          <div class="w-40 h-40 bg-gradient-to-br from-[#FCE8E3] to-[#FFE4E8] rounded-3xl flex items-center justify-center text-8xl shadow-lg flex-shrink-0">
            <span th:text="${product.image}" id="productImage">🌸</span>
          </div>
          <div class="flex-1 text-left">
            <p class="text-sm text-gray-600 mb-2">구매 상품</p>
            <h2 class="text-3xl text-gray-800 mb-4"
                th:text="${product.name}" id="productName">봄날의 벚꽃 핑크</h2>
            <div class="flex items-center gap-4 flex-wrap">
              <div class="bg-[#FCE8E3] rounded-xl px-4 py-2">
                <p class="text-sm text-gray-600">사용 포인트</p>
                <p class="text-2xl text-[#F5A5A5]">
                  <span th:text="${#numbers.formatInteger(product.price, 0, 'COMMA')}"
                        id="usedPoints">1,500</span>P
                </p>
              </div>
              <div class="bg-[#F0F9FF] rounded-xl px-4 py-2">
                <p class="text-sm text-gray-600">남은 포인트</p>
                <p class="text-2xl text-gray-800">
                  <span th:text="${#numbers.formatInteger(remainingPoints, 0, 'COMMA')}"
                        id="remainPoints">10,950</span>P
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 안내 카드 -->
      <div class="bg-white/90 backdrop-blur rounded-3xl shadow-lg p-8 mb-8 anim-slide delay-300 text-left">
        <div class="space-y-4">
          <div class="flex items-start gap-3">
            <div class="w-6 h-6 bg-[#F5A5A5] rounded-full flex items-center justify-center flex-shrink-0 mt-0.5">
              <span class="text-white text-sm font-bold">✓</span>
            </div>
            <p class="text-gray-800">구매하신 상품은 마이페이지에서 확인하실 수 있습니다</p>
          </div>
          <div class="flex items-start gap-3">
            <div class="w-6 h-6 bg-[#F5A5A5] rounded-full flex items-center justify-center flex-shrink-0 mt-0.5">
              <span class="text-white text-sm font-bold">✓</span>
            </div>
            <p class="text-gray-800">유효기간은 구매일로부터 30일입니다</p>
          </div>
          <div class="flex items-start gap-3">
            <div class="w-6 h-6 bg-[#F5A5A5] rounded-full flex items-center justify-center flex-shrink-0 mt-0.5">
              <span class="text-white text-sm font-bold">✓</span>
            </div>
            <p class="text-gray-800">즉시 사용 가능하며, 사용 방법은 마이페이지에서 확인하세요</p>
          </div>
        </div>
      </div>

      <!-- 액션 버튼 -->
      <div class="flex gap-4 anim-slide delay-400">
        <a th:href="@{/point-shop}" href="/point-shop"
           class="flex-1 px-8 py-4 bg-white text-gray-800 text-lg rounded-2xl hover:bg-gray-50 transition-all shadow-lg hover:shadow-xl flex items-center justify-center gap-3">
          <i data-lucide="shopping-bag" class="w-6 h-6"></i>
          <span>계속 쇼핑하기</span>
        </a>
        <a th:href="@{/dashboard}" href="/dashboard"
           class="flex-1 px-8 py-4 bg-[#F5A5A5] text-white text-lg rounded-2xl hover:bg-[#F28B8B] transition-all shadow-lg hover:shadow-xl flex items-center justify-center gap-3">
          <i data-lucide="home" class="w-6 h-6"></i>
          <span>홈으로 돌아가기</span>
        </a>
      </div>

    </div>
  </main>

  <!-- ===== 푸터 ===== -->
  <th:block th:replace="~{common/layout/footer :: footer}"></th:block>

  <script th:inline="javascript">
    const serverProduct       = /*[[${product}]]*/ null;
    const serverRemainingPts  = /*[[${remainingPoints ?: 0}]]*/ 0;

    function launchConfetti() {
      const colors  = ['#F5A5A5', '#FFB8B8', '#FCE8E3', '#FFE4E8'];
      const end     = Date.now() + 2000;
      const frame   = () => {
        confetti({ particleCount: 2, angle: 60,  spread: 55, origin: { x: 0 }, colors });
        confetti({ particleCount: 2, angle: 120, spread: 55, origin: { x: 1 }, colors });
        if (Date.now() < end) requestAnimationFrame(frame);
      };
      frame();
    }

    window.addEventListener('DOMContentLoaded', function() {
      // 서버 데이터 없으면 기본 상품 표시
      if (serverProduct === null) {
        const p = { name:'봄날의 벚꽃 핑크', price:1500, image:'🌸' };
        document.getElementById('productImage').textContent = p.image;
        document.getElementById('productName').textContent  = p.name;
        document.getElementById('usedPoints').textContent   = p.price.toLocaleString();
        document.getElementById('remainPoints').textContent = serverRemainingPts.toLocaleString();
      }
      lucide.createIcons();
      launchConfetti();
    });
  </script>
  <th:block th:replace="~{common/layout/header :: scripts}"></th:block>
</body>
</html>
