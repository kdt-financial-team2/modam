<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>아이디 찾기 | 모담</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-[#FCE8E3] to-[#FFE4E8] flex flex-col">

  <!-- 헤더 -->
  <header class="px-16 py-1 bg-white border-b border-gray-100 h-24 flex items-center">
    <a th:href="@{/}" class="hover:opacity-80 transition-opacity">
      <img th:src="@{/images/icons/logo.png}" alt="모담 로고" class="h-20 w-auto object-contain"/>
    </a>
  </header>

  <!-- 메인 콘텐츠 -->
  <div class="flex-1 flex flex-col items-center justify-center px-8 py-12">

    <!-- 타이틀 -->
    <div class="text-center mb-10">
      <h1 class="text-4xl mb-3 text-gray-800">아이디 찾기</h1>
      <p class="text-lg text-gray-600">가입 시 입력한 이름과 이메일로 아이디를 확인할 수 있어요</p>
    </div>

    <!-- 카드 -->
    <div class="w-full max-w-md bg-white rounded-3xl p-12 shadow-2xl">

      <!-- 결과 표시 -->
      <div th:if="${maskedId}" class="bg-[#FFF0EE] border-2 border-[#F5A5A5] rounded-2xl p-6 text-center mb-8">
        <p class="text-gray-600 mb-2 text-sm">
          <span th:text="${name}"></span>님의 아이디
        </p>
        <p class="text-2xl font-bold text-[#F28B8B]" th:text="${maskedId}"></p>
        <p class="text-xs text-gray-400 mt-2">보안을 위해 일부만 표시됩니다</p>
      </div>

      <!-- 에러 메시지 -->
      <div th:if="${error}" class="bg-red-50 border-2 border-red-200 rounded-2xl p-4 text-center mb-6">
        <p class="text-red-600">❌ <span th:text="${error}"></span></p>
      </div>

      <!-- 아이디 찾기 폼 (결과가 없을 때만 표시) -->
      <form th:if="${maskedId == null}" th:action="@{/auth/find-id}" method="post" class="space-y-6" id="findIdForm">
        <input th:if="${_csrf}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <!-- 이름 -->
        <div>
          <label class="block text-gray-800 mb-2 text-lg">이름</label>
          <input
            type="text"
            name="name"
            id="name"
            class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:outline-none focus:border-[#F5A5A5] transition-colors text-gray-800"
            placeholder="이름을 입력해주세요"
            autocomplete="name"
          />
          <p class="text-sm text-red-500 mt-2 hidden" id="nameError">❌ 이름을 입력해주세요</p>
        </div>

        <!-- 이메일 -->
        <div>
          <label class="block text-gray-800 mb-2 text-lg">이메일</label>
          <input
            type="email"
            name="email"
            id="email"
            class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:outline-none focus:border-[#F5A5A5] transition-colors text-gray-800"
            placeholder="가입 시 등록한 이메일"
            autocomplete="email"
          />
          <p class="text-sm text-red-500 mt-2 hidden" id="emailError">❌ 이메일을 입력해주세요</p>
        </div>

        <!-- 찾기 버튼 -->
        <button
          type="submit"
          class="w-full py-4 bg-[#F5A5A5] hover:bg-[#F28B8B] text-white text-lg rounded-2xl transition-all mt-4 shadow-md hover:shadow-lg"
        >
          아이디 찾기
        </button>
      </form>

      <!-- 결과 후 버튼들 -->
      <div th:if="${maskedId}" class="space-y-3 mt-2">
        <a th:href="@{/auth/login}"
           class="block w-full py-4 bg-[#F5A5A5] hover:bg-[#F28B8B] text-white text-lg rounded-2xl text-center transition-all shadow-md hover:shadow-lg">
          로그인하기
        </a>
        <a th:href="@{/auth/find-password}"
           class="block w-full py-4 bg-white border-2 border-[#F5A5A5] text-[#F5A5A5] hover:bg-[#FFF0EE] text-lg rounded-2xl text-center transition-all">
          비밀번호 찾기
        </a>
      </div>
    </div>

    <!-- 하단 링크 -->
    <div class="mt-8 flex gap-6 text-gray-600 text-base">
      <a th:href="@{/auth/login}" class="hover:text-[#F5A5A5] transition-colors">로그인</a>
      <span class="text-gray-300">|</span>
      <a th:href="@{/auth/find-password}" class="hover:text-[#F5A5A5] transition-colors">비밀번호 찾기</a>
      <span class="text-gray-300">|</span>
      <a th:href="@{/signup/step1}" class="hover:text-[#F5A5A5] transition-colors">회원가입</a>
    </div>
  </div>

  <!-- 푸터 -->
  <footer class="py-6 bg-white border-t border-gray-200 text-center text-gray-500 text-sm">
    © 2026 Modam. All rights reserved.
  </footer>

  <script>
    lucide.createIcons();

    const form = document.getElementById('findIdForm');
    if (form) {
      form.addEventListener('submit', function (e) {
        const name = document.getElementById('name');
        const email = document.getElementById('email');
        const nameError = document.getElementById('nameError');
        const emailError = document.getElementById('emailError');
        let valid = true;

        if (!name.value.trim()) {
          nameError.classList.remove('hidden');
          name.classList.add('border-red-500');
          name.classList.remove('border-gray-200');
          valid = false;
        } else {
          nameError.classList.add('hidden');
          name.classList.remove('border-red-500');
          name.classList.add('border-gray-200');
        }

        if (!email.value.trim()) {
          emailError.textContent = '❌ 이메일을 입력해주세요';
          emailError.classList.remove('hidden');
          email.classList.add('border-red-500');
          email.classList.remove('border-gray-200');
          valid = false;
        } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value)) {
          emailError.textContent = '❌ 올바른 이메일 형식을 입력해주세요';
          emailError.classList.remove('hidden');
          email.classList.add('border-red-500');
          email.classList.remove('border-gray-200');
          valid = false;
        } else {
          emailError.classList.add('hidden');
          email.classList.remove('border-red-500');
          email.classList.add('border-gray-200');
        }

        if (!valid) e.preventDefault();
      });
    }
  </script>
</body>
</html>
