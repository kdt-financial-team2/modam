<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>회원가입 - 정보입력 | 모담</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-[#FAFAFA]">

  <!-- 헤더 -->
  <header class="bg-white border-b border-gray-100 px-16 py-1 h-24 flex items-center">
    <a th:href="@{/}" class="hover:opacity-80 transition-opacity">
      <img th:src="@{/images/logo.png}" alt="모담 로고" class="h-20 w-auto object-contain"/>
    </a>
  </header>

  <!-- 메인 콘텐츠 -->
  <div class="max-w-[800px] mx-auto px-8 py-12">

    <!-- 스텝 인디케이터 -->
    <div class="mb-12">
      <div class="flex items-start justify-center">
        <!-- Step 1: 약관동의 (완료) -->
        <div class="flex items-start">
          <div class="flex flex-col items-center">
            <div class="w-12 h-12 rounded-full flex items-center justify-center bg-[#F5A5A5] text-white">
              <i data-lucide="check" class="w-6 h-6"></i>
            </div>
            <span class="text-xs mt-2 whitespace-nowrap text-gray-500">약관동의</span>
          </div>
          <div class="h-1 w-24 mx-4 mt-6 bg-[#F5A5A5]"></div>
        </div>
        <!-- Step 2: 정보입력 (현재) -->
        <div class="flex items-start">
          <div class="flex flex-col items-center">
            <div class="w-12 h-12 rounded-full flex items-center justify-center bg-[#FCE8E3] text-gray-800 ring-4 ring-[#FCE8E3]/30">
              <span class="text-lg">2</span>
            </div>
            <span class="text-xs mt-2 whitespace-nowrap text-gray-800 font-semibold">정보입력</span>
          </div>
          <div class="h-1 w-24 mx-4 mt-6 bg-gray-200"></div>
        </div>
        <!-- Step 3: 계좌연결 -->
        <div class="flex items-start">
          <div class="flex flex-col items-center">
            <div class="w-12 h-12 rounded-full flex items-center justify-center bg-gray-200 text-gray-500">
              <span class="text-lg">3</span>
            </div>
            <span class="text-xs mt-2 whitespace-nowrap text-gray-500">계좌연결</span>
          </div>
          <div class="h-1 w-24 mx-4 mt-6 bg-gray-200"></div>
        </div>
        <!-- Step 4: 가입완료 -->
        <div class="flex flex-col items-center">
          <div class="w-12 h-12 rounded-full flex items-center justify-center bg-gray-200 text-gray-500">
            <span class="text-lg">4</span>
          </div>
          <span class="text-xs mt-2 whitespace-nowrap text-gray-500">가입완료</span>
        </div>
      </div>
    </div>

    <!-- 스텝 콘텐츠 -->
    <div class="bg-white rounded-3xl shadow-sm p-10">
      <h2 class="text-3xl text-gray-800 mb-3">정보 입력</h2>
      <p class="text-gray-600 mb-8">회원가입을 위한 정보를 입력해주세요</p>

      <form th:action="@{/signup/step2}" method="post" th:object="${signupForm}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="space-y-5">
          <!-- 로그인 정보 -->
          <h3 class="text-lg text-gray-800">로그인 정보</h3>

          <div>
            <label class="block text-gray-800 mb-2">아이디</label>
            <input type="text" th:field="*{userId}"
                   class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:border-[#FCE8E3] focus:outline-none transition-colors"
                   placeholder="영문, 숫자 조합 6-20자"/>
            <p class="text-sm text-red-500 mt-1" th:if="${#fields.hasErrors('userId')}" th:errors="*{userId}"></p>
          </div>

          <div>
            <label class="block text-gray-800 mb-2">비밀번호</label>
            <input type="password" th:field="*{password}"
                   class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:border-[#FCE8E3] focus:outline-none transition-colors"
                   placeholder="영문, 숫자, 특수문자 조합 8자 이상"/>
            <p class="text-sm text-red-500 mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
          </div>

          <div>
            <label class="block text-gray-800 mb-2">비밀번호 확인</label>
            <input type="password" th:field="*{passwordConfirm}"
                   class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:border-[#FCE8E3] focus:outline-none transition-colors"
                   placeholder="비밀번호를 다시 입력해주세요"/>
          </div>

          <!-- 개인 정보 -->
          <div class="space-y-5 pt-6 border-t border-gray-200">
            <h3 class="text-lg text-gray-800">개인 정보</h3>

            <div>
              <label class="block text-gray-800 mb-2">이름</label>
              <input type="text" th:field="*{name}"
                     class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:border-[#FCE8E3] focus:outline-none transition-colors"
                     placeholder="홍길동"/>
            </div>

            <div>
              <label class="block text-gray-800 mb-2">주민등록번호</label>
              <div class="flex items-center gap-3">
                <input type="text" th:field="*{residentNumberFront}" maxlength="6"
                       class="flex-1 px-5 py-4 border-2 border-gray-200 rounded-2xl focus:border-[#FCE8E3] focus:outline-none transition-colors text-center text-lg tracking-wider"
                       placeholder="앞 6자리"
                       oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,6)"/>
                <span class="text-gray-400 text-2xl font-bold">-</span>
                <input type="password" th:field="*{residentNumberBack}" maxlength="7"
                       class="flex-1 px-5 py-4 border-2 border-gray-200 rounded-2xl focus:border-[#FCE8E3] focus:outline-none transition-colors text-center text-lg tracking-wider"
                       placeholder="뒤 7자리"
                       oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,7)"/>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-gray-800 mb-2">영문 성</label>
                <input type="text" th:field="*{englishLastName}"
                       class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:border-[#FCE8E3] focus:outline-none transition-colors"
                       placeholder="Kim"/>
              </div>
              <div>
                <label class="block text-gray-800 mb-2">영문 이름</label>
                <input type="text" th:field="*{englishFirstName}"
                       class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:border-[#FCE8E3] focus:outline-none transition-colors"
                       placeholder="Gildong"/>
              </div>
            </div>

            <div>
              <label class="block text-gray-800 mb-2">이메일</label>
              <input type="email" th:field="*{email}"
                     class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:border-[#FCE8E3] focus:outline-none transition-colors"
                     placeholder="example@email.com"/>
            </div>

            <div>
              <label class="block text-gray-800 mb-2">휴대폰 번호</label>
              <input type="tel" th:field="*{phone}"
                     class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:border-[#FCE8E3] focus:outline-none transition-colors"
                     placeholder="010-1234-5678"/>
            </div>

            <div>
              <label class="block text-gray-800 mb-2">주소</label>
              <div class="space-y-3">
                <div class="flex gap-3">
                  <input type="text" th:field="*{postalCode}" id="postalCode"
                         class="w-32 px-5 py-4 border-2 border-gray-200 rounded-2xl focus:border-[#FCE8E3] focus:outline-none transition-colors"
                         placeholder="우편번호" readonly/>
                  <button type="button" onclick="searchAddress()"
                          class="px-6 py-4 bg-gray-100 text-gray-700 rounded-2xl hover:bg-gray-200 transition-colors whitespace-nowrap">
                    주소 검색
                  </button>
                </div>
                <input type="text" th:field="*{address}" id="address"
                       class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:border-[#FCE8E3] focus:outline-none transition-colors"
                       placeholder="기본주소" readonly/>
                <input type="text" th:field="*{addressDetail}"
                       class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:border-[#FCE8E3] focus:outline-none transition-colors"
                       placeholder="상세주소"/>
              </div>
            </div>
          </div>
        </div>

        <div class="flex gap-4 mt-8">
          <a th:href="@{/signup/step1}"
             class="flex-1 py-4 bg-gray-100 text-gray-700 rounded-2xl hover:bg-gray-200 transition-colors flex items-center justify-center gap-2">
            <i data-lucide="chevron-left" class="w-5 h-5"></i> 이전
          </a>
          <button type="submit"
                  class="flex-1 py-4 bg-[#FCE8E3] text-gray-800 rounded-2xl hover:bg-[#FBD5CE] transition-colors flex items-center justify-center gap-2">
            다음 <i data-lucide="chevron-right" class="w-5 h-5"></i>
          </button>
        </div>
      </form>
    </div>

    <!-- 하단 로그인 링크 -->
    <div class="text-center mt-8 text-gray-600">
      이미 계정이 있으신가요?
      <a th:href="@{/login}" class="text-[#F5A5A5] hover:underline">로그인</a>
    </div>
  </div>

  <!-- 푸터 -->
  <footer class="mt-12 py-6 border-t border-gray-200 text-center text-gray-500 text-sm">
    © 2026 Modam. All rights reserved.
  </footer>

  <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
  <script>
    lucide.createIcons();

    function searchAddress() {
      new daum.Postcode({
        oncomplete: function(data) {
          document.getElementById('postalCode').value = data.zonecode;
          document.getElementById('address').value = data.roadAddress || data.jibunAddress;
        }
      }).open();
    }
  </script>
</body>
</html>
