<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>로그인 | 모담</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-[#FCE8E3] to-[#FFE4E8] flex flex-col">

  <!-- 헤더 -->
  <header class="px-16 py-1 bg-white border-b border-gray-100 h-24 flex items-center">
    <a th:href="@{/}" class="hover:opacity-80 transition-opacity">
      <img th:src="@{/images/icons/logo.png}" alt="모담 로고" class="h-20 w-auto object-contain"/>
    </a>
  </header>

  <!-- 메인 콘텐츠 -->
  <div class="flex-1 flex flex-col items-center justify-center px-8 py-12">

    <!-- 타이틀 -->
    <div class="text-center mb-12">
      <h1 class="text-5xl mb-4 text-gray-800">모담에 오신 것을 환영합니다</h1>
      <p class="text-xl text-gray-600">함께 관리하는 우리의 자산</p>
    </div>

    <!-- 로그인 카드 -->
    <div class="w-full max-w-md bg-white rounded-3xl p-12 shadow-2xl">

      <!-- 서버 에러 메시지 -->
      <div th:if="${loginError}" class="bg-red-50 border-2 border-red-200 rounded-2xl p-4 text-center mb-6">
        <p class="text-red-600">❌ <span th:text="${loginError}">아이디 또는 비밀번호가 일치하지 않습니다</span></p>
      </div>

      <form th:action="@{/login}" method="post" class="space-y-6" id="loginForm">
        <input th:if="${_csrf}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <!-- 아이디 입력 -->
        <div>
          <label class="block text-gray-800 mb-2 text-lg">아이디</label>
          <input
            type="text"
            name="userId"
            id="userId"
            th:value="${savedUserId}"
            class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:outline-none focus:border-[#F5A5A5] transition-colors text-gray-800"
            placeholder="아이디를 입력해주세요"
            autocomplete="username"
          />
          <p class="text-sm text-red-500 mt-2 hidden" id="userIdError">❌ 아이디를 입력해주세요</p>
        </div>

        <!-- 비밀번호 입력 -->
        <div>
          <label class="block text-gray-800 mb-2 text-lg">비밀번호</label>
          <div class="relative">
            <input
              type="password"
              name="password"
              id="password"
              class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:outline-none focus:border-[#F5A5A5] transition-colors text-gray-800 pr-12"
              placeholder="비밀번호를 입력해주세요"
              autocomplete="current-password"
            />
            <button type="button" onclick="togglePassword()"
                    class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
              <i data-lucide="eye" class="w-5 h-5" id="eyeIcon"></i>
            </button>
          </div>
          <p class="text-sm text-red-500 mt-2 hidden" id="passwordError">❌ 비밀번호를 입력해주세요</p>
        </div>

        <!-- 자동 로그인 -->
        <div class="flex items-center">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" name="remember-me" class="w-5 h-5 rounded accent-[#F5A5A5]"/>
            <span class="text-gray-700">자동 로그인</span>
          </label>
        </div>

        <!-- 로그인 버튼 -->
        <button
          type="submit"
          id="loginBtn"
          class="w-full py-4 bg-[#F5A5A5] hover:bg-[#F28B8B] text-white text-lg rounded-2xl transition-all mt-8 shadow-md hover:shadow-lg"
        >
          로그인
        </button>
      </form>
    </div>

    <!-- 회원가입 링크 -->
    <div class="mt-8 text-center">
      <p class="text-gray-700 text-lg">
        아직 계정이 없으신가요?
        <a th:href="@{/signup/step1}" class="text-[#F5A5A5] hover:underline font-semibold">회원가입</a>
      </p>
    </div>
  </div>

  <!-- 푸터 -->
  <footer class="py-6 bg-white border-t border-gray-200 text-center text-gray-500 text-sm">
    © 2026 Modam. All rights reserved.
  </footer>

  <script>
    lucide.createIcons();

    function togglePassword() {
      const input = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      icon.setAttribute('data-lucide', isPassword ? 'eye-off' : 'eye');
      lucide.createIcons();
    }

    document.getElementById('loginForm').addEventListener('submit', function (e) {
      const userId = document.getElementById('userId');
      const password = document.getElementById('password');
      const userIdError = document.getElementById('userIdError');
      const passwordError = document.getElementById('passwordError');
      let valid = true;

      if (!userId.value.trim()) {
        userIdError.textContent = '❌ 아이디를 입력해주세요';
        userIdError.classList.remove('hidden');
        userId.classList.add('border-red-500');
        userId.classList.remove('border-gray-200');
        valid = false;
      } else {
        userIdError.classList.add('hidden');
        userId.classList.remove('border-red-500');
        userId.classList.add('border-gray-200');
      }

      if (!password.value) {
        passwordError.textContent = '❌ 비밀번호를 입력해주세요';
        passwordError.classList.remove('hidden');
        password.classList.add('border-red-500');
        password.classList.remove('border-gray-200');
        valid = false;
      } else if (password.value.length < 8) {
        passwordError.textContent = '❌ 8자 이상 입력해주세요';
        passwordError.classList.remove('hidden');
        password.classList.add('border-red-500');
        password.classList.remove('border-gray-200');
        valid = false;
      } else {
        passwordError.classList.add('hidden');
        password.classList.remove('border-red-500');
        password.classList.add('border-gray-200');
      }

      if (!valid) {
        e.preventDefault();
        return;
      }

      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.textContent = '로그인 중...';
      btn.classList.add('bg-gray-400', 'cursor-not-allowed');
      btn.classList.remove('bg-[#F5A5A5]', 'hover:bg-[#F28B8B]');
    });
  </script>
</body>
</html>
