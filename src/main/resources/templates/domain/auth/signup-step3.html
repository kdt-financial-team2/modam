<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>회원가입 - 계좌연결 | 모담</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-[#FAFAFA]">

  <!-- 헤더 -->
  <header class="bg-white border-b border-gray-100 px-16 py-1 h-24 flex items-center">
    <a th:href="@{/}" class="hover:opacity-80 transition-opacity">
      <img th:src="@{/images/icons/logo.png}" alt="모담 로고" class="h-20 w-auto object-contain"/>
    </a>
  </header>

  <!-- 메인 콘텐츠 -->
  <div class="max-w-[800px] mx-auto px-8 py-12">

    <!-- 스텝 인디케이터 -->
    <div class="mb-12">
      <div class="flex items-start justify-center">
        <!-- Step 1: 약관동의 (완료) -->
        <div class="flex items-start">
          <div class="flex flex-col items-center">
            <div class="w-12 h-12 rounded-full flex items-center justify-center bg-[#F5A5A5] text-white">
              <i data-lucide="check" class="w-6 h-6"></i>
            </div>
            <span class="text-xs mt-2 whitespace-nowrap text-gray-500">약관동의</span>
          </div>
          <div class="h-1 w-24 mx-4 mt-6 bg-[#F5A5A5]"></div>
        </div>
        <!-- Step 2: 정보입력 (완료) -->
        <div class="flex items-start">
          <div class="flex flex-col items-center">
            <div class="w-12 h-12 rounded-full flex items-center justify-center bg-[#F5A5A5] text-white">
              <i data-lucide="check" class="w-6 h-6"></i>
            </div>
            <span class="text-xs mt-2 whitespace-nowrap text-gray-500">정보입력</span>
          </div>
          <div class="h-1 w-24 mx-4 mt-6 bg-[#F5A5A5]"></div>
        </div>
        <!-- Step 3: 계좌연결 (현재) -->
        <div class="flex items-start">
          <div class="flex flex-col items-center">
            <div class="w-12 h-12 rounded-full flex items-center justify-center bg-[#FCE8E3] text-gray-800 ring-4 ring-[#FCE8E3]/30">
              <span class="text-lg">3</span>
            </div>
            <span class="text-xs mt-2 whitespace-nowrap text-gray-800 font-semibold">계좌연결</span>
          </div>
          <div class="h-1 w-24 mx-4 mt-6 bg-gray-200"></div>
        </div>
        <!-- Step 4: 가입완료 -->
        <div class="flex flex-col items-center">
          <div class="w-12 h-12 rounded-full flex items-center justify-center bg-gray-200 text-gray-500">
            <span class="text-lg">4</span>
          </div>
          <span class="text-xs mt-2 whitespace-nowrap text-gray-500">가입완료</span>
        </div>
      </div>
    </div>

    <!-- 스텝 콘텐츠 -->
    <div class="bg-white rounded-3xl shadow-sm p-10">
      <h2 class="text-3xl text-gray-800 mb-3">계좌 연결</h2>
      <p class="text-gray-600 mb-8">공동 자금 관리를 위한 계좌를 연결해주세요</p>

      <form th:action="@{/signup/step3}" method="post" th:object="${signupForm}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="mb-6">
          <div class="bg-[#FCE8E3] rounded-2xl p-5">
            <p class="text-sm text-gray-700">💡 본인 명의의 계좌만 등록 가능합니다</p>
          </div>
        </div>

        <div class="space-y-5">
          <div>
            <label class="block text-gray-800 mb-2">은행</label>
            <select th:field="*{selectedBank}"
                    class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:border-[#FCE8E3] focus:outline-none transition-colors appearance-none">
              <option value="">은행을 선택해주세요</option>
              <option value="KB국민은행">KB국민은행</option>
              <option value="신한은행">신한은행</option>
              <option value="우리은행">우리은행</option>
              <option value="하나은행">하나은행</option>
              <option value="NH농협은행">NH농협은행</option>
              <option value="IBK기업은행">IBK기업은행</option>
              <option value="SC제일은행">SC제일은행</option>
              <option value="카카오뱅크">카카오뱅크</option>
              <option value="토스뱅크">토스뱅크</option>
              <option value="케이뱅크">케이뱅크</option>
              <option value="KDB산업은행">KDB산업은행</option>
              <option value="Sh수협은행">Sh수협은행</option>
              <option value="새마을금고">새마을금고</option>
              <option value="신협">신협</option>
              <option value="우체국">우체국</option>
              <option value="저축은행">저축은행</option>
            </select>
          </div>

          <div>
            <label class="block text-gray-800 mb-2">계좌번호</label>
            <input type="text" th:field="*{accountNumber}"
                   class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:border-[#FCE8E3] focus:outline-none transition-colors"
                   placeholder="'-' 없이 숫자만 입력"
                   oninput="this.value=this.value.replace(/[^0-9]/g,'')"/>
            <p class="text-sm text-gray-500 mt-2">본인 명의의 계좌만 등록 가능합니다</p>
          </div>
        </div>

        <div class="flex gap-4 mt-8">
          <a th:href="@{/signup/step2}"
             class="flex-1 py-4 bg-gray-100 text-gray-700 rounded-2xl hover:bg-gray-200 transition-colors flex items-center justify-center gap-2">
            <i data-lucide="chevron-left" class="w-5 h-5"></i> 이전
          </a>
          <button type="submit"
                  class="flex-1 py-4 bg-[#FCE8E3] text-gray-800 rounded-2xl hover:bg-[#FBD5CE] transition-colors flex items-center justify-center gap-2">
            다음 <i data-lucide="chevron-right" class="w-5 h-5"></i>
          </button>
        </div>
      </form>
    </div>

    <!-- 하단 로그인 링크 -->
    <div class="text-center mt-8 text-gray-600">
      이미 계정이 있으신가요?
      <a th:href="@{/login}" class="text-[#F5A5A5] hover:underline">로그인</a>
    </div>
  </div>

  <!-- 푸터 -->
  <footer class="mt-12 py-6 border-t border-gray-200 text-center text-gray-500 text-sm">
    © 2026 Modam. All rights reserved.
  </footer>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
