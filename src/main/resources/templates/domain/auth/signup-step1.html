<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>회원가입 - 약관동의 | 모담</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-[#FAFAFA]">

  <!-- 헤더 -->
  <header class="bg-white border-b border-gray-100 px-16 py-1 h-24 flex items-center">
    <a th:href="@{/}" class="hover:opacity-80 transition-opacity">
      <img th:src="@{/images/logo.png}" alt="모담 로고" class="h-20 w-auto object-contain"/>
    </a>
  </header>

  <!-- 메인 콘텐츠 -->
  <div class="max-w-[800px] mx-auto px-8 py-12">

    <!-- 스텝 인디케이터 -->
    <div class="mb-12">
      <div class="flex items-start justify-center">
        <!-- Step 1: 약관동의 (현재) -->
        <div class="flex items-start">
          <div class="flex flex-col items-center">
            <div class="w-12 h-12 rounded-full flex items-center justify-center bg-[#FCE8E3] text-gray-800 ring-4 ring-[#FCE8E3]/30">
              <span class="text-lg">1</span>
            </div>
            <span class="text-xs mt-2 whitespace-nowrap text-gray-800 font-semibold">약관동의</span>
          </div>
          <div class="h-1 w-24 mx-4 mt-6 bg-gray-200"></div>
        </div>
        <!-- Step 2: 정보입력 -->
        <div class="flex items-start">
          <div class="flex flex-col items-center">
            <div class="w-12 h-12 rounded-full flex items-center justify-center bg-gray-200 text-gray-500">
              <span class="text-lg">2</span>
            </div>
            <span class="text-xs mt-2 whitespace-nowrap text-gray-500">정보입력</span>
          </div>
          <div class="h-1 w-24 mx-4 mt-6 bg-gray-200"></div>
        </div>
        <!-- Step 3: 계좌연결 -->
        <div class="flex items-start">
          <div class="flex flex-col items-center">
            <div class="w-12 h-12 rounded-full flex items-center justify-center bg-gray-200 text-gray-500">
              <span class="text-lg">3</span>
            </div>
            <span class="text-xs mt-2 whitespace-nowrap text-gray-500">계좌연결</span>
          </div>
          <div class="h-1 w-24 mx-4 mt-6 bg-gray-200"></div>
        </div>
        <!-- Step 4: 가입완료 -->
        <div class="flex flex-col items-center">
          <div class="w-12 h-12 rounded-full flex items-center justify-center bg-gray-200 text-gray-500">
            <span class="text-lg">4</span>
          </div>
          <span class="text-xs mt-2 whitespace-nowrap text-gray-500">가입완료</span>
        </div>
      </div>
    </div>

    <!-- 스텝 콘텐츠 -->
    <div class="bg-white rounded-3xl shadow-sm p-10">
      <h2 class="text-3xl text-gray-800 mb-3">약관 동의</h2>
      <p class="text-gray-600 mb-8">서비스 이용을 위한 약관에 동의해주세요</p>

      <form th:action="@{/signup/step1}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="space-y-4">
          <!-- 전체 동의 -->
          <div class="bg-[#FCE8E3] rounded-2xl p-6">
            <label class="flex items-center gap-4 cursor-pointer">
              <input type="checkbox" id="agreeAll" onclick="toggleAll(this)"
                     class="w-6 h-6 rounded-lg accent-[#F5A5A5]"/>
              <span class="text-lg text-gray-800">전체 동의</span>
            </label>
            <p class="text-sm text-gray-600 ml-10 mt-1">아래 약관에 모두 동의합니다</p>
          </div>

          <!-- 필수 약관 -->
          <div class="space-y-3 pt-4">
            <label class="flex items-center justify-between p-5 border-2 border-gray-100 rounded-2xl cursor-pointer hover:border-[#FCE8E3] transition-colors">
              <div class="flex items-center gap-4">
                <input type="checkbox" name="agreeAge" class="agree-check w-5 h-5 rounded accent-[#F5A5A5]"/>
                <span class="text-gray-800">
                  <span class="text-[#F5A5A5]">[필수]</span> 만 14세 이상입니다
                </span>
              </div>
            </label>

            <label class="flex items-center justify-between p-5 border-2 border-gray-100 rounded-2xl cursor-pointer hover:border-[#FCE8E3] transition-colors">
              <div class="flex items-center gap-4">
                <input type="checkbox" name="agreeTerms" class="agree-check w-5 h-5 rounded accent-[#F5A5A5]"/>
                <span class="text-gray-800">
                  <span class="text-[#F5A5A5]">[필수]</span> 모담 이용약관 동의
                </span>
              </div>
              <i data-lucide="chevron-right" class="w-5 h-5 text-gray-400"></i>
            </label>

            <label class="flex items-center justify-between p-5 border-2 border-gray-100 rounded-2xl cursor-pointer hover:border-[#FCE8E3] transition-colors">
              <div class="flex items-center gap-4">
                <input type="checkbox" name="agreePrivacy" class="agree-check w-5 h-5 rounded accent-[#F5A5A5]"/>
                <span class="text-gray-800">
                  <span class="text-[#F5A5A5]">[필수]</span> 개인정보 수집 및 이용 동의
                </span>
              </div>
              <i data-lucide="chevron-right" class="w-5 h-5 text-gray-400"></i>
            </label>

            <label class="flex items-center justify-between p-5 border-2 border-gray-100 rounded-2xl cursor-pointer hover:border-[#FCE8E3] transition-colors">
              <div class="flex items-center gap-4">
                <input type="checkbox" name="agreeFinance" class="agree-check w-5 h-5 rounded accent-[#F5A5A5]"/>
                <span class="text-gray-800">
                  <span class="text-[#F5A5A5]">[필수]</span> 전자금융거래 이용약관 동의
                </span>
              </div>
              <i data-lucide="chevron-right" class="w-5 h-5 text-gray-400"></i>
            </label>

            <!-- 선택 약관 -->
            <div class="border-t border-gray-200 pt-3 mt-3">
              <label class="flex items-start justify-between p-5 border-2 border-gray-100 rounded-2xl cursor-pointer hover:border-[#FCE8E3] transition-colors">
                <div class="flex items-start gap-4">
                  <input type="checkbox" name="agreeMarketing"
                         class="w-5 h-5 rounded accent-[#F5A5A5] mt-0.5"/>
                  <div>
                    <span class="text-gray-800">
                      <span class="text-gray-500">[선택]</span> 마케팅 정보 수신 동의 (이메일, SMS)
                    </span>
                    <p class="text-xs text-gray-500 mt-1">이벤트, 혜택, 금융 상품 안내 등 유용한 정보를 받아보실 수 있습니다</p>
                  </div>
                </div>
                <i data-lucide="chevron-right" class="w-5 h-5 text-gray-400 flex-shrink-0"></i>
              </label>

              <label class="flex items-start justify-between p-5 border-2 border-gray-100 rounded-2xl cursor-pointer hover:border-[#FCE8E3] transition-colors mt-3">
                <div class="flex items-start gap-4">
                  <input type="checkbox" name="agreeThirdParty"
                         class="w-5 h-5 rounded accent-[#F5A5A5] mt-0.5"/>
                  <div>
                    <span class="text-gray-800">
                      <span class="text-gray-500">[선택]</span> 개인정보 제3자 제공 동의
                    </span>
                    <p class="text-xs text-gray-500 mt-1">제휴사를 통한 맞춤형 혜택 제공을 위해 필요합니다</p>
                  </div>
                </div>
                <i data-lucide="chevron-right" class="w-5 h-5 text-gray-400 flex-shrink-0"></i>
              </label>
            </div>
          </div>
        </div>

        <button type="submit" id="nextBtn"
                class="w-full mt-8 py-4 bg-[#FCE8E3] text-gray-800 rounded-2xl hover:bg-[#FBD5CE] transition-colors disabled:bg-gray-200 disabled:text-gray-400 disabled:cursor-not-allowed">
          다음
        </button>
      </form>
    </div>

    <!-- 하단 로그인 링크 -->
    <div class="text-center mt-8 text-gray-600">
      이미 계정이 있으신가요?
      <a th:href="@{/login}" class="text-[#F5A5A5] hover:underline">로그인</a>
    </div>
  </div>

  <!-- 푸터 -->
  <footer class="mt-12 py-6 border-t border-gray-200 text-center text-gray-500 text-sm">
    © 2026 Modam. All rights reserved.
  </footer>

  <script>
    lucide.createIcons();

    const requiredChecks = ['agreeAge', 'agreeTerms', 'agreePrivacy', 'agreeFinance'];
    const nextBtn = document.getElementById('nextBtn');

    function updateNextBtn() {
      const allRequired = requiredChecks.every(name =>
        document.querySelector(`input[name="${name}"]`).checked
      );
      nextBtn.disabled = !allRequired;
    }

    function toggleAll(checkbox) {
      document.querySelectorAll('.agree-check').forEach(cb => cb.checked = checkbox.checked);
      document.querySelectorAll('input[name="agreeMarketing"], input[name="agreeThirdParty"]')
        .forEach(cb => cb.checked = checkbox.checked);
      updateNextBtn();
    }

    document.querySelectorAll('.agree-check').forEach(cb => {
      cb.addEventListener('change', () => {
        const allChecked = [...document.querySelectorAll('.agree-check')].every(c => c.checked);
        document.getElementById('agreeAll').checked = allChecked;
        updateNextBtn();
      });
    });

    updateNextBtn();
  </script>
</body>
</html>
