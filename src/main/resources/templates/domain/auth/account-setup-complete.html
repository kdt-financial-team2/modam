<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>계좌 개설 완료 - 모담</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-[#FCE8E3] flex flex-col">

  <!-- 헤더 -->
  <header th:replace="~{common/layout/header :: simple-header}"></header>

  <!-- 메인 콘텐츠 -->
  <div class="flex-1 flex flex-col items-center justify-center px-8 py-12">
    <div class="bg-white rounded-[32px] shadow-2xl w-full max-w-2xl p-12">

      <!-- 성공 아이콘 -->
      <div class="flex justify-center mb-6">
        <div class="w-24 h-24 bg-gradient-to-br from-[#FCE8E3] to-[#FFE4E8] rounded-full flex items-center justify-center">
          <i data-lucide="check-circle" class="w-14 h-14 text-[#F5A5A5]"></i>
        </div>
      </div>

      <!-- 타이틀 -->
      <div class="text-center mb-10">
        <h1 class="text-4xl font-bold text-gray-900 mb-3">계좌 개설 완료!</h1>
        <p class="text-lg text-gray-600">모담 커플통장이 성공적으로 개설되었습니다</p>
      </div>

      <!-- 계좌번호 표시 -->
      <div class="bg-gradient-to-br from-[#F0F9FF] to-[#E0F2FE] rounded-3xl p-8 mb-8">
        <div class="text-center mb-4">
          <span class="text-sm text-gray-600 font-medium">계좌번호</span>
        </div>
        <div class="flex items-center justify-center gap-4 mb-4">
          <div class="text-3xl font-bold text-gray-900 font-mono tracking-wider" id="accountNumberDisplay"
               th:text="${accountNumber}">0000-0000-0000</div>
          <button onclick="copyAccountNumber()" class="p-3 bg-white rounded-xl hover:bg-gray-50 transition-colors shadow-sm" title="계좌번호 복사">
            <i data-lucide="copy" class="w-5 h-5 text-gray-600"></i>
          </button>
        </div>
        <div id="copyMessage" class="text-center hidden">
          <span class="text-sm text-[#F5A5A5] font-medium">✓ 복사되었습니다</span>
        </div>
      </div>

      <!-- 안내 카드 -->
      <div class="space-y-4 mb-10">
        <div class="bg-[#FFF7F5] rounded-2xl p-5">
          <div class="flex items-start gap-3">
            <span class="text-2xl">💕</span>
            <div class="flex-1">
              <p class="font-semibold text-gray-800 mb-1">파트너와 함께 시작하세요</p>
              <p class="text-sm text-gray-600">파트너를 초대하고 함께 커플통장을 사용해보세요</p>
            </div>
          </div>
        </div>

        <div class="bg-[#FFF7F5] rounded-2xl p-5">
          <div class="flex items-start gap-3">
            <span class="text-2xl">🎯</span>
            <div class="flex-1">
              <p class="font-semibold text-gray-800 mb-1">목표 저축을 설정해보세요</p>
              <p class="text-sm text-gray-600">함께 모으고 싶은 금액을 설정하고 계획적으로 저축하세요</p>
            </div>
          </div>
        </div>

        <div class="bg-[#FFF7F5] rounded-2xl p-5">
          <div class="flex items-start gap-3">
            <span class="text-2xl">🎁</span>
            <div class="flex-1">
              <p class="font-semibold text-gray-800 mb-1">소비 기록으로 포인트 적립</p>
              <p class="text-sm text-gray-600">소비 내역에 감정을 기록하면 포인트를 받을 수 있어요</p>
            </div>
          </div>
        </div>
      </div>

      <!-- 시작 버튼 -->
      <form th:action="@{/account-setup-complete}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" class="w-full py-5 bg-[#F5A5A5] text-white rounded-2xl hover:bg-[#F28B8B] transition-all shadow-md font-semibold text-lg flex items-center justify-center gap-2">
          모담 시작하기
          <i data-lucide="arrow-right" class="w-5 h-5"></i>
        </button>
      </form>

    </div>
  </div>

  <script>
    lucide.createIcons();

    function copyAccountNumber() {
      const accountNumber = document.getElementById('accountNumberDisplay').textContent;
      navigator.clipboard.writeText(accountNumber).then(() => {
        const msg = document.getElementById('copyMessage');
        msg.classList.remove('hidden');
        setTimeout(() => msg.classList.add('hidden'), 2000);
      });
    }
  </script>
</body>
</html>
