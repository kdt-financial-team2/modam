<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>회원가입 - 모담</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-[#FAFAFA] relative">

  <!-- 헤더 -->
  <header th:replace="~{common/layout/header :: simple-header}"></header>

  <!-- 메인 콘텐츠 -->
  <div class="max-w-[800px] mx-auto px-8 py-12">

    <!-- 스텝 인디케이터 -->
    <div class="mb-12">
      <div class="flex items-start justify-center">
        <!-- 각 step은 서버에서 currentStep(1~4)을 넘겨줌 -->
        <div th:each="step,stat : ${#numbers.sequence(1,4)}" class="flex items-start">
          <div class="flex flex-col items-center">
            <div th:classappend="${step < currentStep} ? 'bg-[#F5A5A5] text-white' : (${step == currentStep} ? 'bg-[#FCE8E3] text-gray-800 ring-4 ring-[#FCE8E3]/30' : 'bg-gray-200 text-gray-500')"
                 class="w-12 h-12 rounded-full flex items-center justify-center transition-all">
              <i th:if="${step < currentStep}" data-lucide="check" class="w-6 h-6"></i>
              <span th:unless="${step < currentStep}" class="text-lg" th:text="${step}">1</span>
            </div>
            <span th:classappend="${step == currentStep} ? 'text-gray-800 font-semibold' : 'text-gray-500'"
                  class="text-xs mt-2 whitespace-nowrap">
              <span th:if="${step == 1}">약관동의</span>
              <span th:if="${step == 2}">정보입력</span>
              <span th:if="${step == 3}">계좌연결</span>
              <span th:if="${step == 4}">가입완료</span>
            </span>
          </div>
          <div th:unless="${stat.last}"
               th:classappend="${step < currentStep} ? 'bg-[#F5A5A5]' : 'bg-gray-200'"
               class="h-1 w-24 mx-4 mt-6 transition-all"></div>
        </div>
      </div>
    </div>

    <!-- 스텝 콘텐츠 -->
    <div class="bg-white rounded-3xl shadow-sm p-10">

      <!-- Step 1: 약관 동의 -->
      <div th:if="${currentStep == 1}">
        <h2 class="text-3xl text-gray-800 mb-3">약관 동의</h2>
        <p class="text-gray-600 mb-8">서비스 이용을 위한 약관에 동의해주세요</p>

        <form th:action="@{/signup/step1}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

          <div class="space-y-4">
            <!-- 전체 동의 -->
            <div class="bg-[#FCE8E3] rounded-2xl p-6">
              <label class="flex items-center gap-4 cursor-pointer">
                <input type="checkbox" id="agreeAll" onclick="toggleAll(this)" class="w-6 h-6 rounded-lg accent-[#F5A5A5]"/>
                <span class="text-lg text-gray-800">전체 동의</span>
              </label>
              <p class="text-sm text-gray-600 ml-10 mt-1">아래 약관에 모두 동의합니다</p>
            </div>

            <!-- 개별 약관 -->
            <div class="space-y-3 pt-4">
              <label class="flex items-center justify-between p-5 border-2 border-gray-100 rounded-2xl cursor-pointer hover:border-[#FCE8E3] transition-colors">
                <div class="flex items-center gap-4">
                  <input type="checkbox" name="agreeAge" class="agree-check w-5 h-5 rounded accent-[#F5A5A5]"/>
                  <span class="text-gray-800"><span class="text-[#F5A5A5]">[필수]</span> 만 14세 이상입니다</span>
                </div>
              </label>

              <label class="flex items-center justify-between p-5 border-2 border-gray-100 rounded-2xl cursor-pointer hover:border-[#FCE8E3] transition-colors">
                <div class="flex items-center gap-4">
                  <input type="checkbox" name="agreeTerms" class="agree-check w-5 h-5 rounded accent-[#F5A5A5]"/>
                  <span class="text-gray-800"><span class="text-[#F5A5A5]">[필수]</span> 모담 이용약관 동의</span>
                </div>
                <i data-lucide="chevron-right" class="w-5 h-5 text-gray-400"></i>
              </label>

              <label class="flex items-center justify-between p-5 border-2 border-gray-100 rounded-2xl cursor-pointer hover:border-[#FCE8E3] transition-colors">
                <div class="flex items-center gap-4">
                  <input type="checkbox" name="agreePrivacy" class="agree-check w-5 h-5 rounded accent-[#F5A5A5]"/>
                  <span class="text-gray-800"><span class="text-[#F5A5A5]">[필수]</span> 개인정보 수집 및 이용 동의</span>
                </div>
                <i data-lucide="chevron-right" class="w-5 h-5 text-gray-400"></i>
              </label>

              <label class="flex items-center justify-between p-5 border-2 border-gray-100 rounded-2xl cursor-pointer hover:border-[#FCE8E3] transition-colors">
                <div class="flex items-center gap-4">
                  <input type="checkbox" name="agreeFinance" class="agree-check w-5 h-5 rounded accent-[#F5A5A5]"/>
                  <span class="text-gray-800"><span class="text-[#F5A5A5]">[필수]</span> 전자금융거래 이용약관 동의</span>
                </div>
                <i data-lucide="chevron-right" class="w-5 h-5 text-gray-400"></i>
              </label>

              <div class="border-t border-gray-200 pt-3 mt-3">
                <label class="flex items-start justify-between p-5 border-2 border-gray-100 rounded-2xl cursor-pointer hover:border-[#FCE8E3] transition-colors">
                  <div class="flex items-start gap-4">
                    <input type="checkbox" name="agreeMarketing" class="w-5 h-5 rounded accent-[#F5A5A5] mt-0.5"/>
                    <div>
                      <span class="text-gray-800"><span class="text-gray-500">[선택]</span> 마케팅 정보 수신 동의</span>
                      <p class="text-xs text-gray-500 mt-1">이벤트, 혜택, 금융 상품 안내 등 유용한 정보를 받아보실 수 있습니다</p>
                    </div>
                  </div>
                </label>
              </div>
            </div>
          </div>

          <button type="submit" id="nextBtn1" class="w-full mt-8 py-4 bg-[#FCE8E3] text-gray-800 rounded-2xl hover:bg-[#FBD5CE] transition-colors">다음</button>
        </form>
      </div>

      <!-- Step 2: 정보 입력 -->
      <div th:if="${currentStep == 2}">
        <h2 class="text-3xl text-gray-800 mb-3">정보 입력</h2>
        <p class="text-gray-600 mb-8">회원가입을 위한 정보를 입력해주세요</p>

        <form th:action="@{/signup/step2}" method="post" th:object="${signupForm}">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

          <div class="space-y-5">
            <h3 class="text-lg text-gray-800">로그인 정보</h3>

            <div>
              <label class="block text-gray-800 mb-2">아이디</label>
              <input type="text" th:field="*{userId}" class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:border-[#FCE8E3] focus:outline-none transition-colors" placeholder="영문, 숫자 조합 6-20자"/>
              <p class="text-sm text-red-500 mt-1" th:if="${#fields.hasErrors('userId')}" th:errors="*{userId}"></p>
            </div>

            <div>
              <label class="block text-gray-800 mb-2">비밀번호</label>
              <input type="password" th:field="*{password}" class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:border-[#FCE8E3] focus:outline-none transition-colors" placeholder="영문, 숫자, 특수문자 조합 8자 이상"/>
              <p class="text-sm text-red-500 mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
            </div>

            <div>
              <label class="block text-gray-800 mb-2">비밀번호 확인</label>
              <input type="password" th:field="*{passwordConfirm}" class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:border-[#FCE8E3] focus:outline-none transition-colors" placeholder="비밀번호를 다시 입력해주세요"/>
            </div>

            <div class="pt-6 border-t border-gray-200">
              <h3 class="text-lg text-gray-800 mb-5">개인 정보</h3>

              <div class="space-y-5">
                <div>
                  <label class="block text-gray-800 mb-2">이름</label>
                  <input type="text" th:field="*{name}" class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:border-[#FCE8E3] focus:outline-none transition-colors" placeholder="홍길동"/>
                </div>

                <div>
                  <label class="block text-gray-800 mb-2">주민등록번호</label>
                  <div class="flex items-center gap-3">
                    <input type="text" th:field="*{residentNumberFront}" maxlength="6" class="flex-1 px-5 py-4 border-2 border-gray-200 rounded-2xl focus:border-[#FCE8E3] focus:outline-none transition-colors text-center text-lg tracking-wider" placeholder="앞 6자리"/>
                    <span class="text-gray-400 text-2xl font-bold">-</span>
                    <input type="password" th:field="*{residentNumberBack}" maxlength="7" class="flex-1 px-5 py-4 border-2 border-gray-200 rounded-2xl focus:border-[#FCE8E3] focus:outline-none transition-colors text-center text-lg tracking-wider" placeholder="뒤 7자리"/>
                  </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                  <div>
                    <label class="block text-gray-800 mb-2">영문 성</label>
                    <input type="text" th:field="*{englishLastName}" class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:border-[#FCE8E3] focus:outline-none transition-colors" placeholder="Kim"/>
                  </div>
                  <div>
                    <label class="block text-gray-800 mb-2">영문 이름</label>
                    <input type="text" th:field="*{englishFirstName}" class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:border-[#FCE8E3] focus:outline-none transition-colors" placeholder="Gildong"/>
                  </div>
                </div>

                <div>
                  <label class="block text-gray-800 mb-2">이메일</label>
                  <input type="email" th:field="*{email}" class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:border-[#FCE8E3] focus:outline-none transition-colors" placeholder="example@email.com"/>
                </div>

                <div>
                  <label class="block text-gray-800 mb-2">휴대폰 번호</label>
                  <input type="tel" th:field="*{phone}" class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:border-[#FCE8E3] focus:outline-none transition-colors" placeholder="010-1234-5678"/>
                </div>

                <div>
                  <label class="block text-gray-800 mb-2">주소</label>
                  <div class="space-y-3">
                    <div class="flex gap-3">
                      <input type="text" th:field="*{postalCode}" class="w-32 px-5 py-4 border-2 border-gray-200 rounded-2xl focus:border-[#FCE8E3] focus:outline-none transition-colors" placeholder="우편번호"/>
                      <button type="button" onclick="searchAddress()" class="px-6 py-4 bg-gray-100 text-gray-700 rounded-2xl hover:bg-gray-200 transition-colors whitespace-nowrap">주소 검색</button>
                    </div>
                    <input type="text" th:field="*{address}" id="address" class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:border-[#FCE8E3] focus:outline-none transition-colors" placeholder="기본주소"/>
                    <input type="text" th:field="*{addressDetail}" class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:border-[#FCE8E3] focus:outline-none transition-colors" placeholder="상세주소"/>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="flex gap-4 mt-8">
            <a th:href="@{/signup/step1}" class="flex-1 py-4 bg-gray-100 text-gray-700 rounded-2xl hover:bg-gray-200 transition-colors flex items-center justify-center gap-2">
              <i data-lucide="chevron-left" class="w-5 h-5"></i> 이전
            </a>
            <button type="submit" class="flex-1 py-4 bg-[#FCE8E3] text-gray-800 rounded-2xl hover:bg-[#FBD5CE] transition-colors flex items-center justify-center gap-2">
              다음 <i data-lucide="chevron-right" class="w-5 h-5"></i>
            </button>
          </div>
        </form>
      </div>

      <!-- Step 3: 계좌 연결 -->
      <div th:if="${currentStep == 3}">
        <h2 class="text-3xl text-gray-800 mb-3">계좌 연결</h2>
        <p class="text-gray-600 mb-8">공동 자금 관리를 위한 계좌를 연결해주세요</p>

        <form th:action="@{/signup/step3}" method="post" th:object="${signupForm}">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

          <div class="mb-6">
            <div class="bg-[#FCE8E3] rounded-2xl p-5">
              <p class="text-sm text-gray-700">💡 본인 명의의 계좌만 등록 가능합니다</p>
            </div>
          </div>

          <div class="space-y-5">
            <div>
              <label class="block text-gray-800 mb-2">은행</label>
              <select th:field="*{selectedBank}" class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:border-[#FCE8E3] focus:outline-none transition-colors">
                <option value="">은행을 선택해주세요</option>
                <option value="KB국민은행">KB국민은행</option>
                <option value="신한은행">신한은행</option>
                <option value="우리은행">우리은행</option>
                <option value="하나은행">하나은행</option>
                <option value="NH농협은행">NH농협은행</option>
                <option value="IBK기업은행">IBK기업은행</option>
                <option value="카카오뱅크">카카오뱅크</option>
                <option value="토스뱅크">토스뱅크</option>
                <option value="케이뱅크">케이뱅크</option>
              </select>
            </div>

            <div>
              <label class="block text-gray-800 mb-2">계좌번호</label>
              <input type="text" th:field="*{accountNumber}" class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:border-[#FCE8E3] focus:outline-none transition-colors" placeholder="'-' 없이 숫자만 입력"/>
              <p class="text-sm text-gray-500 mt-2">본인 명의의 계좌만 등록 가능합니다</p>
            </div>
          </div>

          <div class="flex gap-4 mt-8">
            <a th:href="@{/signup/step2}" class="flex-1 py-4 bg-gray-100 text-gray-700 rounded-2xl hover:bg-gray-200 transition-colors flex items-center justify-center gap-2">
              <i data-lucide="chevron-left" class="w-5 h-5"></i> 이전
            </a>
            <button type="submit" class="flex-1 py-4 bg-[#FCE8E3] text-gray-800 rounded-2xl hover:bg-[#FBD5CE] transition-colors flex items-center justify-center gap-2">
              다음 <i data-lucide="chevron-right" class="w-5 h-5"></i>
            </button>
          </div>
        </form>
      </div>

      <!-- Step 4: 가입 완료 -->
      <div th:if="${currentStep == 4}" class="text-center py-8">
        <div class="w-24 h-24 bg-gradient-to-br from-[#FCE8E3] to-[#FFE4E8] rounded-full flex items-center justify-center mx-auto mb-6">
          <i data-lucide="sparkles" class="w-12 h-12 text-[#F5A5A5]"></i>
        </div>
        <h2 class="text-4xl text-gray-800 mb-4">회원가입이 완료되었습니다!</h2>
        <p class="text-xl text-gray-600 mb-8">이제 모담과 함께 따뜻한 자산 관리를 시작해보세요</p>

        <div class="bg-[#FCE8E3] rounded-2xl p-8 mb-8">
          <div class="space-y-3 text-left">
            <div class="flex items-center gap-3">
              <i data-lucide="check" class="w-6 h-6 text-[#F5A5A5]"></i>
              <span class="text-gray-800">공동 예산 관리</span>
            </div>
            <div class="flex items-center gap-3">
              <i data-lucide="check" class="w-6 h-6 text-[#F5A5A5]"></i>
              <span class="text-gray-800">실시간 지출 추적</span>
            </div>
            <div class="flex items-center gap-3">
              <i data-lucide="check" class="w-6 h-6 text-[#F5A5A5]"></i>
              <span class="text-gray-800">목표 저축 달성</span>
            </div>
            <div class="flex items-center gap-3">
              <i data-lucide="check" class="w-6 h-6 text-[#F5A5A5]"></i>
              <span class="text-gray-800">커플 포인트 적립</span>
            </div>
          </div>
        </div>

        <a th:href="@{/login}">
          <button class="w-full py-5 bg-[#F5A5A5] text-white text-xl rounded-2xl hover:bg-[#F28B8B] transition-colors shadow-lg">모담 시작하기</button>
        </a>
      </div>

    </div>

    <!-- 하단 로그인 링크 -->
    <div th:unless="${currentStep == 4}" class="text-center mt-8 text-gray-600">
      이미 계정이 있으신가요?
      <a th:href="@{/login}" class="text-[#F5A5A5] hover:underline">로그인</a>
    </div>
  </div>

  <!-- 푸터 -->
  <footer th:replace="~{common/layout/footer :: simple-footer}"></footer>

  <script>
    lucide.createIcons();

    function toggleAll(checkbox) {
      document.querySelectorAll('.agree-check').forEach(cb => cb.checked = checkbox.checked);
    }

    function searchAddress() {
      // 카카오 우편번호 API 연동 예시
      // new daum.Postcode({ oncomplete: function(data) { ... } }).open();
      alert('주소 검색 API를 연동해주세요 (카카오 Postcode API)');
    }
  </script>
</body>
</html>
