<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>계좌 개설 - 모담</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-[#FCE8E3] flex flex-col">
  <header th:replace="~{common/layout/header :: simple-header}"></header>

  <div class="flex-1 flex flex-col items-center justify-center px-8 py-12">
    <div class="bg-white rounded-[32px] shadow-2xl w-full max-w-2xl p-12">
      <div class="text-center mb-10">
        <div class="w-20 h-20 bg-gradient-to-br from-[#FCE8E3] to-[#FFE4E8] rounded-full flex items-center justify-center mx-auto mb-4">
          <i data-lucide="credit-card" class="w-10 h-10 text-[#F5A5A5]"></i>
        </div>
        <h1 class="text-4xl font-bold text-gray-900 mb-3">커플통장 개설</h1>
        <p class="text-lg text-gray-600">모담 커플통장을 개설해 함께 관리를 시작하세요</p>
      </div>

      <form th:action="@{/account-setup}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="space-y-5">
          <div>
            <label class="block text-gray-800 mb-2 text-lg">계좌 비밀번호 (4자리)</label>
            <input type="password" name="accountPassword" maxlength="4" inputmode="numeric"
                   class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:border-[#F5A5A5] focus:outline-none transition-colors text-center text-2xl tracking-[1em]"
                   placeholder="••••"/>
          </div>

          <div>
            <label class="block text-gray-800 mb-2 text-lg">계좌 비밀번호 확인</label>
            <input type="password" name="accountPasswordConfirm" maxlength="4" inputmode="numeric"
                   class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:border-[#F5A5A5] focus:outline-none transition-colors text-center text-2xl tracking-[1em]"
                   placeholder="••••"/>
          </div>

          <div class="bg-[#FFF7F5] rounded-2xl p-5">
            <div class="flex items-start gap-3">
              <span class="text-2xl">💡</span>
              <div>
                <p class="font-medium text-gray-800 mb-1">계좌 개설 안내</p>
                <ul class="text-sm text-gray-600 space-y-1">
                  <li>• 커플통장 계좌번호가 자동 생성됩니다</li>
                  <li>• 파트너 초대 후 함께 사용할 수 있습니다</li>
                  <li>• 개설 즉시 입출금이 가능합니다</li>
                </ul>
              </div>
            </div>
          </div>
        </div>

        <button type="submit" class="w-full mt-8 py-5 bg-[#F5A5A5] text-white rounded-2xl hover:bg-[#F28B8B] transition-all shadow-md font-semibold text-lg">
          계좌 개설하기
        </button>
      </form>
    </div>
  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
