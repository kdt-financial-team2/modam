<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>비밀번호 찾기 | 모담</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-[#FCE8E3] to-[#FFE4E8] flex flex-col">

  <!-- 헤더 -->
  <header class="px-16 py-1 bg-white border-b border-gray-100 h-24 flex items-center">
    <a th:href="@{/}" class="hover:opacity-80 transition-opacity">
      <img th:src="@{/images/icons/logo.png}" alt="모담 로고" class="h-20 w-auto object-contain"/>
    </a>
  </header>

  <!-- 메인 콘텐츠 -->
  <div class="flex-1 flex flex-col items-center justify-center px-8 py-12">

    <!-- 타이틀 -->
    <div class="text-center mb-10">
      <h1 class="text-4xl mb-3 text-gray-800">비밀번호 찾기</h1>
      <p class="text-lg text-gray-600" th:text="${verified} ? '새로운 비밀번호를 설정해주세요' : '아이디와 이메일로 본인을 확인합니다'"></p>
    </div>

    <!-- 카드 -->
    <div class="w-full max-w-md bg-white rounded-3xl p-12 shadow-2xl">

      <!-- 에러 메시지 -->
      <div th:if="${error}" class="bg-red-50 border-2 border-red-200 rounded-2xl p-4 text-center mb-6">
        <p class="text-red-600">❌ <span th:text="${error}"></span></p>
      </div>

      <!-- 단계 표시 -->
      <div class="flex items-center justify-center mb-8">
        <div class="flex items-center gap-3">
          <div th:class="${verified} ? 'w-8 h-8 rounded-full bg-[#F5A5A5] text-white flex items-center justify-center text-sm font-bold' : 'w-8 h-8 rounded-full bg-[#F5A5A5] text-white flex items-center justify-center text-sm font-bold'">1</div>
          <span th:class="${verified} ? 'text-gray-400 text-sm' : 'text-gray-800 text-sm font-semibold'">본인 확인</span>
          <div class="w-8 h-px bg-gray-300 mx-1"></div>
          <div th:class="${verified} ? 'w-8 h-8 rounded-full bg-[#F5A5A5] text-white flex items-center justify-center text-sm font-bold' : 'w-8 h-8 rounded-full bg-gray-200 text-gray-400 flex items-center justify-center text-sm font-bold'">2</div>
          <span th:class="${verified} ? 'text-gray-800 text-sm font-semibold' : 'text-gray-400 text-sm'">비밀번호 재설정</span>
        </div>
      </div>

      <!-- Step 1: 본인 확인 폼 -->
      <form th:unless="${verified}" th:action="@{/auth/find-password/verify}" method="post" class="space-y-6" id="verifyForm">
        <input th:if="${_csrf}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <!-- 아이디 -->
        <div>
          <label class="block text-gray-800 mb-2 text-lg">아이디</label>
          <input
            type="text"
            name="userId"
            id="verifyUserId"
            class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:outline-none focus:border-[#F5A5A5] transition-colors text-gray-800"
            placeholder="아이디를 입력해주세요"
            autocomplete="username"
          />
          <p class="text-sm text-red-500 mt-2 hidden" id="verifyUserIdError">❌ 아이디를 입력해주세요</p>
        </div>

        <!-- 이메일 -->
        <div>
          <label class="block text-gray-800 mb-2 text-lg">이메일</label>
          <input
            type="email"
            name="email"
            id="verifyEmail"
            class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:outline-none focus:border-[#F5A5A5] transition-colors text-gray-800"
            placeholder="가입 시 등록한 이메일"
            autocomplete="email"
          />
          <p class="text-sm text-red-500 mt-2 hidden" id="verifyEmailError">❌ 이메일을 입력해주세요</p>
        </div>

        <!-- 확인 버튼 -->
        <button
          type="submit"
          class="w-full py-4 bg-[#F5A5A5] hover:bg-[#F28B8B] text-white text-lg rounded-2xl transition-all mt-4 shadow-md hover:shadow-lg"
        >
          본인 확인
        </button>
      </form>

      <!-- Step 2: 새 비밀번호 설정 폼 -->
      <form th:if="${verified}" th:action="@{/auth/find-password/reset}" method="post" class="space-y-6" id="resetForm">
        <input th:if="${_csrf}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <!-- 새 비밀번호 -->
        <div>
          <label class="block text-gray-800 mb-2 text-lg">새 비밀번호</label>
          <div class="relative">
            <input
              type="password"
              name="newPassword"
              id="newPassword"
              class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:outline-none focus:border-[#F5A5A5] transition-colors text-gray-800 pr-12"
              placeholder="8자 이상 입력해주세요"
              autocomplete="new-password"
            />
            <button type="button" onclick="toggleNewPassword()"
                    class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
              <i data-lucide="eye" class="w-5 h-5" id="newPwEyeIcon"></i>
            </button>
          </div>
          <p class="text-sm text-red-500 mt-2 hidden" id="newPasswordError">❌ 비밀번호를 입력해주세요</p>
        </div>

        <!-- 새 비밀번호 확인 -->
        <div>
          <label class="block text-gray-800 mb-2 text-lg">새 비밀번호 확인</label>
          <div class="relative">
            <input
              type="password"
              name="newPasswordConfirm"
              id="newPasswordConfirm"
              class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:outline-none focus:border-[#F5A5A5] transition-colors text-gray-800 pr-12"
              placeholder="비밀번호를 한 번 더 입력해주세요"
              autocomplete="new-password"
            />
            <button type="button" onclick="toggleConfirmPassword()"
                    class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
              <i data-lucide="eye" class="w-5 h-5" id="confirmPwEyeIcon"></i>
            </button>
          </div>
          <p class="text-sm text-red-500 mt-2 hidden" id="newPasswordConfirmError">❌ 비밀번호 확인을 입력해주세요</p>
        </div>

        <!-- 변경 버튼 -->
        <button
          type="submit"
          class="w-full py-4 bg-[#F5A5A5] hover:bg-[#F28B8B] text-white text-lg rounded-2xl transition-all mt-4 shadow-md hover:shadow-lg"
        >
          비밀번호 변경
        </button>
      </form>
    </div>

    <!-- 하단 링크 -->
    <div class="mt-8 flex gap-6 text-gray-600 text-base">
      <a th:href="@{/auth/login}" class="hover:text-[#F5A5A5] transition-colors">로그인</a>
      <span class="text-gray-300">|</span>
      <a th:href="@{/auth/find-id}" class="hover:text-[#F5A5A5] transition-colors">아이디 찾기</a>
      <span class="text-gray-300">|</span>
      <a th:href="@{/signup/step1}" class="hover:text-[#F5A5A5] transition-colors">회원가입</a>
    </div>
  </div>

  <!-- 푸터 -->
  <footer class="py-6 bg-white border-t border-gray-200 text-center text-gray-500 text-sm">
    © 2026 Modam. All rights reserved.
  </footer>

  <script>
    lucide.createIcons();

    function toggleNewPassword() {
      const input = document.getElementById('newPassword');
      const icon = document.getElementById('newPwEyeIcon');
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      icon.setAttribute('data-lucide', isPassword ? 'eye-off' : 'eye');
      lucide.createIcons();
    }

    function toggleConfirmPassword() {
      const input = document.getElementById('newPasswordConfirm');
      const icon = document.getElementById('confirmPwEyeIcon');
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      icon.setAttribute('data-lucide', isPassword ? 'eye-off' : 'eye');
      lucide.createIcons();
    }

    const verifyForm = document.getElementById('verifyForm');
    if (verifyForm) {
      verifyForm.addEventListener('submit', function (e) {
        const userId = document.getElementById('verifyUserId');
        const email = document.getElementById('verifyEmail');
        const userIdError = document.getElementById('verifyUserIdError');
        const emailError = document.getElementById('verifyEmailError');
        let valid = true;

        if (!userId.value.trim()) {
          userIdError.classList.remove('hidden');
          userId.classList.add('border-red-500');
          userId.classList.remove('border-gray-200');
          valid = false;
        } else {
          userIdError.classList.add('hidden');
          userId.classList.remove('border-red-500');
          userId.classList.add('border-gray-200');
        }

        if (!email.value.trim()) {
          emailError.textContent = '❌ 이메일을 입력해주세요';
          emailError.classList.remove('hidden');
          email.classList.add('border-red-500');
          email.classList.remove('border-gray-200');
          valid = false;
        } else if (!/^[^\s@]+@[^\s@]+$/.test(email.value)) {
          emailError.textContent = '❌ 이메일 형식이 아닙니다 (@가 포함되어야 합니다)';
          emailError.classList.remove('hidden');
          email.classList.add('border-red-500');
          email.classList.remove('border-gray-200');
          valid = false;
        } else {
          emailError.classList.add('hidden');
          email.classList.remove('border-red-500');
          email.classList.add('border-gray-200');
        }

        if (!valid) e.preventDefault();
      });
    }

    const resetForm = document.getElementById('resetForm');
    if (resetForm) {
      resetForm.addEventListener('submit', function (e) {
        const newPw = document.getElementById('newPassword');
        const confirmPw = document.getElementById('newPasswordConfirm');
        const newPwError = document.getElementById('newPasswordError');
        const confirmPwError = document.getElementById('newPasswordConfirmError');
        let valid = true;

        if (!newPw.value) {
          newPwError.textContent = '❌ 비밀번호를 입력해주세요';
          newPwError.classList.remove('hidden');
          newPw.classList.add('border-red-500');
          newPw.classList.remove('border-gray-200');
          valid = false;
        } else if (newPw.value.length < 8) {
          newPwError.textContent = '❌ 8자 이상 입력해주세요';
          newPwError.classList.remove('hidden');
          newPw.classList.add('border-red-500');
          newPw.classList.remove('border-gray-200');
          valid = false;
        } else {
          newPwError.classList.add('hidden');
          newPw.classList.remove('border-red-500');
          newPw.classList.add('border-gray-200');
        }

        if (!confirmPw.value) {
          confirmPwError.textContent = '❌ 비밀번호 확인을 입력해주세요';
          confirmPwError.classList.remove('hidden');
          confirmPw.classList.add('border-red-500');
          confirmPw.classList.remove('border-gray-200');
          valid = false;
        } else if (newPw.value !== confirmPw.value) {
          confirmPwError.textContent = '❌ 비밀번호가 일치하지 않습니다';
          confirmPwError.classList.remove('hidden');
          confirmPw.classList.add('border-red-500');
          confirmPw.classList.remove('border-gray-200');
          valid = false;
        } else {
          confirmPwError.classList.add('hidden');
          confirmPw.classList.remove('border-red-500');
          confirmPw.classList.add('border-gray-200');
        }

        if (!valid) e.preventDefault();
      });
    }
  </script>
</body>
</html>
