<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카드 발급 - 배송 주소 - 모담</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body class="min-h-screen bg-[#FCE8E3] flex flex-col">

<th:block th:replace="~{common/layout/header-dashboard :: nav}"></th:block>

<div class="flex-1 flex flex-col items-center justify-center px-8 py-12">
  <div class="w-full max-w-2xl">
    <div class="text-center mb-10">
      <h1 class="text-4xl text-gray-800 mb-3">배송 주소 확인</h1>
      <p class="text-gray-600 text-lg">카드를 받으실 주소를 입력해주세요</p>
    </div>

    <div class="bg-white rounded-3xl shadow-lg p-8 mb-8">
      <div class="space-y-6">
        <div>
          <label class="block text-gray-800 mb-2 text-lg">수령인</label>
          <input type="text" id="recipientName" th:value="${user.name}" placeholder="수령인 이름을 입력하세요" oninput="checkCanProceed()" class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:border-[#F5A5A5] focus:outline-none transition-colors text-gray-800"/>
        </div>
        <div>
          <label class="block text-gray-800 mb-2 text-lg">주소</label>
          <input type="text" id="address" th:value="${user.address}" placeholder="배송받으실 주소를 입력하세요" oninput="checkCanProceed()" class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:border-[#F5A5A5] focus:outline-none transition-colors text-gray-800"/>
        </div>
        <div>
          <label class="block text-gray-800 mb-2 text-lg">연락처</label>
          <input type="tel" id="contactNumber" th:value="${user.phoneNo}" placeholder="연락처를 입력하세요" maxlength="13" oninput="formatPhone(this); checkCanProceed()" class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:border-[#F5A5A5] focus:outline-none transition-colors text-gray-800"/>
        </div>
        <div class="bg-[#FCE8E3] rounded-2xl p-5">
          <label class="flex items-center gap-3 cursor-pointer">
            <input type="checkbox" id="sameAsProfile" onchange="handleSameAsProfile(this)" class="w-5 h-5 rounded accent-[#F5A5A5]"/>
            <span class="text-gray-800">내 프로필 주소와 동일</span>
          </label>
        </div>
      </div>
    </div>

    <div class="flex gap-4">
      <a th:href="@{/mypage/card/step6}" class="flex-1 py-4 bg-white border-2 border-gray-300 text-gray-700 text-lg rounded-2xl hover:bg-gray-50 transition-colors flex items-center justify-center gap-2">
        <i data-lucide="chevron-left" class="w-5 h-5"></i><span>이전</span>
      </a>
      <button id="nextBtn" onclick="goNext()" disabled class="flex-1 py-4 text-lg rounded-2xl transition-all flex items-center justify-center gap-2 bg-gray-200 text-gray-400 cursor-not-allowed">
        <span>완료</span><i data-lucide="chevron-right" class="w-5 h-5"></i>
      </button>
    </div>
  </div>
</div>

<th:block th:replace="~{common/layout/footer :: footer}"></th:block>

<script th:inline="javascript">
  const serverUserName    = /*[[${user != null ? user.name : null}]]*/    null;
  const serverUserAddress = /*[[${user != null ? user.address : null}]]*/ null;
  const serverUserPhone   = /*[[${user != null ? user.phoneNo : null}]]*/ null;

  // 🔥 [추가됨] 전화번호 하이픈 템플릿 함수 선언
  function formatPhone(input) {
    const digits = input.value.replace(/[^0-9]/g, '').slice(0, 11);
    if (digits.length < 4)       input.value = digits;
    else if (digits.length < 8)  input.value = digits.slice(0, 3) + '-' + digits.slice(3);
    else                         input.value = digits.slice(0, 3) + '-' + digits.slice(3, 7) + '-' + digits.slice(7);
  }

  function handleSameAsProfile(checkbox) {
    const name    = serverUserName    || '';
    const address = serverUserAddress || '';
    const phone   = serverUserPhone   || '';
    const disabled = checkbox.checked;

    document.getElementById('recipientName').value = disabled ? name : '';
    document.getElementById('address').value       = disabled ? address : '';

    const phoneInput = document.getElementById('contactNumber');
    phoneInput.value = disabled ? phone : '';

    // 🔥 [추가됨] 체크박스로 프로필 정보를 가져올 때 즉각적인 하이픈 적용
    if (disabled && phoneInput.value) {
      formatPhone(phoneInput);
    }

    document.getElementById('recipientName').disabled = disabled;
    document.getElementById('address').disabled       = disabled;
    document.getElementById('contactNumber').disabled = disabled;
    checkCanProceed();
  }

  function checkCanProceed() {
    const name    = document.getElementById('recipientName').value.trim();
    const address = document.getElementById('address').value.trim();
    const contact = document.getElementById('contactNumber').value.trim();
    const canProceed = name && address && contact;
    const btn = document.getElementById('nextBtn');
    btn.disabled = !canProceed;
    btn.className = canProceed
      ? 'flex-1 py-4 text-lg rounded-2xl transition-all flex items-center justify-center gap-2 bg-[#F5A5A5] text-white hover:bg-[#F28B8B] shadow-md'
      : 'flex-1 py-4 text-lg rounded-2xl transition-all flex items-center justify-center gap-2 bg-gray-200 text-gray-400 cursor-not-allowed';
  }

  function goNext() {
    const name    = document.getElementById('recipientName').value.trim();
    const address = document.getElementById('address').value.trim();
    // 백엔드로 전송 시 하이픈 포함된 형태 그대로 전송(UI 표시 통일)
    const contact = document.getElementById('contactNumber').value.trim();

    if (name && address && contact) {
      const form = document.createElement('form');
      form.method = 'POST';
      form.action = '/mypage/card/step7';

      const csrf = document.createElement('input');
      csrf.type = 'hidden'; csrf.name = '_csrf'; csrf.value = /*[[${_csrf.token}]]*/ '';
      form.appendChild(csrf);

      const in1 = document.createElement('input'); in1.type = 'hidden'; in1.name = 'recipientName'; in1.value = name; form.appendChild(in1);
      const in2 = document.createElement('input'); in2.type = 'hidden'; in2.name = 'address'; in2.value = address; form.appendChild(in2);
      const in3 = document.createElement('input'); in3.type = 'hidden'; in3.name = 'contactNumber'; in3.value = contact; form.appendChild(in3);

      document.body.appendChild(form);
      form.submit();
    }
  }

  window.addEventListener('DOMContentLoaded', function() {
    // 🔥 [추가됨] 페이지 첫 렌더링 시에도 서버로부터 주입된 초기값 하이픈 렌더링 적용
    const phoneInput = document.getElementById('contactNumber');
    if (phoneInput && phoneInput.value) {
      formatPhone(phoneInput);
    }

    checkCanProceed();
    lucide.createIcons();
  });
</script>
<th:block th:replace="~{common/layout/header-dashboard :: scripts}"></th:block>
</body>
</html>
