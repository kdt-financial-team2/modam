<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카드 발급 - 배송 주소 - 모담</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-[#FCE8E3] flex flex-col">

  <!-- ===== 헤더 ===== -->
  <nav class="sticky top-0 z-30 bg-white/80 backdrop-blur border-b border-gray-100">
    <div class="w-full max-w-[1440px] mx-auto px-8 h-24 flex items-center justify-between">
      <a th:href="@{/}" href="/" class="flex-shrink-0 hover:opacity-80 transition-opacity">
        <div class="flex items-center gap-2">
          <div class="w-10 h-10 bg-gradient-to-br from-[#F5A5A5] to-[#F28B8B] rounded-2xl flex items-center justify-center shadow-md">
            <i data-lucide="heart" class="w-6 h-6 text-white"></i>
          </div>
          <span class="text-2xl font-bold text-gray-900">모담</span>
        </div>
      </a>
    </div>
  </nav>

  <!-- ===== 메인 콘텐츠 ===== -->
  <div class="flex-1 flex flex-col items-center justify-center px-8 py-12">
    <div class="w-full max-w-2xl">

      <!-- 타이틀 -->
      <div class="text-center mb-10">
        <h1 class="text-4xl text-gray-800 mb-3">배송 주소 확인</h1>
        <p class="text-gray-600 text-lg">카드를 받으실 주소를 입력해주세요</p>
      </div>

      <!-- 폼 -->
      <div class="bg-white rounded-3xl shadow-lg p-8 mb-8">
        <div class="space-y-6">
          <div>
            <label class="block text-gray-800 mb-2 text-lg">수령인</label>
            <input type="text" id="recipientName"
                   th:value="${user.name}"
                   placeholder="수령인 이름을 입력하세요"
                   oninput="checkCanProceed()"
                   class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:border-[#F5A5A5] focus:outline-none transition-colors text-gray-800"/>
          </div>
          <div>
            <label class="block text-gray-800 mb-2 text-lg">주소</label>
            <input type="text" id="address"
                   th:value="${user.address}"
                   placeholder="배송받으실 주소를 입력하세요"
                   oninput="checkCanProceed()"
                   class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:border-[#F5A5A5] focus:outline-none transition-colors text-gray-800"/>
          </div>
          <div>
            <label class="block text-gray-800 mb-2 text-lg">연락처</label>
            <input type="tel" id="contactNumber"
                   th:value="${user.phone}"
                   placeholder="연락처를 입력하세요"
                   oninput="this.value=this.value.replace(/[^0-9]/g,''); checkCanProceed()"
                   class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:border-[#F5A5A5] focus:outline-none transition-colors text-gray-800"/>
          </div>
          <div class="bg-[#FCE8E3] rounded-2xl p-5">
            <label class="flex items-center gap-3 cursor-pointer">
              <input type="checkbox" id="sameAsProfile" onchange="handleSameAsProfile(this)"
                     class="w-5 h-5 rounded accent-[#F5A5A5]"/>
              <span class="text-gray-800">내 프로필 주소와 동일</span>
            </label>
          </div>
        </div>
      </div>

      <!-- 버튼 -->
      <div class="flex gap-4">
        <a th:href="@{/card-step6}" href="card-step6.html"
           class="flex-1 py-4 bg-white border-2 border-gray-300 text-gray-700 text-lg rounded-2xl hover:bg-gray-50 transition-colors flex items-center justify-center gap-2">
          <i data-lucide="chevron-left" class="w-5 h-5"></i><span>이전</span>
        </a>
        <button id="nextBtn" onclick="goNext()" disabled
                class="flex-1 py-4 text-lg rounded-2xl transition-all flex items-center justify-center gap-2 bg-gray-200 text-gray-400 cursor-not-allowed">
          <span>완료</span><i data-lucide="chevron-right" class="w-5 h-5"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- ===== 푸터 ===== -->
  <th:block th:replace="~{common/layout/footer :: footer}"></th:block>

  <script th:inline="javascript">
    const serverUserName    = /*[[${user != null ? user.name : null}]]*/    null;
    const serverUserAddress = /*[[${user != null ? user.address : null}]]*/ null;
    const serverUserPhone   = /*[[${user != null ? user.phone : null}]]*/   null;

    function handleSameAsProfile(checkbox) {
      const name    = serverUserName    || localStorage.getItem('userName') || '';
      const address = serverUserAddress || localStorage.getItem('userAddress') || '';
      const phone   = serverUserPhone   || localStorage.getItem('userPhone') || '';
      const disabled = checkbox.checked;
      document.getElementById('recipientName').value   = disabled ? name    : '';
      document.getElementById('address').value         = disabled ? address : '';
      document.getElementById('contactNumber').value   = disabled ? phone   : '';
      document.getElementById('recipientName').disabled   = disabled;
      document.getElementById('address').disabled         = disabled;
      document.getElementById('contactNumber').disabled   = disabled;
      checkCanProceed();
    }

    function checkCanProceed() {
      const name    = document.getElementById('recipientName').value.trim();
      const address = document.getElementById('address').value.trim();
      const contact = document.getElementById('contactNumber').value.trim();
      const canProceed = name && address && contact;
      const btn = document.getElementById('nextBtn');
      btn.disabled = !canProceed;
      btn.className = canProceed
        ? 'flex-1 py-4 text-lg rounded-2xl transition-all flex items-center justify-center gap-2 bg-[#F5A5A5] text-white hover:bg-[#F28B8B] shadow-md'
        : 'flex-1 py-4 text-lg rounded-2xl transition-all flex items-center justify-center gap-2 bg-gray-200 text-gray-400 cursor-not-allowed';
    }

    function goNext() {
      const name    = document.getElementById('recipientName').value.trim();
      const address = document.getElementById('address').value.trim();
      const contact = document.getElementById('contactNumber').value.trim();
      if (name && address && contact) {
        localStorage.setItem('cardRecipient', name);
        localStorage.setItem('cardAddress',   address);
        localStorage.setItem('cardContact',   contact);
        window.location.href = 'card-step8.html';
      }
    }

    window.addEventListener('DOMContentLoaded', function() {
      // 서버 데이터 없을 때 localStorage 초기값
      if (serverUserName === null) {
        const el = document.getElementById('recipientName');
        if (!el.value) el.value = localStorage.getItem('userName') || '';
      }
      checkCanProceed();
      lucide.createIcons();
    });
  </script>
</body>
</html>
