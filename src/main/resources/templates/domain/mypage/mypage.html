<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>마이페이지 - 모담</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen flex flex-col bg-white">
  <div th:replace="~{common/layout/header :: nav}"></div>

  <main class="flex-1 w-full max-w-[1440px] mx-auto bg-gray-50">
    <div class="px-8 py-12">
      <h1 class="text-4xl font-bold text-gray-900 mb-10">마이페이지</h1>

      <div class="grid grid-cols-3 gap-8">
        <!-- 프로필 카드 -->
        <div class="col-span-1 space-y-6">
          <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-8 text-center">
            <div class="w-24 h-24 rounded-full bg-gradient-to-br from-[#F5A5A5] to-[#FFB8B8] flex items-center justify-center mx-auto mb-4">
              <i data-lucide="user" class="w-12 h-12 text-white"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-900 mb-1" th:text="${user.name}">이름</h2>
            <p class="text-gray-500" th:text="${user.email}">이메일</p>
            <div class="mt-4 pt-4 border-t border-gray-100">
              <div class="flex justify-center gap-6 text-sm">
                <div class="text-center">
                  <p class="font-bold text-[#F5A5A5] text-xl" th:text="${#numbers.formatInteger(couplePoints, 0, 'COMMA')}">0</p>
                  <p class="text-gray-500">포인트</p>
                </div>
                <div class="text-center">
                  <p class="font-bold text-gray-900 text-xl" th:text="${daysTogether}">0</p>
                  <p class="text-gray-500">함께한 날</p>
                </div>
              </div>
            </div>
          </div>

          <!-- 빠른 링크 -->
          <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-6 space-y-2">
            <a th:href="@{/point-shop}" class="flex items-center gap-3 p-3 rounded-xl hover:bg-[#FFF7F5] transition-colors">
              <i data-lucide="gift" class="w-5 h-5 text-[#F5A5A5]"></i>
              <span class="text-gray-700">포인트샵</span>
              <i data-lucide="chevron-right" class="w-4 h-4 text-gray-400 ml-auto"></i>
            </a>
            <a th:href="@{/savings}" class="flex items-center gap-3 p-3 rounded-xl hover:bg-[#FFF7F5] transition-colors">
              <i data-lucide="piggy-bank" class="w-5 h-5 text-[#F5A5A5]"></i>
              <span class="text-gray-700">저축 목표</span>
              <i data-lucide="chevron-right" class="w-4 h-4 text-gray-400 ml-auto"></i>
            </a>
            <a th:href="@{/theme-settings}" class="flex items-center gap-3 p-3 rounded-xl hover:bg-[#FFF7F5] transition-colors">
              <i data-lucide="palette" class="w-5 h-5 text-[#F5A5A5]"></i>
              <span class="text-gray-700">테마 설정</span>
              <i data-lucide="chevron-right" class="w-4 h-4 text-gray-400 ml-auto"></i>
            </a>
          </div>
        </div>

        <!-- 상세 정보 -->
        <div class="col-span-2 space-y-6">
          <!-- 개인 정보 -->
          <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-8">
            <div class="flex items-center justify-between mb-6">
              <h3 class="text-xl font-bold text-gray-900">개인 정보</h3>
              <a th:href="@{/mypage/edit}" class="text-sm text-[#F5A5A5] hover:text-[#F28B8B] transition-colors">수정</a>
            </div>
            <div class="grid grid-cols-2 gap-4">
              <div class="bg-gray-50 rounded-xl p-4">
                <p class="text-xs text-gray-500 mb-1">이름</p>
                <p class="font-medium text-gray-900" th:text="${user.name}">이름</p>
              </div>
              <div class="bg-gray-50 rounded-xl p-4">
                <p class="text-xs text-gray-500 mb-1">아이디</p>
                <p class="font-medium text-gray-900" th:text="${user.userId}">아이디</p>
              </div>
              <div class="bg-gray-50 rounded-xl p-4">
                <p class="text-xs text-gray-500 mb-1">이메일</p>
                <p class="font-medium text-gray-900" th:text="${user.email}">이메일</p>
              </div>
              <div class="bg-gray-50 rounded-xl p-4">
                <p class="text-xs text-gray-500 mb-1">휴대폰</p>
                <p class="font-medium text-gray-900" th:text="${user.phone}">전화번호</p>
              </div>
              <div class="bg-gray-50 rounded-xl p-4 col-span-2">
                <p class="text-xs text-gray-500 mb-1">주소</p>
                <p class="font-medium text-gray-900" th:text="${user.address}">주소</p>
              </div>
            </div>
          </div>

          <!-- 연결된 계좌 -->
          <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-8">
            <h3 class="text-xl font-bold text-gray-900 mb-6">연결된 계좌</h3>
            <div class="bg-gradient-to-r from-[#FCE8E3] to-[#FFE4E8] rounded-2xl p-6 flex items-center justify-between">
              <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-white rounded-xl flex items-center justify-center shadow-sm">
                  <i data-lucide="credit-card" class="w-6 h-6 text-[#F5A5A5]"></i>
                </div>
                <div>
                  <p class="font-semibold text-gray-900" th:text="${user.bankName}">은행명</p>
                  <p class="text-gray-600" th:text="${user.accountNumber}">계좌번호</p>
                </div>
              </div>
              <div class="text-right">
                <p class="text-sm text-gray-600">잔액</p>
                <p class="text-xl font-bold text-gray-900">₩<span th:text="${#numbers.formatInteger(user.accountBalance, 0, 'COMMA')}">0</span></p>
              </div>
            </div>
          </div>

          <!-- 계정 관리 -->
          <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-8">
            <h3 class="text-xl font-bold text-gray-900 mb-6">계정 관리</h3>
            <div class="space-y-3">
              <a th:href="@{/mypage/change-password}" class="flex items-center justify-between p-4 rounded-xl hover:bg-gray-50 transition-colors">
                <div class="flex items-center gap-3">
                  <i data-lucide="lock" class="w-5 h-5 text-gray-500"></i>
                  <span class="text-gray-700">비밀번호 변경</span>
                </div>
                <i data-lucide="chevron-right" class="w-4 h-4 text-gray-400"></i>
              </a>
              <a th:href="@{/mypage/notification-settings}" class="flex items-center justify-between p-4 rounded-xl hover:bg-gray-50 transition-colors">
                <div class="flex items-center gap-3">
                  <i data-lucide="bell" class="w-5 h-5 text-gray-500"></i>
                  <span class="text-gray-700">알림 설정</span>
                </div>
                <i data-lucide="chevron-right" class="w-4 h-4 text-gray-400"></i>
              </a>
              <div class="border-t pt-3">
                <button onclick="document.getElementById('withdrawModal').classList.remove('hidden')"
                        class="flex items-center gap-3 p-4 text-red-500 hover:bg-red-50 rounded-xl transition-colors w-full">
                  <i data-lucide="user-x" class="w-5 h-5"></i>
                  <span>회원 탈퇴</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- 회원 탈퇴 모달 -->
  <div id="withdrawModal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-[440px] p-8">
      <h2 class="text-2xl font-bold text-gray-900 mb-2">정말 탈퇴하시겠습니까?</h2>
      <p class="text-gray-600 mb-8">탈퇴 시 모든 데이터가 삭제됩니다</p>
      <div class="flex gap-3">
        <button onclick="document.getElementById('withdrawModal').classList.add('hidden')"
                class="flex-1 py-4 bg-gray-100 text-gray-700 rounded-xl hover:bg-gray-200 transition-colors">취소</button>
        <form th:action="@{/mypage/withdraw}" method="post" class="flex-1">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit" class="w-full py-4 bg-red-400 text-white rounded-xl hover:bg-red-500 transition-colors">탈퇴하기</button>
        </form>
      </div>
    </div>
  </div>

  <div th:replace="~{common/layout/footer :: footer}"></div>
  <script>lucide.createIcons();</script>
</body>
</html>
