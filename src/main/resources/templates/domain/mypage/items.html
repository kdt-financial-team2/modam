<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아이템 관리 - 모담</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-[#FAFAFA] flex flex-col">

<th:block th:replace="~{common/layout/header-dashboard :: nav}"></th:block>

<div class="flex flex-1">

    <th:block th:replace="~{common/layout/mypage-sidebar :: sidebar('items')}"></th:block>

    <main class="flex-1 p-8 overflow-y-auto">
        <div id="section-items" class="max-w-4xl">
            <h1 class="text-2xl font-bold text-gray-800 mb-8">아이템 관리</h1>

            <div th:if="${successMsg}" class="mb-6 p-4 bg-green-50 border border-green-200 text-green-700 rounded-xl flex items-center gap-2">
                <i data-lucide="check-circle" class="w-5 h-5"></i>
                <span th:text="${successMsg}"></span>
            </div>
            <div th:if="${errorMsg}" class="mb-6 p-4 bg-red-50 border border-red-200 text-red-700 rounded-xl flex items-center gap-2">
                <i data-lucide="alert-circle" class="w-5 h-5"></i>
                <span th:text="${errorMsg}"></span>
            </div>

            <div class="flex gap-4 border-b border-gray-200 mb-8">
                <button onclick="switchItemTab('theme')" id="tab-theme" class="pb-3 px-2 text-lg font-bold text-gray-900 border-b-2 border-gray-900 transition-colors">테마 설정</button>
                <button onclick="switchItemTab('emoticon')" id="tab-emoticon" class="pb-3 px-2 text-lg font-medium text-gray-400 hover:text-gray-600 transition-colors border-b-2 border-transparent">보유 이모티콘</button>
            </div>

            <div id="content-theme" class="space-y-6">
                <h2 class="text-lg font-bold text-gray-800 mb-4">보유 중인 테마</h2>
                <div class="grid grid-cols-2 md:grid-cols-3 gap-4" id="themeContainer">
                </div>
            </div>

            <div id="content-emoticon" class="hidden space-y-6">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-bold text-gray-800">내 이모티콘 보관함</h2>
                    <span class="text-sm text-gray-500 font-medium bg-gray-100 px-3 py-1 rounded-full">총 <span id="emoticonCount">0</span>개</span>
                </div>
                <div class="grid grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4" id="emoticonContainer">
                </div>
            </div>

        </div>
    </main>
</div>

<th:block th:replace="~{common/layout/footer :: footer}"></th:block>

<script th:inline="javascript">
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      renderItems();
    });

    // 서버에서 전달받은 진짜 인벤토리 데이터 (없으면 빈 배열)
    const serverThemes = /*[[${purchasedThemes != null ? purchasedThemes : '[]'}]]*/ [];
    const serverEmoticons = /*[[${purchasedEmoticons != null ? purchasedEmoticons : '[]'}]]*/ [];

    function equipItem(invId) {
        if(!confirm('해당 아이템을 장착하시겠습니까?')) return;

        const form = document.createElement('form');
        form.method = 'POST';
        form.action = '/mypage/items/equip';

        const csrf = document.createElement('input');
        csrf.type = 'hidden';
        csrf.name = '_csrf';
        csrf.value = /*[[${_csrf.token}]]*/ '';
        form.appendChild(csrf);

        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = 'itemId';
        input.value = invId;
        form.appendChild(input);

        document.body.appendChild(form);
        form.submit();
    }

    function switchItemTab(tab) {
        const tBtn = document.getElementById('tab-theme');
        const eBtn = document.getElementById('tab-emoticon');
        const tContent = document.getElementById('content-theme');
        const eContent = document.getElementById('content-emoticon');

        if(tab === 'theme') {
            tBtn.className = "pb-3 px-2 text-lg font-bold text-gray-900 border-b-2 border-gray-900 transition-colors";
            eBtn.className = "pb-3 px-2 text-lg font-medium text-gray-400 hover:text-gray-600 transition-colors border-b-2 border-transparent";
            tContent.classList.remove('hidden');
            eContent.classList.add('hidden');
        } else {
            eBtn.className = "pb-3 px-2 text-lg font-bold text-gray-900 border-b-2 border-gray-900 transition-colors";
            tBtn.className = "pb-3 px-2 text-lg font-medium text-gray-400 hover:text-gray-600 transition-colors border-b-2 border-transparent";
            eContent.classList.remove('hidden');
            tContent.classList.add('hidden');
        }
    }

    // 아이템 렌더링 함수
    function renderItems() {
        // 테마 렌더링
        const tContainer = document.getElementById('themeContainer');
        if (serverThemes.length === 0) {
            tContainer.innerHTML = `
                <div class="col-span-full py-12 text-center bg-white rounded-3xl border border-dashed border-gray-200">
                    <div class="w-16 h-16 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-3">
                        <i data-lucide="palette" class="w-8 h-8 text-gray-300"></i>
                    </div>
                    <p class="text-gray-500 font-medium">보유 중인 테마가 없습니다.</p>
                    <a href="/point-shop" class="inline-block mt-4 text-sm text-[#F5A5A5] hover:text-[#F28B8B] font-bold">상점 둘러보기 →</a>
                </div>
            `;
        } else {
            tContainer.innerHTML = serverThemes.map(t => {
                const isApplied = t.isApplied;
                const statusBadge = isApplied
                    ? `<div class="absolute top-3 right-3 px-3 py-1 bg-gray-900 text-white text-xs font-bold rounded-full shadow-md z-10">사용 중</div>`
                    : '';
                const clickAction = isApplied ? '' : `onclick="equipItem(${t.id})"`;
                const hoverClass = isApplied ? '' : 'hover:-translate-y-1 hover:shadow-lg cursor-pointer';
                const ringClass = isApplied ? 'ring-2 ring-gray-900' : 'border border-gray-100';

                return `
                    <div class="relative bg-white rounded-3xl overflow-hidden transition-all duration-300 ${hoverClass} ${ringClass}" ${clickAction}>
                        ${statusBadge}
                        <div class="h-32 p-4 bg-gray-50 flex items-center justify-center text-4xl">
                            ${t.image || '🎨'}
                        </div>
                        <div class="p-5">
                            <h3 class="font-bold text-gray-800 text-lg mb-1">${t.name}</h3>
                            <p class="text-xs text-gray-500 font-medium">구매일: ${t.purchaseDate || '알 수 없음'}</p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 이모티콘 렌더링
        const eContainer = document.getElementById('emoticonContainer');
        document.getElementById('emoticonCount').textContent = serverEmoticons.length;

        if (serverEmoticons.length === 0) {
            eContainer.innerHTML = `
                <div class="col-span-full py-12 text-center bg-white rounded-3xl border border-dashed border-gray-200">
                    <div class="w-16 h-16 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-3">
                        <i data-lucide="smile" class="w-8 h-8 text-gray-300"></i>
                    </div>
                    <p class="text-gray-500 font-medium">보유 중인 이모티콘이 없습니다.</p>
                    <a href="/point-shop" class="inline-block mt-4 text-sm text-[#F5A5A5] hover:text-[#F28B8B] font-bold">상점 둘러보기 →</a>
                </div>
            `;
        } else {
            eContainer.innerHTML = serverEmoticons.map(e => `
                <div class="bg-white border border-gray-100 rounded-2xl p-5 aspect-square flex flex-col items-center justify-center hover:scale-105 transition-transform cursor-pointer shadow-sm">
                    <div class="text-5xl mb-3">${e.image || '😀'}</div>
                    <p class="text-xs text-gray-800 text-center font-bold px-2 line-clamp-1">${e.name}</p>
                    <p class="text-[10px] text-gray-400 mt-1">${e.purchaseDate || ''}</p>
                </div>
            `).join('');
        }
        lucide.createIcons();
    }
</script>
<th:block th:replace="~{common/layout/header-dashboard :: scripts}"></th:block>
</body>
</html>
