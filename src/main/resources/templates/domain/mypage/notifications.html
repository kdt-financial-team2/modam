<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>알림 설정 - 모담</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-[#FAFAFA] flex flex-col">

<th:block th:replace="~{common/layout/header :: nav}"></th:block>

<div class="flex flex-1">

    <th:block th:replace="~{common/layout/mypage-sidebar :: sidebar('notifications')}"></th:block>

    <main class="flex-1 p-8 overflow-y-auto">
        <div id="section-notifications" class="max-w-4xl">
            <h1 class="text-2xl font-bold text-gray-800 mb-8">알림 설정</h1>

            <form th:action="@{/mypage/notifications/update}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <input type="hidden" name="depositAlert" id="valDeposit" th:value="${noti != null ? noti.notiDeposit : 'Y'}">
                <input type="hidden" name="withdrawalAlert" id="valWithdrawal" th:value="${noti != null ? noti.notiWithdrawal : 'Y'}">
                <input type="hidden" name="weeklyReport" id="valWeekly" th:value="${noti != null ? noti.notiWeekly : 'Y'}">
                <input type="hidden" name="monthlyReport" id="valMonthly" th:value="${noti != null ? noti.notiMonthly : 'Y'}">

                <div class="bg-gradient-to-r from-[#FCE8E3] to-[#FFE4E8] rounded-3xl shadow-sm p-8 mb-6">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-4">
                            <div class="w-14 h-14 bg-white rounded-full flex items-center justify-center">
                                <i data-lucide="bell" class="w-7 h-7 text-[#F5A5A5]"></i>
                            </div>
                            <div>
                                <h2 class="text-xl font-bold text-gray-800">모든 알림 받기</h2>
                                <p class="text-sm text-gray-600 mt-1">모든 알림을 한 번에 켜거나 끌 수 있습니다</p>
                            </div>
                        </div>
                        <button type="button" id="toggleAll" onclick="toggleMasterNotification()"
                                class="relative w-16 h-9 rounded-full transition-colors duration-300 bg-[#F5A5A5]">
                            <div id="thumbAll" class="absolute top-1 left-1 w-7 h-7 bg-white rounded-full shadow-md transition-transform duration-300 translate-x-7"></div>
                        </button>
                    </div>
                </div>

                <div class="bg-white rounded-3xl shadow-sm p-8 mb-6">
                    <div class="flex items-center gap-3 mb-6">
                        <i data-lucide="credit-card" class="w-6 h-6 text-[#F5A5A5]"></i>
                        <h2 class="text-xl font-bold text-gray-800">거래 알림</h2>
                    </div>
                    <div class="space-y-5">
                        <div class="flex items-center justify-between py-4 border-b border-gray-100">
                            <div class="flex items-center gap-3">
                                <i data-lucide="arrow-down-circle" class="w-5 h-5 text-green-500"></i>
                                <div>
                                    <h3 class="text-gray-800 font-medium">입금 알림</h3>
                                    <p class="text-sm text-gray-500 mt-1">입금 시 알림을 받습니다</p>
                                </div>
                            </div>
                            <button type="button" id="toggleDeposit" onclick="toggleNotification('deposit')"
                                    class="relative w-14 h-8 rounded-full transition-colors duration-300 bg-[#FCE8E3]">
                                <div id="thumbDeposit" class="absolute top-1 left-1 w-6 h-6 bg-white rounded-full shadow-md transition-transform duration-300 translate-x-6"></div>
                            </button>
                        </div>
                        <div class="flex items-center justify-between py-4">
                            <div class="flex items-center gap-3">
                                <i data-lucide="arrow-up-circle" class="w-5 h-5 text-red-500"></i>
                                <div>
                                    <h3 class="text-gray-800 font-medium">출금 알림</h3>
                                    <p class="text-sm text-gray-500 mt-1">출금 시 알림을 받습니다</p>
                                </div>
                            </div>
                            <button type="button" id="toggleWithdrawal" onclick="toggleNotification('withdrawal')"
                                    class="relative w-14 h-8 rounded-full transition-colors duration-300 bg-[#FCE8E3]">
                                <div id="thumbWithdrawal" class="absolute top-1 left-1 w-6 h-6 bg-white rounded-full shadow-md transition-transform duration-300 translate-x-6"></div>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-3xl shadow-sm p-8 mb-6">
                    <div class="flex items-center gap-3 mb-6">
                        <i data-lucide="bar-chart-3" class="w-6 h-6 text-[#F5A5A5]"></i>
                        <h2 class="text-xl font-bold text-gray-800">소비 리포트</h2>
                    </div>
                    <div class="space-y-5">
                        <div class="flex items-center justify-between py-4 border-b border-gray-100">
                            <div class="flex items-center gap-3">
                                <i data-lucide="bar-chart-3" class="w-5 h-5 text-purple-500"></i>
                                <div>
                                    <h3 class="text-gray-800 font-medium">주간 소비 리포트</h3>
                                    <p class="text-sm text-gray-500 mt-1">매주 소비 내역을 요약해서 알려드립니다</p>
                                </div>
                            </div>
                            <button type="button" id="toggleWeekly" onclick="toggleNotification('weekly')"
                                    class="relative w-14 h-8 rounded-full transition-colors duration-300 bg-[#FCE8E3]">
                                <div id="thumbWeekly" class="absolute top-1 left-1 w-6 h-6 bg-white rounded-full shadow-md transition-transform duration-300 translate-x-6"></div>
                            </button>
                        </div>
                        <div class="flex items-center justify-between py-4">
                            <div class="flex items-center gap-3">
                                <i data-lucide="bar-chart-3" class="w-5 h-5 text-indigo-500"></i>
                                <div>
                                    <h3 class="text-gray-800 font-medium">월간 소비 리포트</h3>
                                    <p class="text-sm text-gray-500 mt-1">매달 소비 패턴을 분석해서 알려드립니다</p>
                                </div>
                            </div>
                            <button type="button" id="toggleMonthly" onclick="toggleNotification('monthly')"
                                    class="relative w-14 h-8 rounded-full transition-colors duration-300 bg-[#FCE8E3]">
                                <div id="thumbMonthly" class="absolute top-1 left-1 w-6 h-6 bg-white rounded-full shadow-md transition-transform duration-300 translate-x-6"></div>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="flex justify-end">
                    <button type="submit" class="px-8 py-4 bg-gray-800 text-white rounded-xl hover:bg-gray-700 transition-colors font-medium">설정 내용 저장하기</button>
                </div>
            </form>
        </div>
    </main>
</div>

<th:block th:replace="~{common/layout/footer :: footer}"></th:block>

<script>
    window.addEventListener('DOMContentLoaded', () => {
      initNotificationUI();
      lucide.createIcons();
    });

    let allNotifications = true;

    function toggleMasterNotification() {
      allNotifications = !allNotifications;
      const btn = document.getElementById('toggleAll');
      const thumb = document.getElementById('thumbAll');
      if (allNotifications) {
        btn.classList.remove('bg-gray-300'); btn.classList.add('bg-[#F5A5A5]');
        thumb.classList.remove('translate-x-0'); thumb.classList.add('translate-x-7');
        ['deposit','withdrawal','weekly','monthly'].forEach(k => {
          document.getElementById('val' + k.charAt(0).toUpperCase() + k.slice(1)).value = 'Y';
          updateSubToggle(k, true);
        });
      } else {
        btn.classList.remove('bg-[#F5A5A5]'); btn.classList.add('bg-gray-300');
        thumb.classList.remove('translate-x-7'); thumb.classList.add('translate-x-0');
        ['deposit','withdrawal','weekly','monthly'].forEach(k => {
          document.getElementById('val' + k.charAt(0).toUpperCase() + k.slice(1)).value = 'N';
          updateSubToggle(k, false);
        });
      }
    }

    function toggleNotification(key) {
      const cap = key.charAt(0).toUpperCase() + key.slice(1);
      const inputEl = document.getElementById('val' + cap);
      const newState = (inputEl.value === 'N'); // 토글
      inputEl.value = newState ? 'Y' : 'N';
      updateSubToggle(key, newState);
    }

    function updateSubToggle(key, enabled) {
      const cap = key.charAt(0).toUpperCase() + key.slice(1);
      const btn = document.getElementById('toggle' + cap);
      const thumb = document.getElementById('thumb' + cap);
      if (!btn) return;
      if (enabled) {
        btn.classList.remove('bg-gray-300'); btn.classList.add('bg-[#FCE8E3]');
        thumb.classList.remove('translate-x-0'); thumb.classList.add('translate-x-6');
      } else {
        btn.classList.remove('bg-[#FCE8E3]'); btn.classList.add('bg-gray-300');
        thumb.classList.remove('translate-x-6'); thumb.classList.add('translate-x-0');
      }
    }

    function initNotificationUI() {
      ['deposit','withdrawal','weekly','monthly'].forEach(key => {
        const cap = key.charAt(0).toUpperCase() + key.slice(1);
        const val = document.getElementById('val' + cap).value;
        updateSubToggle(key, val === 'Y');
      });
    }
</script>
<th:block th:replace="~{common/layout/header :: scripts}"></th:block>
</body>
</html>
