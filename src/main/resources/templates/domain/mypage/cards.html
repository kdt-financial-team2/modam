<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카드 관리 - 모담</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-[#FAFAFA] flex flex-col">

<th:block th:replace="~{common/layout/header :: nav}"></th:block>

<div class="flex flex-1">

  <th:block th:replace="~{common/layout/mypage-sidebar :: sidebar('cards')}"></th:block>

  <main class="flex-1 p-8 overflow-y-auto">
    <div class="max-w-4xl">
      <h1 class="text-2xl text-gray-800 mb-8">카드 관리</h1>

      <div id="cardNotIssued" th:if="${!cardIssued}">
        <div class="bg-gradient-to-r from-[#FCE8E3] to-[#FFE4E8] rounded-3xl shadow-sm p-8 mb-6">
          <div class="flex items-center justify-between">
            <div>
              <h2 class="text-xl text-gray-800 mb-2">새 카드 발급</h2>
              <p class="text-gray-600">모담 체크카드를 발급받으세요</p>
            </div>
            <a th:href="@{/mypage/card/step1}" class="px-8 py-3 bg-[#F5A5A5] text-white rounded-2xl hover:bg-[#F28B8B] transition-colors shadow-md flex items-center gap-2">
              <i data-lucide="credit-card" class="w-5 h-5"></i>
              <span>카드 발급하기</span>
            </a>
          </div>
        </div>
        <div class="bg-white rounded-3xl shadow-sm p-8">
          <h2 class="text-lg text-gray-800 mb-6">등록된 카드</h2>
          <div class="text-center py-12">
            <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
              <i data-lucide="credit-card" class="w-10 h-10 text-gray-400"></i>
            </div>
            <p class="text-gray-500 mb-4">등록된 카드가 없습니다</p>
            <a th:href="@{/mypage/card/step1}" class="px-6 py-2 bg-[#FCE8E3] text-gray-800 rounded-xl hover:bg-[#FBD5CE] transition-colors">첫 카드 발급하기</a>
          </div>
        </div>
      </div>

      <div id="cardIssued" th:if="${cardIssued}">
        <div id="cardStatusBanner" class="rounded-3xl p-6 mb-6 border-2 bg-green-50 border-green-200">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
              <span id="cardStatusIcon" class="text-3xl">✅</span>
              <div>
                <p id="cardStatusTitle" class="text-lg text-gray-800 mb-1">모든 기능 사용 가능</p>
                <p id="cardStatusDesc" class="text-sm text-gray-600">정상 작동 중입니다</p>
              </div>
            </div>
            <span id="cardStatusBadge" class="px-4 py-2 bg-green-50 text-green-600 rounded-xl text-sm flex items-center gap-2">
                <div class="w-2 h-2 bg-green-500 rounded-full"></div>정상
              </span>
          </div>
        </div>

        <div class="bg-white rounded-3xl shadow-sm p-8 mb-6">
          <div class="flex items-center justify-between mb-6">
            <h2 class="text-lg text-gray-800">내 카드</h2>
            <span id="cardStatusBadge2" class="px-4 py-2 bg-green-50 text-green-600 rounded-xl text-sm flex items-center gap-2">
                <div class="w-2 h-2 bg-green-500 rounded-full"></div>정상
              </span>
          </div>
          <div class="flex gap-6">
            <div id="cardVisual" class="rounded-2xl shadow-lg p-6 w-80 aspect-[3/2] flex flex-col justify-between relative flex-shrink-0">
              <div id="cardOverlay" class="hidden absolute inset-0 bg-black/20 rounded-2xl flex items-center justify-center">
                <div class="bg-white/90 px-6 py-3 rounded-xl">
                  <p id="cardOverlayText" class="text-gray-800 font-semibold">일시 정지</p>
                </div>
              </div>
              <div class="flex justify-end">
                <i data-lucide="heart" class="w-10 h-10 text-white fill-white"></i>
              </div>
              <div class="text-left">
                <p class="text-white text-xs mb-2 opacity-80">MODAM CARD</p>
                <p id="cardNumber" class="text-white text-lg mb-4 tracking-wider">**** **** **** 3456</p>
                <div class="flex justify-between items-end">
                  <div>
                    <p class="text-white text-xs opacity-80 mb-1">CARD HOLDER</p>
                    <p id="cardHolderName" class="text-white" th:text="${userName}">김민수</p>
                  </div>
                  <div class="text-right">
                    <p class="text-white text-xs opacity-80">VALID THRU</p>
                    <p class="text-white text-sm">12/29</p>
                  </div>
                </div>
              </div>
            </div>
            <div class="flex-1 space-y-4">
              <div class="bg-[#FAFAFA] rounded-2xl p-5">
                <p class="text-sm text-gray-600 mb-1">카드 타입</p>
                <p id="cardTypeName" class="text-lg text-gray-800">국내전용</p>
              </div>
              <div class="bg-[#FAFAFA] rounded-2xl p-5">
                <div class="flex items-center justify-between mb-1">
                  <p class="text-sm text-gray-600">카드번호</p>
                  <button onclick="toggleCardNumber()" class="text-sm text-[#F5A5A5] hover:underline flex items-center gap-1">
                    <i data-lucide="eye" id="eyeCardNum" class="w-4 h-4"></i>
                    <span id="cardNumLabel">전체 보기</span>
                  </button>
                </div>
                <p id="cardNumDisplay" class="text-lg text-gray-800 font-mono">**** **** **** 3456</p>
                <p id="cardNumHint" class="text-xs text-gray-500 mt-2">🔒 타인에게 공유하지 마세요</p>
              </div>
              <div class="bg-[#FAFAFA] rounded-2xl p-5">
                <div class="flex items-center justify-between">
                  <div>
                    <p class="text-sm text-gray-600 mb-1">유효기간</p>
                    <p class="text-lg text-gray-800">12/29</p>
                  </div>
                  <div>
                    <div class="flex items-center gap-2 mb-1">
                      <p class="text-sm text-gray-600">CVV</p>
                      <button onclick="toggleCVV()" class="text-sm text-[#F5A5A5] hover:underline">
                        <i data-lucide="eye" id="eyeCvv" class="w-4 h-4"></i>
                      </button>
                    </div>
                    <p id="cvvDisplay" class="text-lg text-gray-800 font-mono">***</p>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="mt-6" id="cardActions">
            <div id="actionsActive" class="grid grid-cols-3 gap-4">
              <button class="py-3 bg-[#FCE8E3] text-gray-800 rounded-xl hover:bg-[#FBD5CE] transition-colors">한도 변경</button>
              <button onclick="handleStopCard()" class="py-3 bg-orange-50 text-orange-700 rounded-xl hover:bg-orange-100 transition-colors">일시 정지</button>
              <button onclick="handleReportLost()" class="py-3 bg-red-50 text-red-700 rounded-xl hover:bg-red-100 transition-colors">분실 신고</button>
            </div>
            <div id="actionsStopped" class="hidden grid grid-cols-2 gap-4">
              <button onclick="handleResumeCard()" class="py-3 bg-green-50 text-green-700 rounded-xl hover:bg-green-100 transition-colors">사용 재개</button>
              <button onclick="handleReportLost()" class="py-3 bg-red-50 text-red-700 rounded-xl hover:bg-red-100 transition-colors">분실 신고로 전환</button>
            </div>
            <div id="actionsLost" class="hidden">
              <a th:href="@{/mypage/card/step1}" class="w-full block text-center py-3 bg-[#F5A5A5] text-white rounded-xl hover:bg-[#F28B8B] transition-colors">재발급 신청</a>
            </div>
          </div>
        </div>

        <div class="bg-white rounded-3xl shadow-sm p-8 mb-6">
          <h2 class="text-lg text-gray-800 mb-6">카드 관리</h2>
          <div class="grid grid-cols-2 gap-4">
            <button class="py-4 bg-[#FAFAFA] text-gray-800 rounded-2xl hover:bg-gray-100 transition-colors text-left px-5">
              <p class="text-sm text-gray-600 mb-1">💳 카드 정보</p>
              <p class="text-gray-800">전체 정보 보기</p>
            </button>
            <button class="py-4 bg-[#FAFAFA] text-gray-800 rounded-2xl hover:bg-gray-100 transition-colors text-left px-5">
              <p class="text-sm text-gray-600 mb-1">📊 거래 내역</p>
              <p class="text-gray-800">최근 거래 확인</p>
            </button>
            <button class="py-4 bg-[#FAFAFA] text-gray-800 rounded-2xl hover:bg-gray-100 transition-colors text-left px-5">
              <p class="text-sm text-gray-600 mb-1">💰 한도 변경</p>
              <p class="text-gray-800">결제 한도 설정</p>
            </button>
            <button class="py-4 bg-[#FAFAFA] text-gray-800 rounded-2xl hover:bg-gray-100 transition-colors text-left px-5">
              <p class="text-sm text-gray-600 mb-1">🔄 재발급</p>
              <p class="text-gray-800">새 카드 발급</p>
            </button>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<th:block th:replace="~{common/layout/footer :: footer}"></th:block>

<script th:inline="javascript">
  const serverCardDesign = /*[[${cardDesign}]]*/ 'pink';
  const serverCardType   = /*[[${cardType}]]*/ 'domestic';
  let cardStatus         = /*[[${cardStatus}]]*/ 'ACTIVE';

  const cardColors = {
    mint:   'from-[#A8E6CF] to-[#7FD4B5]',
    pink:   'from-[#FFB6C1] to-[#FF8FA3]',
    yellow: 'from-[#FFE5A0] to-[#FFD580]',
    purple: 'from-[#D4A5E8] to-[#B57EDC]'
  };
  const cardTypeNames = { domestic: '국내전용', global: '마스터카드' };

  window.addEventListener('DOMContentLoaded', () => {
    const isIssued = /*[[${cardIssued}]]*/ false;
    if (isIssued) {
      initCardVisual();
      updateCardStatus(cardStatus);
    }
    lucide.createIcons();
  });

  function initCardVisual() {
    const visual = document.getElementById('cardVisual');
    const colors = (cardColors[serverCardDesign] || cardColors.pink).split(' ');
    visual.classList.add('bg-gradient-to-br', ...colors);
    document.getElementById('cardTypeName').textContent = cardTypeNames[serverCardType] || '국내전용';
  }

  function updateCardStatus(status) {
    cardStatus = status;
    const banners = {
      ACTIVE:  { bg:'bg-green-50', border:'border-green-200', icon:'✅', title:'모든 기능 사용 가능', desc:'정상 작동 중입니다', badge:'정상', badgeCls:'bg-green-50 text-green-600', dot:'bg-green-500' },
      STOPPED: { bg:'bg-orange-50', border:'border-orange-200', icon:'⏸️', title:'사용 일시 중지', desc:'언제든 재개할 수 있어요', badge:'일시 정지', badgeCls:'bg-orange-50 text-orange-600', dot:'bg-orange-500' },
      LOST:    { bg:'bg-red-50', border:'border-red-200', icon:'🚨', title:'사용 불가', desc:'재발급 신청이 필요해요', badge:'분실 신고됨', badgeCls:'bg-red-50 text-red-600', dot:'bg-red-500' }
    };
    const s = banners[status] || banners.ACTIVE;
    const banner = document.getElementById('cardStatusBanner');
    banner.className = `rounded-3xl p-6 mb-6 border-2 ${s.bg} ${s.border}`;
    document.getElementById('cardStatusIcon').textContent = s.icon;
    document.getElementById('cardStatusTitle').textContent = s.title;
    document.getElementById('cardStatusDesc').textContent = s.desc;

    ['cardStatusBadge','cardStatusBadge2'].forEach(id => {
      const el = document.getElementById(id);
      if(el) {
        el.className = `px-4 py-2 rounded-xl text-sm flex items-center gap-2 ${s.badgeCls}`;
        el.innerHTML = `<div class="w-2 h-2 rounded-full ${s.dot}"></div>${s.badge}`;
      }
    });

    const overlay = document.getElementById('cardOverlay');
    if(overlay) {
      overlay.classList.toggle('hidden', status === 'ACTIVE');
      document.getElementById('cardOverlayText').textContent = status === 'STOPPED' ? '일시 정지' : '사용 불가';
    }

    document.getElementById('actionsActive').classList.toggle('hidden', status !== 'ACTIVE');
    document.getElementById('actionsStopped').classList.toggle('hidden', status !== 'STOPPED');
    document.getElementById('actionsLost').classList.toggle('hidden', status !== 'LOST');
  }

  function toggleCardNumber() {
    const numEl  = document.getElementById('cardNumDisplay');
    const label  = document.getElementById('cardNumLabel');
    const hint   = document.getElementById('cardNumHint');
    const icon   = document.getElementById('eyeCardNum');
    const showing = numEl.textContent === '1234 5678 9012 3456';
    numEl.textContent = showing ? '**** **** **** 3456' : '1234 5678 9012 3456';
    label.textContent = showing ? '전체 보기' : '숨기기';
    hint.classList.toggle('hidden', !showing);
    icon.setAttribute('data-lucide', showing ? 'eye' : 'eye-off');
    lucide.createIcons();
  }

  function toggleCVV() {
    const el = document.getElementById('cvvDisplay');
    const icon = document.getElementById('eyeCvv');
    const showing = el.textContent === '123';
    el.textContent = showing ? '***' : '123';
    icon.setAttribute('data-lucide', showing ? 'eye' : 'eye-off');
    lucide.createIcons();
  }

  function handleStopCard() {
    if (confirm('카드를 일시 정지할까요?\n\n정지하면:\n• 모든 결제가 차단됩니다\n• 언제든 재개할 수 있어요')) { updateCardStatus('STOPPED'); }
  }
  function handleResumeCard() {
    if (confirm('카드 사용을 재개할까요?\n\n재개하면:\n• 즉시 결제가 가능합니다')) { updateCardStatus('ACTIVE'); }
  }
  function handleReportLost() {
    if (confirm('정말 분실 신고하시겠어요?\n\n신고하면:\n• 즉시 사용이 중지됩니다\n• 재발급이 필요합니다\n• 되돌릴 수 없어요')) { updateCardStatus('LOST'); }
  }
</script>
<th:block th:replace="~{common/layout/header :: scripts}"></th:block>
</body>
</html>
