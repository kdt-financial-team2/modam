<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>이체 실패 - 모담</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen flex flex-col bg-white">
  <div th:replace="~{common/layout/header :: nav}"></div>
  <main class="flex-1 w-full max-w-[1440px] mx-auto bg-[#FAFAFA]">
    <div class="max-w-[600px] mx-auto px-8 py-12">
      <div class="bg-white rounded-3xl shadow-sm p-12 text-center">
        <div class="w-24 h-24 bg-gradient-to-br from-red-100 to-red-200 rounded-full flex items-center justify-center mx-auto mb-6">
          <i data-lucide="x-circle" class="w-14 h-14 text-red-400"></i>
        </div>
        <h1 class="text-4xl font-bold text-gray-900 mb-3">이체 실패</h1>
        <p class="text-lg text-red-500 mb-10" th:text="${failedTransfer.reason}">이체에 실패했습니다</p>

        <div class="bg-red-50 rounded-2xl p-8 mb-8 text-left space-y-4">
          <div class="flex justify-between">
            <span class="text-gray-500">요청 금액</span>
            <span class="font-medium text-gray-900">₩<span th:text="${#numbers.formatInteger(failedTransfer.amount, 0, 'COMMA')}">0</span></span>
          </div>
          <div class="flex justify-between">
            <span class="text-gray-500">현재 잔액</span>
            <span class="font-medium text-red-500">₩<span th:text="${#numbers.formatInteger(failedTransfer.currentBalance, 0, 'COMMA')}">0</span></span>
          </div>
        </div>

        <div class="flex gap-4">
          <a th:href="@{/transfer}" class="flex-1 py-4 bg-[#F5A5A5] text-white rounded-2xl hover:bg-[#F28B8B] transition-colors text-center font-medium">다시 시도</a>
          <a th:href="@{/dashboard}" class="flex-1 py-4 bg-gray-100 text-gray-700 rounded-2xl hover:bg-gray-200 transition-colors text-center font-medium">대시보드</a>
        </div>
      </div>
    </div>
  </main>
  <div th:replace="~{common/layout/footer :: footer}"></div>
  <script>lucide.createIcons();</script>
</body>
</html>
