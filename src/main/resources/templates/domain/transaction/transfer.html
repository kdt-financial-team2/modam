<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>간편 이체 - 모담</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen flex flex-col bg-white">

  <div th:replace="~{common/layout/header :: nav}"></div>

  <main class="flex-1 w-full max-w-[1440px] mx-auto bg-[#FAFAFA]">
    <div class="max-w-[800px] mx-auto px-8 py-12">
      <div class="mb-8">
        <h1 class="text-3xl text-gray-800">간편 이체</h1>
        <p class="text-gray-600 mt-2">빠르고 안전하게 송금하세요</p>
      </div>

      <div class="bg-white rounded-3xl shadow-sm p-10">
        <form th:action="@{/transfer}" method="post" id="transferForm">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

          <div class="space-y-6">
            <!-- 은행 선택 -->
            <div>
              <label class="block text-gray-800 mb-2 text-lg">은행</label>
              <select name="bankName" id="bankName" class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:border-[#F5A5A5] focus:outline-none transition-colors text-gray-800">
                <option value="">은행을 선택하세요</option>
                <option value="kb">국민은행</option>
                <option value="shinhan">신한은행</option>
                <option value="woori">우리은행</option>
                <option value="hana">하나은행</option>
                <option value="nh">농협은행</option>
                <option value="kakao">카카오뱅크</option>
                <option value="toss">토스뱅크</option>
              </select>
            </div>

            <!-- 계좌번호 -->
            <div>
              <label class="block text-gray-800 mb-2 text-lg">계좌번호</label>
              <input type="text" name="accountNumber" id="accountNumber"
                     class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:border-[#F5A5A5] focus:outline-none transition-colors text-gray-800"
                     placeholder="계좌번호를 입력하세요 (- 제외)"
                     oninput="this.value = this.value.replace(/[^0-9]/g, '')"/>
            </div>

            <!-- 금액 -->
            <div>
              <label class="block text-gray-800 mb-2 text-lg">금액</label>
              <div class="relative">
                <input type="text" name="amount" id="amount"
                       class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:border-[#F5A5A5] focus:outline-none transition-colors text-gray-800"
                       placeholder="송금할 금액을 입력하세요"
                       oninput="formatAmount(this)"/>
                <span class="absolute right-5 top-1/2 -translate-y-1/2 text-gray-600">원</span>
              </div>
              <p class="text-sm text-gray-500 mt-2 hidden" id="amountDisplay"></p>
            </div>

            <!-- 빠른 금액 버튼 -->
            <div class="grid grid-cols-4 gap-3">
              <button type="button" onclick="addAmount(10000)" class="py-3 bg-[#FCE8E3] text-gray-800 rounded-xl hover:bg-[#FBD5CE] transition-colors">+1만</button>
              <button type="button" onclick="addAmount(30000)" class="py-3 bg-[#FCE8E3] text-gray-800 rounded-xl hover:bg-[#FBD5CE] transition-colors">+3만</button>
              <button type="button" onclick="addAmount(50000)" class="py-3 bg-[#FCE8E3] text-gray-800 rounded-xl hover:bg-[#FBD5CE] transition-colors">+5만</button>
              <button type="button" onclick="addAmount(100000)" class="py-3 bg-[#FCE8E3] text-gray-800 rounded-xl hover:bg-[#FBD5CE] transition-colors">+10만</button>
            </div>

            <!-- 현재 잔액 안내 -->
            <div class="bg-[#FCE8E3] rounded-2xl p-5 mt-6">
              <p class="text-sm text-gray-700">
                💡 현재 잔액: ₩<span th:text="${#numbers.formatInteger(currentBalance, 0, 'COMMA')}">0</span>원 &nbsp;|&nbsp; 1일 이체 한도: 500만원
              </p>
            </div>
          </div>

          <button type="submit" id="submitBtn"
                  class="w-full py-4 bg-gray-200 text-gray-400 cursor-not-allowed rounded-2xl mt-8 transition-all">
            송금하기
          </button>
        </form>
      </div>
    </div>
  </main>

  <div th:replace="~{common/layout/footer :: footer}"></div>

  <script>
    lucide.createIcons();

    function toggleNotifications() {
      document.getElementById('notificationDropdown').classList.toggle('hidden');
      document.getElementById('profileDropdown').classList.add('hidden');
    }
    function toggleProfile() {
      document.getElementById('profileDropdown').classList.toggle('hidden');
      document.getElementById('notificationDropdown').classList.add('hidden');
    }

    function formatAmount(input) {
      const raw = input.value.replace(/[^0-9]/g, '');
      input.value = raw;
      const display = document.getElementById('amountDisplay');
      if (raw) {
        display.textContent = parseInt(raw).toLocaleString() + '원';
        display.classList.remove('hidden');
      } else {
        display.classList.add('hidden');
      }
      updateSubmitBtn();
    }

    function addAmount(value) {
      const input = document.getElementById('amount');
      const current = parseInt(input.value || '0');
      input.value = current + value;
      formatAmount(input);
    }

    function updateSubmitBtn() {
      const btn = document.getElementById('submitBtn');
      const bank = document.getElementById('bankName').value;
      const account = document.getElementById('accountNumber').value;
      const amount = document.getElementById('amount').value;
      if (bank && account && amount) {
        btn.className = 'w-full py-4 bg-[#F5A5A5] text-white hover:bg-[#F28B8B] shadow-md rounded-2xl mt-8 transition-all';
        btn.disabled = false;
      } else {
        btn.className = 'w-full py-4 bg-gray-200 text-gray-400 cursor-not-allowed rounded-2xl mt-8 transition-all';
        btn.disabled = true;
      }
    }

    document.getElementById('bankName').addEventListener('change', updateSubmitBtn);
    document.getElementById('accountNumber').addEventListener('input', updateSubmitBtn);
  </script>
</body>
</html>
