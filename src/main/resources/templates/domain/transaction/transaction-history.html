<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>소비내역 - 모담</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="h-screen overflow-hidden bg-[#FAFAFA] flex flex-col">

  <!-- ===== 헤더 ===== -->
  <th:block th:replace="~{common/layout/header-dashboard :: nav}"></th:block>

  <!-- ===== 메인 콘텐츠 ===== -->
  <main class="flex-1 min-h-0 flex flex-col overflow-hidden">
    <div class="max-w-5xl mx-auto px-8 py-6 flex flex-col flex-1 min-h-0 overflow-hidden w-full">

      <!-- 고정 영역 -->
      <div class="flex-shrink-0">

      <!-- 페이지 헤더 + 현재 잔액 (한 줄) -->
      <div class="flex items-center justify-between mb-3">
        <div>
          <h1 class="text-2xl font-bold text-gray-900 mb-0.5">소비내역</h1>
          <p class="text-sm text-gray-600">모든 거래 내역을 확인하세요</p>
        </div>
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 px-5 py-3">
          <p class="text-xs text-gray-500 mb-0.5">현재 잔액</p>
          <p class="text-xl font-bold text-gray-900">
            ₩<span th:text="${#numbers.formatInteger(currentBalance, 0, 'COMMA')}">1,487,500</span>
          </p>
        </div>
      </div>

      <!-- 필터 영역 -->
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-3 mb-3">
        <!-- 검색 -->
        <div class="relative mb-2">
          <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"></i>
          <input type="text" id="searchInput" oninput="applyFilters()"
                 placeholder="거래처 또는 메모 검색"
                 th:value="${searchQuery}"
                 class="w-full pl-9 pr-4 py-2 border-2 border-gray-200 rounded-xl text-sm focus:border-[#F5A5A5] focus:outline-none transition-colors" />
        </div>
        <!-- 기간 + 카테고리 -->
        <div class="flex items-center gap-2">
          <input type="date" id="startDateInput" onclick="this.showPicker()" onkeydown="return false"
                 class="bg-white border-2 border-gray-200 rounded-xl px-3 py-1.5 text-gray-900 font-medium cursor-pointer hover:border-[#F5A5A5] transition-colors text-sm select-none" />
          <span class="text-gray-400 font-semibold">~</span>
          <input type="date" id="endDateInput" onclick="this.showPicker()" onkeydown="return false"
                 class="bg-white border-2 border-gray-200 rounded-xl px-3 py-1.5 text-gray-900 font-medium cursor-pointer hover:border-[#F5A5A5] transition-colors text-sm select-none" />
          <button onclick="applyFilters()"
                  class="flex items-center gap-1.5 px-4 py-1.5 bg-[#F5A5A5] text-white rounded-xl text-sm font-semibold hover:bg-[#F28B8B] active:scale-95 transition-all">
            <i data-lucide="search" class="w-4 h-4"></i>
            조회
          </button>
          <div class="relative ml-auto">
            <select id="categorySelect" onchange="applyFilters()"
                    class="appearance-none bg-white border-2 border-gray-200 rounded-xl px-4 py-1.5 pr-9 cursor-pointer hover:border-[#F5A5A5] transition-colors font-medium text-sm text-gray-800">
              <option value="전체">전체</option>
              <option value="식비">식비</option>
              <option value="데이트">데이트</option>
              <option value="생활비">생활비</option>
              <option value="교통비">교통비</option>
              <option value="쇼핑">쇼핑</option>
              <option value="기타">기타</option>
            </select>
            <i data-lucide="chevron-down" class="absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400 pointer-events-none"></i>
          </div>
        </div>
      </div>

      <!-- 거래 유형 필터 탭 -->
      <div class="flex items-center gap-2 mb-3">
        <button id="typeBtn-all" onclick="setTypeFilter('all')"
                class="px-4 py-1.5 rounded-full text-sm font-semibold transition-colors bg-gray-900 text-white">
          전체
        </button>
        <button id="typeBtn-deposit" onclick="setTypeFilter('deposit')"
                class="px-4 py-1.5 rounded-full text-sm font-semibold transition-colors bg-white border-2 border-gray-200 text-gray-600 hover:border-blue-400 hover:text-blue-500">
          입금
        </button>
        <button id="typeBtn-withdrawal" onclick="setTypeFilter('withdrawal')"
                class="px-4 py-1.5 rounded-full text-sm font-semibold transition-colors bg-white border-2 border-gray-200 text-gray-600 hover:border-[#F5A5A5] hover:text-[#F5A5A5]">
          출금
        </button>
      </div>

      </div><!-- /고정 영역 끝 -->

      <!-- 거래 내역 테이블: flex-1로 남은 높이를 채우고, 목록 영역만 스크롤 -->
      <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden flex flex-col flex-1 min-h-0">

        <!-- 건수 표시 -->
        <div class="flex-shrink-0 flex items-center px-6 py-2 border-b border-gray-100 bg-white">
          <span class="text-sm text-gray-500">총 <strong id="countNum" class="text-gray-900">0</strong>건 조회</span>
        </div>

        <!-- 테이블 헤더 (고정) - 연핑크 배경으로 데이터 행과 구분 강조 -->
        <div class="flex-shrink-0 grid grid-cols-12 gap-4 px-6 py-3 bg-[#FCE8E3] border-b border-[#F5A5A5]/40 text-xs font-semibold text-[#b85c5c]">
          <div class="col-span-1">날짜/시간</div>
          <div class="col-span-1">구분</div>
          <div class="col-span-3">거래처</div>
          <div class="col-span-2">카드</div>
          <div class="col-span-2">카테고리</div>
          <div class="col-span-2 text-right">거래금액</div>
          <div class="col-span-1 text-right">잔액</div>
        </div>

        <!-- 서버사이드 렌더링 (Thymeleaf): JS 렌더로 통일하여 항상 숨김 처리 -->
        <div id="transactionList" class="hidden">
          <th:block th:each="group : ${groupedTransactions}">
            <!-- 날짜 헤더 -->
            <div class="px-6 py-2 bg-[#FAFAFA] border-b border-gray-100">
              <p class="text-xs font-semibold text-gray-700" th:text="${group.key}">2026.05.07</p>
            </div>
            <!-- 해당 날짜 거래 목록 -->
            <div th:each="tx : ${group.value}"
                 class="grid grid-cols-12 gap-4 px-6 py-3 border-b border-gray-100 hover:bg-gray-50 transition-colors cursor-pointer items-center"
                 th:attr="data-merchant=${tx.merchant},data-category=${tx.category},data-date=${tx.date},data-type=${tx.type}">

              <!-- 시간 -->
              <div class="col-span-1 text-xs text-gray-600" th:text="${tx.time}">14:30</div>

              <!-- 구분 -->
              <div class="col-span-1">
                <span th:classappend="${tx.type == 'deposit'} ? 'bg-blue-50 text-blue-600' : 'bg-gray-100 text-gray-700'"
                      class="inline-block px-2 py-0.5 rounded-full text-xs font-medium"
                      th:text="${tx.type == 'deposit'} ? '입금' : '출금'">출금</span>
              </div>

              <!-- 거래처 -->
              <div class="col-span-3 flex items-center gap-2">
                <div class="w-8 h-8 bg-[#FCE8E3] rounded-lg flex items-center justify-center flex-shrink-0">
                  <i th:attr="data-lucide=${tx.iconName}" class="w-4 h-4 text-[#F5A5A5]"></i>
                </div>
                <span class="text-sm font-medium text-gray-900" th:text="${tx.merchant}">스타벅스 강남점</span>
              </div>

              <!-- 카드 -->
              <div class="col-span-2 text-xs text-gray-600" th:text="${tx.cardName}">모담 체크카드</div>

              <!-- 카테고리 -->
              <div class="col-span-2">
                <span class="inline-block px-2 py-0.5 bg-[#FCE8E3] text-[#F5A5A5] rounded-full text-xs font-medium"
                      th:text="${tx.category}">식비</span>
              </div>

              <!-- 금액 -->
              <div class="col-span-2 text-right">
                <span th:classappend="${tx.type == 'deposit'} ? 'text-blue-600' : 'text-gray-900'"
                      class="text-sm font-bold">
                  <th:block th:if="${tx.type == 'deposit'}">+</th:block>
                  <th:block th:text="${#numbers.formatInteger(tx.amount, 0, 'COMMA')}">-12,500</th:block>원
                </span>
              </div>

              <!-- 잔액 -->
              <div class="col-span-1 text-right text-xs text-gray-500"
                   th:text="${#numbers.formatInteger(tx.balance, 0, 'COMMA')}">1,487,500</div>
            </div>
          </th:block>

          <!-- 거래 없음 -->
          <div id="emptyMsg" class="hidden py-20 text-center">
            <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
              <i data-lucide="search-x" class="w-8 h-8 text-gray-400"></i>
            </div>
            <p class="text-gray-500 text-lg">검색 결과가 없습니다</p>
            <p class="text-gray-400 text-sm mt-2">다른 조건으로 검색해보세요</p>
          </div>
        </div>

        <!-- 클라이언트사이드 폴백 (서버 데이터 없을 때 JS로 렌더) -->
        <div id="jsTransactionList" class="hidden flex-1 overflow-y-auto min-h-0"></div>

      </div>


    </div>
  </main>

  <!-- ===== 푸터 ===== -->
  <th:block th:replace="~{common/layout/footer :: footer}"></th:block>

  <script th:inline="javascript">
    /* ===== 서버 데이터 주입 ===== */
    const serverTransactions = /*[[${transactions}]]*/ null;

    /* ===== 클라이언트 폴백 데이터 ===== */
    const fallbackTransactions = [
      { id:1,  type:'withdrawal', merchant:'스타벅스 강남점',      amount:-12500,   balance:1487500,  date:'2026.05.07', time:'14:30', category:'식비',   iconName:'coffee',       cardName:'모담 체크카드' },
      { id:2,  type:'withdrawal', merchant:'홈플러스 광명점',       amount:-85000,   balance:1402500,  date:'2026.05.06', time:'18:45', category:'생활비', iconName:'shopping-bag', cardName:'모담 체크카드' },
      { id:3,  type:'deposit',    merchant:'김민수',                amount:50000,    balance:1487500,  date:'2026.05.06', time:'10:20', category:'입금',   iconName:'wallet',       cardName:'-' },
      { id:4,  type:'withdrawal', merchant:'CGV 여의도',            amount:-32000,   balance:1437500,  date:'2026.05.05', time:'19:20', category:'데이트', iconName:'heart',        cardName:'모담 체크카드' },
      { id:5,  type:'withdrawal', merchant:'GS주유소',              amount:-65000,   balance:1405500,  date:'2026.05.04', time:'09:15', category:'교통비', iconName:'car',          cardName:'모담 체크카드' },
      { id:6,  type:'withdrawal', merchant:'올리브영 압구정',        amount:-45000,   balance:1470500,  date:'2026.05.03', time:'16:00', category:'쇼핑',   iconName:'shopping-bag', cardName:'모담 체크카드' },
      { id:7,  type:'withdrawal', merchant:'배달의민족',             amount:-28000,   balance:1515500,  date:'2026.05.02', time:'20:30', category:'식비',   iconName:'utensils',     cardName:'모담 체크카드' },
      { id:8,  type:'deposit',    merchant:'급여',                  amount:3000000,  balance:1543500,  date:'2026.05.01', time:'09:00', category:'입금',   iconName:'wallet',       cardName:'-' },
      { id:9,  type:'withdrawal', merchant:'쿠팡',                  amount:-120000,  balance:1456500,  date:'2026.04.30', time:'15:40', category:'쇼핑',   iconName:'shopping-bag', cardName:'모담 체크카드' },
      { id:10, type:'withdrawal', merchant:'넷플릭스',               amount:-17000,   balance:1336500,  date:'2026.04.30', time:'00:05', category:'생활비', iconName:'home',         cardName:'모담 체크카드' },
      { id:11, type:'withdrawal', merchant:'스타벅스 역삼점',        amount:-8500,    balance:1319500,  date:'2026.04.29', time:'11:15', category:'식비',   iconName:'coffee',       cardName:'모담 체크카드' },
      { id:12, type:'withdrawal', merchant:'롯데시네마 월드타워',     amount:-36000,   balance:1311000,  date:'2026.04.28', time:'18:50', category:'데이트', iconName:'heart',        cardName:'모담 체크카드' },
    ];

    const allTransactions = serverTransactions || fallbackTransactions;
    const BATCH_SIZE = 20;       // 한 번에 불러오는 건수
    let filteredData = [...allTransactions];
    let displayedCount = 0;      // 현재 화면에 표시된 건수
    let lastLoadedDate = null;   // 마지막으로 렌더된 날짜 (날짜 헤더 중복 방지)
    let isLoading = false;       // 스크롤 중 중복 로드 방지
    let typeFilter = 'all';      // 거래 유형 필터: all | deposit | withdrawal

    /* ===== 거래 유형 탭 전환 ===== */
    function setTypeFilter(type) {
      typeFilter = type;

      /* 탭 버튼 스타일 초기화 후 활성 버튼 강조 */
      const btnAll        = document.getElementById('typeBtn-all');
      const btnDeposit    = document.getElementById('typeBtn-deposit');
      const btnWithdrawal = document.getElementById('typeBtn-withdrawal');
      const inactive = 'bg-white border-2 border-gray-200 text-gray-600';
      const activeAll        = 'bg-gray-900 text-white border-2 border-gray-900';
      const activeDeposit    = 'bg-blue-500 text-white border-2 border-blue-500';
      const activeWithdrawal = 'bg-[#F5A5A5] text-white border-2 border-[#F5A5A5]';

      [btnAll, btnDeposit, btnWithdrawal].forEach(btn => {
        btn.className = btn.className.replace(/bg-\S+|text-\S+|border-\S+/g, '').trim();
        btn.className += ' px-4 py-1.5 rounded-full text-sm font-semibold transition-colors ' + inactive;
      });

      if (type === 'all')        btnAll.className        = 'px-4 py-1.5 rounded-full text-sm font-semibold transition-colors ' + activeAll;
      else if (type === 'deposit')    btnDeposit.className    = 'px-4 py-1.5 rounded-full text-sm font-semibold transition-colors ' + activeDeposit;
      else if (type === 'withdrawal') btnWithdrawal.className = 'px-4 py-1.5 rounded-full text-sm font-semibold transition-colors ' + activeWithdrawal;

      applyFilters();
    }

    /* ===== 필터 적용 ===== */
    function applyFilters() {
      const query     = document.getElementById('searchInput').value.trim().toLowerCase();
      const startDate = document.getElementById('startDateInput').value; // 'yyyy-MM-dd'
      const endDate   = document.getElementById('endDateInput').value;   // 'yyyy-MM-dd'
      const category  = document.getElementById('categorySelect').value;

      filteredData = allTransactions.filter(tx => {
        const matchSearch   = !query    || tx.merchant.toLowerCase().includes(query);
        const matchCategory = category === '전체' || tx.category === category;
        const txDateNorm    = tx.date.replace(/\./g, '-'); // '2026.05.07' → '2026-05-07'
        const matchDate     = (!startDate || txDateNorm >= startDate) &&
                              (!endDate   || txDateNorm <= endDate);
        const matchType     = typeFilter === 'all' || tx.type === typeFilter;
        return matchSearch && matchCategory && matchDate && matchType;
      });

      renderList();
    }

    /* ===== 거래 행 HTML 생성 ===== */
    function txRowHTML(tx) {
      return `
        <div class="col-span-1 text-xs text-gray-600">${tx.time}</div>
        <div class="col-span-1">
          <span class="inline-block px-2 py-0.5 rounded-full text-xs font-medium ${tx.type === 'deposit' ? 'bg-blue-50 text-blue-600' : 'bg-gray-100 text-gray-700'}">
            ${tx.type === 'deposit' ? '입금' : '출금'}
          </span>
        </div>
        <div class="col-span-3 flex items-center gap-2">
          <div class="w-8 h-8 bg-[#FCE8E3] rounded-lg flex items-center justify-center flex-shrink-0">
            <i data-lucide="${tx.iconName}" class="w-4 h-4 text-[#F5A5A5]"></i>
          </div>
          <span class="text-sm font-medium text-gray-900">${tx.merchant}</span>
        </div>
        <div class="col-span-2 text-xs text-gray-600">${tx.cardName}</div>
        <div class="col-span-2">
          <span class="inline-block px-2 py-0.5 bg-[#FCE8E3] text-[#F5A5A5] rounded-full text-xs font-medium">${tx.category}</span>
        </div>
        <div class="col-span-2 text-right">
          <span class="text-sm font-bold ${tx.type === 'deposit' ? 'text-blue-600' : 'text-gray-900'}">
            ${tx.amount > 0 ? '+' : ''}${tx.amount.toLocaleString()}원
          </span>
        </div>
        <div class="col-span-1 text-right text-xs text-gray-500">${tx.balance.toLocaleString()}</div>
      `;
    }

    /* ===== 목록 초기화 및 첫 배치 렌더 ===== */
    function renderList() {
      displayedCount = 0;
      lastLoadedDate = null;
      isLoading = false;

      /* 건수 업데이트 */
      document.getElementById('countNum').textContent = filteredData.length.toLocaleString();

      /* JS 렌더 영역 표시 */
      document.getElementById('transactionList').classList.add('hidden');
      const container = document.getElementById('jsTransactionList');
      container.classList.remove('hidden');
      container.innerHTML = '';

      if (filteredData.length === 0) {
        container.innerHTML = `
          <div class="py-20 text-center">
            <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
              <i data-lucide="search-x" class="w-8 h-8 text-gray-400"></i>
            </div>
            <p class="text-gray-500 text-lg">검색 결과가 없습니다</p>
            <p class="text-gray-400 text-sm mt-2">다른 조건으로 검색해보세요</p>
          </div>`;
        lucide.createIcons();
        return;
      }

      loadMore();
    }

    /* ===== 무한 스크롤: 다음 배치를 DOM에 추가 ===== */
    function loadMore() {
      if (isLoading || displayedCount >= filteredData.length) return;
      isLoading = true;

      const newItems = filteredData.slice(displayedCount, displayedCount + BATCH_SIZE);
      const container = document.getElementById('jsTransactionList');
      const fragment = document.createDocumentFragment();

      /* 날짜별 그룹핑 */
      const grouped = {};
      newItems.forEach(tx => {
        if (!grouped[tx.date]) grouped[tx.date] = [];
        grouped[tx.date].push(tx);
      });

      Object.entries(grouped).forEach(([date, txList], idx) => {
        /* 이전 배치 마지막 날짜와 같으면 날짜 헤더 생략 (중복 방지) */
        if (!(idx === 0 && date === lastLoadedDate)) {
          const headerEl = document.createElement('div');
          headerEl.className = 'px-6 py-2 bg-[#FAFAFA] border-b border-gray-100 sticky top-0 z-10';
          headerEl.innerHTML = `<p class="text-sm font-semibold text-gray-700">${date}</p>`;
          fragment.appendChild(headerEl);
        }

        txList.forEach(tx => {
          const rowEl = document.createElement('div');
          rowEl.className = 'grid grid-cols-12 gap-4 px-6 py-3 border-b border-gray-100 hover:bg-gray-50 transition-colors cursor-pointer items-center';
          rowEl.innerHTML = txRowHTML(tx);
          fragment.appendChild(rowEl);
        });
      });

      /* 마지막으로 로드된 날짜 기록 */
      if (newItems.length > 0) {
        lastLoadedDate = newItems[newItems.length - 1].date;
      }
      displayedCount += newItems.length;

      /* 모든 데이터 로드 완료 시 끝 표시 */
      if (displayedCount >= filteredData.length) {
        const endEl = document.createElement('div');
        endEl.className = 'py-6 text-center text-sm text-gray-400';
        endEl.textContent = '마지막 내역입니다';
        fragment.appendChild(endEl);
      }

      container.appendChild(fragment);
      lucide.createIcons();
      isLoading = false;
    }

    /* ===== 초기 렌더 ===== */
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();

      /* 기본 기간: 최근 1년 */
      const today = new Date();
      const oneYearAgo = new Date(today);
      oneYearAgo.setFullYear(today.getFullYear() - 1);
      const fmt = d => d.toISOString().slice(0, 10); // 'yyyy-MM-dd'
      document.getElementById('startDateInput').value = fmt(oneYearAgo);
      document.getElementById('endDateInput').value   = fmt(today);

      /* 필터 적용 후 렌더 */
      applyFilters();

      /* 무한 스크롤: 컨테이너 하단 100px 이내 진입 시 추가 로드 */
      document.getElementById('jsTransactionList').addEventListener('scroll', function() {
        if (this.scrollTop + this.clientHeight >= this.scrollHeight - 100) {
          loadMore();
        }
      });
    });
  </script>
  <th:block th:replace="~{common/layout/header-dashboard :: scripts}"></th:block>
</body>
</html>
