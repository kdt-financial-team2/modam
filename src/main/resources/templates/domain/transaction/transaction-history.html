<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>거래 내역 - 모담</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen flex flex-col bg-white">
  <div th:replace="~{fragments/header :: nav}"></div>

  <main class="flex-1 w-full max-w-[1440px] mx-auto bg-gray-50">
    <div class="px-8 py-12">
      <h1 class="text-4xl font-bold text-gray-900 mb-3">거래 내역</h1>
      <p class="text-gray-600 text-lg mb-10">모든 거래 내역을 확인하세요</p>

      <!-- 필터 -->
      <div class="bg-white rounded-2xl p-6 mb-6 flex flex-wrap gap-4 items-center">
        <form th:action="@{/transaction-history}" method="get" class="flex flex-wrap gap-4 w-full">
          <select name="category" th:value="${selectedCategory}" class="px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-[#F5A5A5] focus:outline-none transition-colors">
            <option value="">전체 카테고리</option>
            <option value="식비">식비</option>
            <option value="생활비">생활비</option>
            <option value="데이트">데이트</option>
            <option value="교통비">교통비</option>
            <option value="쇼핑">쇼핑</option>
          </select>
          <input type="month" name="month" th:value="${selectedMonth}"
                 class="px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-[#F5A5A5] focus:outline-none transition-colors"/>
          <button type="submit" class="px-6 py-3 bg-[#F5A5A5] text-white rounded-xl hover:bg-[#F28B8B] transition-colors">검색</button>
        </form>
      </div>

      <!-- 거래 목록 -->
      <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-8">
        <div class="space-y-3">
          <div th:each="tx : ${transactions}" class="flex items-center justify-between p-5 rounded-2xl hover:bg-gray-50 transition-colors">
            <div class="flex items-center gap-4">
              <div class="w-12 h-12 bg-[#FCE8E3] rounded-xl flex items-center justify-center">
                <i th:attr="data-lucide=${tx.iconName}" class="w-6 h-6 text-[#F5A5A5]"></i>
              </div>
              <div>
                <div class="text-gray-900 font-medium mb-1" th:text="${tx.name}">가게 이름</div>
                <div class="text-sm text-gray-500">
                  <span th:text="${tx.date}">날짜</span> · <span th:text="${tx.time}">시간</span> · <span th:text="${tx.category}">카테고리</span>
                </div>
              </div>
            </div>
            <div class="text-right">
              <div class="text-lg font-bold" th:classappend="${tx.amount > 0} ? 'text-blue-600' : 'text-gray-900'"
                   th:text="${(tx.amount > 0 ? '+' : '') + #numbers.formatInteger(tx.amount, 0, 'COMMA') + '원'}">금액</div>
            </div>
          </div>
        </div>

        <!-- 페이지네이션 -->
        <div class="mt-8 flex justify-center gap-2">
          <a th:href="@{/transaction-history(page=${currentPage - 1}, category=${selectedCategory}, month=${selectedMonth})}"
             th:if="${currentPage > 0}"
             class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors">이전</a>
          <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
            <a th:href="@{/transaction-history(page=${i}, category=${selectedCategory}, month=${selectedMonth})}"
               th:text="${i + 1}"
               th:classappend="${i == currentPage} ? 'bg-[#F5A5A5] text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'"
               class="px-4 py-2 rounded-lg transition-colors">1</a>
          </span>
          <a th:href="@{/transaction-history(page=${currentPage + 1}, category=${selectedCategory}, month=${selectedMonth})}"
             th:if="${currentPage < totalPages - 1}"
             class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors">다음</a>
        </div>
      </div>
    </div>
  </main>

  <div th:replace="~{fragments/footer :: footer}"></div>
  <script>lucide.createIcons();</script>
</body>
</html>
