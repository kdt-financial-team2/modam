<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>소비 기록하기 - 모담</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen flex flex-col" style="background: linear-gradient(135deg, #FFF7F5 0%, #FCF3F0 100%)">

  <!-- 배경 장식 -->
  <div class="fixed top-20 right-20 w-96 h-96 bg-gradient-to-br from-[#FCE8E3]/20 to-[#F5E6E0]/20 rounded-full blur-3xl pointer-events-none"></div>
  <div class="fixed bottom-20 left-20 w-80 h-80 bg-gradient-to-br from-[#D9B8AE]/10 to-[#FCE8E3]/10 rounded-full blur-3xl pointer-events-none"></div>

  <!-- ===== 헤더 ===== -->
  <th:block th:replace="~{layout/header :: nav}"></th:block>

  <!-- ===== 메인 콘텐츠 ===== -->
  <main class="flex-1 relative z-10">
    <div class="max-w-[1200px] mx-auto px-8 py-12 w-full">

      <!-- 페이지 제목 -->
      <div class="text-center mb-12">
        <h1 class="text-4xl text-[#6E5A55] font-semibold mb-3">소중한 순간을 기록하세요</h1>
        <p class="text-[#A89089] text-lg">오늘의 소비와 추억을 담아보세요</p>
      </div>

      <!-- 폼 -->
      <form th:action="@{/consumption-upload}" action="/consumption-upload" method="post"
            enctype="multipart/form-data" onsubmit="return validateForm()">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <!-- 2열 레이아웃 -->
        <div class="grid grid-cols-2 gap-8 mb-8">

          <!-- 왼쪽: 사진 업로드 -->
          <div class="bg-white/80 backdrop-blur-sm rounded-[28px] shadow-lg p-8" style="border: 1px solid #F5E6E0">
            <h3 class="text-lg text-[#6E5A55] font-semibold mb-6">사진 추가</h3>

            <!-- 업로드 영역 -->
            <div id="dropZone"
                 onclick="document.getElementById('fileInput').click()"
                 ondragover="handleDragOver(event)"
                 ondragleave="handleDragLeave(event)"
                 ondrop="handleDrop(event)"
                 class="relative aspect-square rounded-[20px] border-2 border-dashed border-[#F5E6E0] hover:border-[#D9B8AE] bg-gradient-to-br from-[#FFF7F5] to-[#FCF3F0] transition-all cursor-pointer overflow-hidden">

              <!-- 이미지 미리보기 -->
              <img id="imagePreview" src="" alt="미리보기"
                   class="hidden w-full h-full object-cover" />

              <!-- 삭제 버튼 -->
              <button type="button" id="removeImageBtn"
                      onclick="event.stopPropagation(); removeImage()"
                      class="hidden absolute top-4 right-4 w-10 h-10 bg-white/90 backdrop-blur-sm rounded-full flex items-center justify-center hover:bg-white transition-all shadow-lg">
                <i data-lucide="x" class="w-5 h-5 text-[#6E5A55]"></i>
              </button>

              <!-- 플레이스홀더 -->
              <div id="uploadPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center">
                <div class="w-20 h-20 bg-gradient-to-br from-[#FCE8E3] to-[#F5E6E0] rounded-full flex items-center justify-center mb-4">
                  <i data-lucide="plus" class="w-10 h-10 text-[#D9B8AE]"></i>
                </div>
                <p class="text-[#A89089] mb-2">사진을 업로드해주세요</p>
                <p class="text-sm text-[#C4B5B0]">클릭하거나 드래그하여 추가</p>
              </div>
            </div>

            <input type="file" id="fileInput" name="image" accept="image/*"
                   onchange="handleFileSelect(this)" class="hidden" />
          </div>

          <!-- 오른쪽: 내용 작성 -->
          <div class="bg-white/80 backdrop-blur-sm rounded-[28px] shadow-lg p-8" style="border: 1px solid #F5E6E0">
            <h3 class="text-lg text-[#6E5A55] font-semibold mb-6">내용 작성</h3>

            <div class="space-y-4">

              <!-- 제목 -->
              <div>
                <label for="title" class="block text-sm text-[#6E5A55] font-medium mb-2">제목 *</label>
                <input type="text" id="title" name="title"
                       th:value="${record?.title}"
                       placeholder="예: 저녁 데이트"
                       class="w-full px-4 py-3 bg-[#FFF7F5] border border-[#F5E6E0] rounded-[16px] focus:outline-none focus:border-[#D9B8AE] transition-colors text-[#6E5A55] placeholder-[#C4B5B0]" />
              </div>

              <!-- 장소 -->
              <div>
                <label for="place" class="block text-sm text-[#6E5A55] font-medium mb-2">장소</label>
                <div class="relative">
                  <i data-lucide="map-pin" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-[#C4B5B0]"></i>
                  <input type="text" id="place" name="place"
                         th:value="${record?.place}"
                         placeholder="예: 이탈리안 레스토랑"
                         class="w-full pl-12 pr-4 py-3 bg-[#FFF7F5] border border-[#F5E6E0] rounded-[16px] focus:outline-none focus:border-[#D9B8AE] transition-colors text-[#6E5A55] placeholder-[#C4B5B0]" />
                </div>
              </div>

              <!-- 금액 + 날짜 -->
              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label for="amount" class="block text-sm text-[#6E5A55] font-medium mb-2">금액 *</label>
                  <div class="relative">
                    <i data-lucide="dollar-sign" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-[#C4B5B0]"></i>
                    <input type="text" id="amountDisplay"
                           placeholder="45,000"
                           oninput="syncAmount(this)"
                           class="w-full pl-12 pr-4 py-3 bg-[#FFF7F5] border border-[#F5E6E0] rounded-[16px] focus:outline-none focus:border-[#D9B8AE] transition-colors text-[#6E5A55] placeholder-[#C4B5B0]" />
                    <input type="hidden" id="amount" name="amount" th:value="${record?.amount}" />
                  </div>
                </div>
                <div>
                  <label for="date" class="block text-sm text-[#6E5A55] font-medium mb-2">날짜</label>
                  <div class="relative">
                    <i data-lucide="calendar" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-[#C4B5B0] pointer-events-none"></i>
                    <input type="date" id="date" name="date"
                           th:value="${record?.date}"
                           class="w-full pl-12 pr-4 py-3 bg-[#FFF7F5] border border-[#F5E6E0] rounded-[16px] focus:outline-none focus:border-[#D9B8AE] transition-colors text-[#6E5A55]" />
                  </div>
                </div>
              </div>

              <!-- 카테고리 -->
              <div>
                <label class="block text-sm text-[#6E5A55] font-medium mb-3">카테고리 *</label>
                <div class="flex gap-3">
                  <input type="hidden" id="categoryInput" name="category" th:value="${record?.category}" />

                  <button type="button" onclick="selectCategory('식비', this)"
                          class="category-btn flex-1 py-3 rounded-[16px] border-2 bg-[#FFF7F5] border-[#F5E6E0] hover:border-[#D9B8AE] transition-all">
                    <i data-lucide="coffee" class="w-5 h-5 mx-auto mb-1 text-[#C4B5B0]"></i>
                    <span class="text-sm text-[#A89089]">식비</span>
                  </button>
                  <button type="button" onclick="selectCategory('데이트', this)"
                          class="category-btn flex-1 py-3 rounded-[16px] border-2 bg-[#FFF7F5] border-[#F5E6E0] hover:border-[#D9B8AE] transition-all">
                    <i data-lucide="heart" class="w-5 h-5 mx-auto mb-1 text-[#C4B5B0]"></i>
                    <span class="text-sm text-[#A89089]">데이트</span>
                  </button>
                  <button type="button" onclick="selectCategory('쇼핑', this)"
                          class="category-btn flex-1 py-3 rounded-[16px] border-2 bg-[#FFF7F5] border-[#F5E6E0] hover:border-[#D9B8AE] transition-all">
                    <i data-lucide="shopping-bag" class="w-5 h-5 mx-auto mb-1 text-[#C4B5B0]"></i>
                    <span class="text-sm text-[#A89089]">쇼핑</span>
                  </button>
                  <button type="button" onclick="selectCategory('여행', this)"
                          class="category-btn flex-1 py-3 rounded-[16px] border-2 bg-[#FFF7F5] border-[#F5E6E0] hover:border-[#D9B8AE] transition-all">
                    <i data-lucide="plane" class="w-5 h-5 mx-auto mb-1 text-[#C4B5B0]"></i>
                    <span class="text-sm text-[#A89089]">여행</span>
                  </button>
                </div>
              </div>

              <!-- 메모 -->
              <div>
                <label for="memo" class="block text-sm text-[#6E5A55] font-medium mb-2">메모 *</label>
                <textarea id="memo" name="memo" rows="6"
                          placeholder="오늘의 소비와 추억을 기록해보세요..."
                          class="w-full px-4 py-3 bg-[#FFF7F5] border border-[#F5E6E0] rounded-[16px] focus:outline-none focus:border-[#D9B8AE] transition-colors text-[#6E5A55] placeholder-[#C4B5B0] resize-none"
                          style="line-height: 1.8"
                          th:text="${record?.memo}"></textarea>
              </div>
            </div>
          </div>
        </div>

        <!-- 서버 오류 메시지 -->
        <div th:if="${errorMessage}" class="mb-6 p-4 bg-red-50 border border-red-200 rounded-2xl text-center">
          <p class="text-red-600 text-sm" th:text="${errorMessage}"></p>
        </div>

        <!-- 제출 버튼 -->
        <div class="text-center">
          <div class="inline-block relative">
            <div class="absolute inset-0 bg-gradient-to-r from-[#D9B8AE]/30 to-[#C4A79D]/30 blur-xl rounded-full"></div>
            <button type="submit"
                    class="relative px-12 py-4 bg-gradient-to-r from-[#D9B8AE] to-[#C4A79D] text-white rounded-full hover:shadow-2xl transition-all text-lg font-semibold">
              소중한 순간 기록하기
            </button>
          </div>
          <p class="text-sm text-[#A89089] mt-4">* 필수 항목을 모두 입력해주세요</p>
        </div>

      </form>
    </div>
  </main>

  <!-- ===== 푸터 ===== -->
  <th:block th:replace="~{layout/footer :: footer}"></th:block>

  <script>
    /* ===== 이미지 업로드 ===== */
    function handleFileSelect(input) {
      const file = input.files[0];
      if (file && file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = e => showPreview(e.target.result);
        reader.readAsDataURL(file);
      }
    }

    function showPreview(src) {
      document.getElementById('imagePreview').src = src;
      document.getElementById('imagePreview').classList.remove('hidden');
      document.getElementById('removeImageBtn').classList.remove('hidden');
      document.getElementById('uploadPlaceholder').classList.add('hidden');
    }

    function removeImage() {
      document.getElementById('imagePreview').classList.add('hidden');
      document.getElementById('removeImageBtn').classList.add('hidden');
      document.getElementById('uploadPlaceholder').classList.remove('hidden');
      document.getElementById('fileInput').value = '';
    }

    function handleDragOver(e) {
      e.preventDefault();
      document.getElementById('dropZone').style.borderColor = '#D9B8AE';
      document.getElementById('dropZone').style.backgroundColor = 'rgba(252,232,227,0.3)';
    }

    function handleDragLeave(e) {
      e.preventDefault();
      document.getElementById('dropZone').style.borderColor = '';
      document.getElementById('dropZone').style.backgroundColor = '';
    }

    function handleDrop(e) {
      e.preventDefault();
      handleDragLeave(e);
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) {
        const dt = new DataTransfer();
        dt.items.add(file);
        document.getElementById('fileInput').files = dt.files;
        const reader = new FileReader();
        reader.onload = ev => showPreview(ev.target.result);
        reader.readAsDataURL(file);
      }
    }

    /* ===== 금액 포매팅 ===== */
    function syncAmount(el) {
      const raw = el.value.replace(/,/g, '').replace(/[^0-9]/g, '');
      if (raw === '') {
        el.value = '';
        document.getElementById('amount').value = '';
        return;
      }
      const num = parseInt(raw);
      el.value = num.toLocaleString();
      document.getElementById('amount').value = num;
    }

    /* ===== 카테고리 선택 ===== */
    function selectCategory(cat, btn) {
      document.querySelectorAll('.category-btn').forEach(b => {
        b.className = 'category-btn flex-1 py-3 rounded-[16px] border-2 bg-[#FFF7F5] border-[#F5E6E0] hover:border-[#D9B8AE] transition-all';
        b.querySelectorAll('i').forEach(i => i.style.color = '#C4B5B0');
        b.querySelectorAll('span').forEach(s => { s.style.color = '#A89089'; s.style.fontWeight = ''; });
      });
      btn.className = 'category-btn flex-1 py-3 rounded-[16px] border-2 bg-[#FCE8E3] border-[#D9B8AE] transition-all';
      btn.querySelectorAll('i').forEach(i => i.style.color = '#F5A5A5');
      btn.querySelectorAll('span').forEach(s => { s.style.color = '#6E5A55'; s.style.fontWeight = '600'; });
      document.getElementById('categoryInput').value = cat;
    }

    /* ===== 폼 검증 ===== */
    function validateForm() {
      const title    = document.getElementById('title').value.trim();
      const amount   = document.getElementById('amount').value;
      const category = document.getElementById('categoryInput').value;
      const memo     = document.getElementById('memo').value.trim();

      if (!title || !amount || !category || !memo) {
        alert('필수 항목(제목, 금액, 카테고리, 메모)을 모두 입력해주세요.');
        return false;
      }
      return true;
    }

    /* ===== 초기화 ===== */
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();

      /* 서버에서 전달된 기존 카테고리 복원 */
      const savedCat = document.getElementById('categoryInput').value;
      if (savedCat) {
        document.querySelectorAll('.category-btn').forEach(btn => {
          if (btn.querySelector('span') && btn.querySelector('span').textContent.trim() === savedCat) {
            selectCategory(savedCat, btn);
          }
        });
      }
    });
  </script>
  <th:block th:replace="~{layout/header :: scripts}"></th:block>
</body>
</html>
